<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interfone Virtual</title>

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        /* =================================
           1. VARIÁVEIS E ESTILOS GLOBAIS
           ================================= */
        :root {
            /* Tema Claro (Padrão) */
            --md-sys-color-primary: #6750A4;
            --md-sys-color-on-primary: #FFFFFF;
            --md-sys-color-primary-container: #EADDFF;
            --md-sys-color-on-primary-container: #21005D;
            --md-sys-color-secondary: #625B71;
            --md-sys-color-on-secondary: #FFFFFF;
            --md-sys-color-secondary-container: #E8DEF8;
            --md-sys-color-on-secondary-container: #1D192B;
            --md-sys-color-surface: #FFFBFE;
            --md-sys-color-on-surface: #1C1B1F;
            --md-sys-color-surface-variant: #E7E0EC;
            --md-sys-color-on-surface-variant: #49454F;
            --md-sys-color-error: #BA1A1A;
            --md-sys-color-on-error: #FFFFFF;
            --md-sys-color-error-container: #FFDAD6;
            --md-sys-color-on-error-container: #410002;
            --md-sys-color-outline: #79747E;
            --md-sys-color-shadow: #000000;
            --md-sys-color-success: #4CAF50;

            --md-ref-typeface-plain: 'Roboto', sans-serif;
        }

        /* Tema Escuro */
        body.dark-theme {
            --md-sys-color-primary: #D0BCFF;
            --md-sys-color-on-primary: #371E73;
            --md-sys-color-primary-container: #4F378B;
            --md-sys-color-on-primary-container: #EADDFF;
            --md-sys-color-secondary: #CCC2DC;
            --md-sys-color-on-secondary: #332D41;
            --md-sys-color-secondary-container: #4A4458;
            --md-sys-color-on-secondary-container: #E8DEF8;
            --md-sys-color-surface: #1C1B1F;
            --md-sys-color-on-surface: #E6E1E5;
            --md-sys-color-surface-variant: #49454F;
            --md-sys-color-on-surface-variant: #CAC4D0;
            --md-sys-color-error: #F2B8B5;
            --md-sys-color-on-error: #601410;
            --md-sys-color-error-container: #8C1D18;
            --md-sys-color-on-error-container: #F9DEDC;
            --md-sys-color-outline: #938F99;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--md-ref-typeface-plain);
        }

        body {
            background-color: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            transition: background-color 0.3s, color 0.3s;
        }
        
        /* Estilos para a barra de rolagem */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--md-sys-color-surface-variant); border-radius: 3px; }
        ::-webkit-scrollbar-thumb { background: var(--md-sys-color-outline); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--md-sys-color-primary); }

        /* =================================
           2. BOTÃO FLUTUANTE E BADGE
           ================================= */
        .chat-toggle {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background-color: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 5px -1px rgba(0,0,0,0.2), 0 6px 10px 0 rgba(0,0,0,0.14), 0 1px 18px 0 rgba(0,0,0,0.12);
            cursor: pointer;
            z-index: 1000;
            transition: all 0.3s ease;
        }

        .chat-toggle:hover {
            transform: scale(1.05);
        }

        .unread-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background-color: var(--md-sys-color-error);
            color: var(--md-sys-color-on-error);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 12px;
            font-weight: bold;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .unread-badge.pulse { animation: pulse 0.5s ease-in-out; }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        /* =================================
           3. CONTAINER PRINCIPAL DO CHAT
           ================================= */
        .chat-container {
            position: fixed;
            bottom: 90px;
            right: 24px;
            width: 360px;
            height: 550px;
            background-color: var(--md-sys-color-surface);
            border-radius: 12px;
            box-shadow: 0 8px 10px -5px rgba(0,0,0,0.2), 0 16px 24px 2px rgba(0,0,0,0.14), 0 6px 30px 5px rgba(0,0,0,0.12);
            display: flex;
            flex-direction: column;
            z-index: 999;
            overflow: hidden;
            transform: translateY(20px) scale(0.95);
            opacity: 0;
            visibility: hidden;
            transition: transform 0.3s ease, opacity 0.3s ease, visibility 0.3s;
        }

        .chat-container.active {
            transform: translateY(0) scale(1);
            opacity: 1;
            visibility: visible;
        }

        /* Cabeçalho */
        .chat-header {
            background-color: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .chat-title { font-size: 18px; font-weight: 500; }
        .chat-actions { display: flex; gap: 8px; }

        .chat-action-btn {
            background: none; border: none;
            color: var(--md-sys-color-on-primary);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            border-radius: 50%; width: 32px; height: 32px;
            transition: background-color 0.2s;
        }
        .chat-action-btn:hover { background-color: rgba(255, 255, 255, 0.1); }
        
        /* Abas */
        .chat-tabs {
            display: flex;
            background-color: var(--md-sys-color-surface-variant);
            border-bottom: 1px solid var(--md-sys-color-outline);
            flex-shrink: 0;
        }
        .chat-tab {
            flex: 1; padding: 12px 16px; text-align: center; cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
            font-weight: 500;
            border-bottom: 2px solid transparent;
        }
        .chat-tab.active {
            background-color: var(--md-sys-color-surface);
            border-bottom: 2px solid var(--md-sys-color-primary);
        }

        /* Conteúdo das Abas */
        .chat-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-tab-content {
            flex: 1; display: none; flex-direction: column; overflow: hidden;
        }
        .chat-tab-content.active { display: flex; }

        /* Estados de Vazio e Carregando */
        .empty-state, .loading {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 40px 20px; text-align: center; color: var(--md-sys-color-on-surface-variant);
        }
        .empty-state .material-icons { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
        .spinner {
            width: 24px; height: 24px; border: 3px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%; border-top-color: var(--md-sys-color-primary);
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* =================================
           4. LISTAS (CONVERSAS E USUÁRIOS)
           ================================= */
        .conversations-list, .users-list {
            flex: 1; overflow-y: auto; padding: 8px;
        }
        .conversation-item, .user-item {
            display: flex; align-items: center; padding: 12px;
            border-radius: 8px; margin-bottom: 8px; cursor: pointer;
            transition: background-color 0.2s;
        }
        .conversation-item:hover, .user-item:hover { background-color: var(--md-sys-color-surface-variant); }
        
        .conversation-avatar, .user-avatar {
            width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
            background-color: var(--md-sys-color-secondary-container);
            color: var(--md-sys-color-on-secondary-container);
            display: flex; align-items: center; justify-content: center;
            margin-right: 12px; font-weight: 500;
        }
        .conversation-info, .user-info { flex: 1; min-width: 0; }
        .conversation-name, .user-name {
            font-weight: 500; font-size: 14px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .user-details { font-size: 12px; color: var(--md-sys-color-on-surface-variant); }

        /* Específico de Conversas */
        .conversation-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .conversation-time { font-size: 11px; color: var(--md-sys-color-on-surface-variant); white-space: nowrap; }
        .conversation-preview { font-size: 12px; color: var(--md-sys-color-on-surface-variant); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .conversation-unread {
            background-color: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary);
            border-radius: 50%; width: 18px; height: 18px; font-size: 10px;
            display: flex; align-items: center; justify-content: center;
        }

        /* Status Online/Offline */
        .user-status {
            width: 8px; height: 8px; border-radius: 50%;
            background-color: var(--md-sys-color-success);
        }
        .user-status.offline { background-color: var(--md-sys-color-outline); }
        
        .conversation-actions, .user-actions {
            display: flex; gap: 8px; align-items: center; margin-left: 8px;
        }
        
        .call-list-btn { color: var(--md-sys-color-success); }
        .call-list-btn:hover { background-color: rgba(76, 175, 80, 0.1); }

        /* =================================
           5. TELA DE CONVERSA INDIVIDUAL
           ================================= */
        #conversationTab .conversation-header {
            padding: 12px 16px; border-bottom: 1px solid var(--md-sys-color-outline);
            justify-content: space-between; flex-shrink: 0;
        }
        .conversation-user { display: flex; align-items: center; }
        .conversation-back {
            background: none; border: none; color: var(--md-sys-color-primary);
            cursor: pointer; margin-right: 8px; display: flex;
        }
        
        /* Mensagens */
        .messages-container {
            flex: 1; overflow-y: auto; padding: 16px;
            display: flex; flex-direction: column; gap: 12px;
        }
        .message {
            max-width: 80%; padding: 12px; border-radius: 12px; position: relative;
        }
        .message.sent {
            align-self: flex-end; background-color: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary); border-bottom-right-radius: 4px;
        }
        .message.received {
            align-self: flex-start; background-color: var(--md-sys-color-surface-variant);
            color: var(--md-sys-color-on-surface-variant); border-bottom-left-radius: 4px;
        }
        .message-time { font-size: 10px; margin-top: 4px; text-align: right; opacity: 0.7; }
        
        /* Input de Mensagem */
        .message-input-container {
            display: flex; padding: 16px; border-top: 1px solid var(--md-sys-color-outline);
            gap: 8px; flex-shrink: 0;
        }
        .message-input {
            flex: 1; padding: 12px 16px; border: 1px solid var(--md-sys-color-outline);
            border-radius: 24px; outline: none; font-size: 14px;
            background-color: var(--md-sys-color-surface);
        }
        .message-input:focus { border-color: var(--md-sys-color-primary); }
        
        .send-button {
            background-color: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary);
            border: none; border-radius: 50%; width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            transition: background-color 0.2s;
        }

        /* =================================
           6. TELA DE CONFIGURAÇÕES
           ================================= */
        #settingsTab .settings-content {
            flex: 1; overflow-y: auto; padding: 16px;
        }
        .settings-section { margin-bottom: 24px; }
        .settings-title { font-size: 16px; font-weight: 500; margin-bottom: 12px; }
        .settings-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }

        .setting-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 0; border-bottom: 1px solid var(--md-sys-color-surface-variant);
        }
        .setting-item:last-child { border-bottom: none; }
        .setting-info { flex: 1; }
        .setting-label { font-weight: 500; font-size: 14px; margin-bottom: 2px; }
        .setting-description { font-size: 12px; color: var(--md-sys-color-on-surface-variant); }

        /* Componente Switch */
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--md-sys-color-surface-variant); transition: .3s; border-radius: 24px;
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
            background-color: white; transition: .3s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--md-sys-color-primary); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* Lista de Bloqueados */
        .blocked-users-list { max-height: 200px; overflow-y: auto; }
        .blocked-user {
            display: flex; align-items: center; justify-content: space-between; padding: 12px;
            border-radius: 8px; margin-bottom: 8px; background-color: var(--md-sys-color-surface-variant);
        }
        .unblock-btn {
            background: none; border: none; color: var(--md-sys-color-error); cursor: pointer;
            font-size: 14px; padding: 4px 8px; border-radius: 4px; transition: background-color 0.2s;
        }
        .unblock-btn:hover { background-color: var(--md-sys-color-error-container); }
        .block-btn {
            background: none; border: none; color: var(--md-sys-color-error); cursor: pointer; padding: 6px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            transition: background-color 0.2s;
        }
        .block-btn:hover { background-color: var(--md-sys-color-error-container); }
        
        /* Botões de Ação */
        .action-btn {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            padding: 12px 16px; border: none; border-radius: 8px; cursor: pointer;
            font-size: 14px; font-weight: 500; transition: all 0.2s; width: 100%;
        }
        .action-btn.secondary { background: var(--md-sys-color-surface-variant); color: var(--md-sys-color-on-surface-variant); }
        .action-btn.secondary:hover { background: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); }
        .action-btn.danger { background: var(--md-sys-color-error-container); color: var(--md-sys-color-on-error-container); }
        .action-btn.danger:hover { background: var(--md-sys-color-error); color: var(--md-sys-color-on-error); }

        /* =================================
           7. MODAIS E NOTIFICAÇÕES
           ================================= */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5); display: none; align-items: center; justify-content: center;
            z-index: 2000;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--md-sys-color-surface); border-radius: 12px; padding: 24px;
            max-width: 400px; width: 90%; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .modal-title { font-size: 18px; font-weight: 500; margin-bottom: 8px; }
        .modal-message { color: var(--md-sys-color-on-surface-variant); margin-bottom: 20px; }
        .modal-actions { display: flex; gap: 12px; justify-content: flex-end; }
        .modal-btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; }
        
        /* =================================
           8. CONTROLES DE CHAMADA (WEBRTC)
           ================================= */
        .call-controls, .call-status-bar {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10001;
            display: none; /* Inicia escondido */
        }

        .call-controls {
            bottom: 20px;
            display: flex;
            gap: 15px;
            background: rgba(30, 30, 30, 0.8);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        .call-control-btn {
            width: 50px; height: 50px; border-radius: 50%; border: none;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.3s ease; font-size: 20px;
            color: var(--md-sys-color-on-primary);
        }
        .call-control-btn.speaker { background-color: var(--md-sys-color-primary); }
        .call-control-btn.mute { background-color: var(--md-sys-color-secondary); }
        .call-control-btn.hangup { background-color: var(--md-sys-color-error); }
        .call-control-btn:hover { transform: scale(1.1); }
        .call-control-btn.active { box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.5); }
        
        .call-status-bar {
            top: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .quality-indicator { display: flex; align-items: center; gap: 5px; }
        .quality-dot { width: 8px; height: 8px; border-radius: 50%; background-color: var(--md-sys-color-success); }
        .quality-dot.poor { background-color: var(--md-sys-color-error); }

        /* =================================
           9. RESPONSIVIDADE
           ================================= */
        @media (max-width: 480px) {
            .chat-container {
                width: 100%; height: 100%; bottom: 0; right: 0; border-radius: 0;
            }
            .chat-toggle {
                bottom: 16px; right: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="chat-toggle" id="chatToggle">
        <span class="material-icons">chat</span>
        <div class="unread-badge" id="unreadBadge">0</div>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="chat-header">
            <div class="chat-title">Interfone Virtual</div>
            <div class="chat-actions">
                <button class="chat-action-btn" id="closeChat">
                    <span class="material-icons">close</span>
                </button>
            </div>
        </div>

        <div class="chat-tabs">
            <div class="chat-tab active" data-tab="conversations">Conversas</div>
            <div class="chat-tab" data-tab="users">Usuários</div>
            <div class="chat-tab" data-tab="settings">Configurações</div>
        </div>

        <div class="chat-content">
            <div class="chat-tab-content active" id="conversationsTab">
                <div class="conversations-list" id="conversationsList">
                    <div class="loading"><div class="spinner"></div></div>
                </div>
            </div>
            
            <div class="chat-tab-content" id="usersTab">
                <div class="users-list" id="usersList">
                    </div>
            </div>

            <div class="chat-tab-content" id="conversationTab">
                <div class="conversation-header">
                    <div class="conversation-user">
                        <button class="conversation-back" id="backToLists">
                            <span class="material-icons">arrow_back</span>
                        </button>
                        <div id="currentUserName">Selecione um usuário</div>
                    </div>
                    <div class="conversation-actions">
                        <div class="user-status" id="currentUserStatus"></div>
                        <button class="chat-action-btn" id="startCallBtn" title="Ligar para usuário" style="color: var(--md-sys-color-success);">
                            <span class="material-icons">call</span>
                        </button>
                        <button class="block-btn" id="blockCurrentUserBtn" title="Bloquear usuário">
                            <span class="material-icons">block</span>
                        </button>
                    </div>
                </div>
                <div class="messages-container" id="messagesContainer">
                    </div>
                <div class="message-input-container">
                    <input type="text" class="message-input" id="messageInput" placeholder="Digite sua mensagem..." disabled>
                    <button class="send-button" id="sendMessageBtn" disabled>
                        <span class="material-icons">send</span>
                    </button>
                </div>
            </div>

            <div class="chat-tab-content" id="settingsTab">
                <div class="settings-content">
                    <div class="settings-section">
                        <div class="settings-title">Notificações</div>
                        <div class="setting-item">
                            <div class="setting-info">
                                <div class="setting-label">Som de notificação</div>
                                <div class="setting-description">Tocar som ao receber mensagens</div>
                            </div>
                            <label class="switch"><input type="checkbox" id="soundNotificationSwitch" checked><span class="slider"></span></label>
                        </div>
                    </div>
                    <div class="settings-section">
                        <div class="settings-title">Privacidade</div>
                        <div class="setting-item">
                            <div class="setting-info">
                                <div class="setting-label">Status online</div>
                                <div class="setting-description">Mostrar quando estou online</div>
                            </div>
                            <label class="switch"><input type="checkbox" id="onlineStatusSwitch" checked><span class="slider"></span></label>
                        </div>
                    </div>
                    <div class="settings-section">
                        <div class="settings-title">Aparência</div>
                        <div class="setting-item">
                            <div class="setting-info">
                                <div class="setting-label">Tema escuro</div>
                            </div>
                            <label class="switch"><input type="checkbox" id="darkThemeSwitch"><span class="slider"></span></label>
                        </div>
                    </div>
                    <div class="settings-section">
                        <div class="settings-title">Usuários Bloqueados</div>
                        <div class="blocked-users-list" id="blockedUsersList">
                            </div>
                    </div>
                    <div class="settings-section">
                         <div class="settings-title">Ações</div>
                         <button class="action-btn secondary" id="testMicrophoneBtn"><span class="material-icons">mic</span> Testar Microfone</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="modal-overlay" id="callModal">
        <div class="modal" id="callContainer" style="width: 320px; text-align: center;">
            <div id="incomingCallUI" style="display: none;">
                <div class="user-avatar" id="incomingCallAvatar" style="margin: 0 auto 16px; width: 80px; height: 80px; font-size: 32px;"></div>
                <div class="modal-title" id="incomingCallName"></div>
                <p class="modal-message">está te ligando...</p>
                <div class="modal-actions" style="margin-top: 24px; justify-content: space-around;">
                    <button class="modal-btn" id="rejectCallBtn" style="background-color: var(--md-sys-color-error); color: var(--md-sys-color-on-error);"><span class="material-icons">call_end</span> Rejeitar</button>
                    <button class="modal-btn" id="answerCallBtn" style="background-color: var(--md-sys-color-success); color: white;"><span class="material-icons">call</span> Atender</button>
                </div>
            </div>
            <div id="outgoingCallUI" style="display: none;">
                <div class="user-avatar" id="outgoingCallAvatar" style="margin: 0 auto 16px; width: 80px; height: 80px; font-size: 32px;"></div>
                <div class="modal-title" id="outgoingCallName"></div>
                <p class="modal-message" id="outgoingCallStatus">Chamando...</p>
                 <div class="modal-actions" style="margin-top: 24px; justify-content: center;">
                    <button class="modal-btn" id="hangUpBtn" style="background-color: var(--md-sys-color-error); color: var(--md-sys-color-on-error);"><span class="material-icons">call_end</span> Desligar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
    // IIFE para encapsular o código e evitar poluição global
    (function() {
        'use strict';

        // =======================================================
        // 1. CONFIGURAÇÃO E INICIALIZAÇÃO
        // =======================================================

        // !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
        // !!! IMPORTANTE: SUBSTITUA PELAS SUAS CONFIGURAÇÕES DO FIREBASE AQUI !!!
        // !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
          const firebaseConfig = {
            apiKey: "AIzaSyByyM8RvGNM5pyrQIQ7nCH6mmgYAIpq0bc",
                authDomain: "rifas-c414b.firebaseapp.com",
                databaseURL: "https://rifas-c414b-default-rtdb.firebaseio.com",
                projectId: "rifas-c414b",
                storageBucket: "rifas-c414b.appspot.com",
                messagingSenderId: "770195193538",
                appId: "1:770195193538:web:48e585ac5661d27f3dc55b"
            };


        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // --- Estado da Aplicação ---
        const appState = {
            currentUser: null,
            selectedUser: null,
            users: {},
            blockedUsers: [],
            settings: {
                soundNotification: true,
                onlineStatus: true,
                darkTheme: false,
            },
            firebaseListeners: [], // Armazena referências aos listeners para remoção
        };

        // --- Elementos DOM ---
        const dom = {
            chatToggle: document.getElementById('chatToggle'),
            chatContainer: document.getElementById('chatContainer'),
            closeChat: document.getElementById('closeChat'),
            chatTabs: document.querySelectorAll('.chat-tab'),
            tabContents: document.querySelectorAll('.chat-tab-content'),
            conversationsList: document.getElementById('conversationsList'),
            usersList: document.getElementById('usersList'),
            messagesContainer: document.getElementById('messagesContainer'),
            messageInput: document.getElementById('messageInput'),
            sendMessageBtn: document.getElementById('sendMessageBtn'),
            backToLists: document.getElementById('backToLists'),
            currentUserName: document.getElementById('currentUserName'),
            currentUserStatus: document.getElementById('currentUserStatus'),
            startCallBtn: document.getElementById('startCallBtn'),
            blockCurrentUserBtn: document.getElementById('blockCurrentUserBtn'),
            blockedUsersList: document.getElementById('blockedUsersList'),
            unreadBadge: document.getElementById('unreadBadge'),
            // Configurações
            soundNotificationSwitch: document.getElementById('soundNotificationSwitch'),
            onlineStatusSwitch: document.getElementById('onlineStatusSwitch'),
            darkThemeSwitch: document.getElementById('darkThemeSwitch'),
            testMicrophoneBtn: document.getElementById('testMicrophoneBtn'),
            // Modais de Chamada
            callModal: document.getElementById('callModal'),
            incomingCallUI: document.getElementById('incomingCallUI'),
            outgoingCallUI: document.getElementById('outgoingCallUI'),
            incomingCallAvatar: document.getElementById('incomingCallAvatar'),
            incomingCallName: document.getElementById('incomingCallName'),
            outgoingCallAvatar: document.getElementById('outgoingCallAvatar'),
            outgoingCallName: document.getElementById('outgoingCallName'),
            outgoingCallStatus: document.getElementById('outgoingCallStatus'),
            answerCallBtn: document.getElementById('answerCallBtn'),
            rejectCallBtn: document.getElementById('rejectCallBtn'),
            hangUpBtn: document.getElementById('hangUpBtn'),
        };

        // --- Inicialização Principal ---
        document.addEventListener('DOMContentLoaded', () => {
            initAuthListener();
            initEventListeners();
        });

        // =======================================================
        // 2. AUTENTICAÇÃO
        // =======================================================

        function initAuthListener() {
            auth.onAuthStateChanged(user => {
                if (user) {
                    appState.currentUser = user;
                    // Simulação: se o usuário não tiver nome, use parte do email
                    if (!appState.currentUser.displayName) {
                         appState.currentUser.displayName = user.email.split('@')[0];
                    }
                    onUserLogin();
                } else {
                    onUserLogout();
                }
            });
        }

        function onUserLogin() {
            console.log('Usuário logado:', appState.currentUser.uid);
            updateUserPresence(true);
            loadSettings();
            attachFirebaseListeners();
            listenForIncomingCalls(appState.currentUser.uid);
        }

        function onUserLogout() {
            console.log('Usuário deslogado.');
            if (appState.currentUser) {
                updateUserPresence(false);
            }
            detachFirebaseListeners();
            resetAppState();
            renderLoggedOutView();
            closeChatWindow();
        }
        
        function updateUserPresence(isOnline) {
            const userStatusRef = db.ref(`/users/${appState.currentUser.uid}`);
            const presenceData = {
                online: isOnline,
                lastSeen: firebase.database.ServerValue.TIMESTAMP,
                nome: appState.currentUser.displayName || 'Usuário Anônimo'
            };
            
            if (isOnline) {
                userStatusRef.update(presenceData);
                // Define onDisconnect para atualizar status quando a conexão for perdida
                userStatusRef.onDisconnect().update({ online: false, lastSeen: firebase.database.ServerValue.TIMESTAMP });
            } else {
                 userStatusRef.update({ online: false, lastSeen: firebase.database.ServerValue.TIMESTAMP });
            }
        }
        
        function resetAppState() {
            appState.currentUser = null;
            appState.selectedUser = null;
            appState.users = {};
            appState.blockedUsers = [];
        }


        // =======================================================
        // 3. GERENCIAMENTO DE EVENTOS (UI)
        // =======================================================
        
        function initEventListeners() {
            dom.chatToggle.addEventListener('click', toggleChatWindow);
            dom.closeChat.addEventListener('click', closeChatWindow);
            dom.backToLists.addEventListener('click', () => showListView());

            dom.chatTabs.forEach(tab => {
                tab.addEventListener('click', () => switchTab(tab.dataset.tab));
            });

            dom.sendMessageBtn.addEventListener('click', sendMessage);
            dom.messageInput.addEventListener('keypress', e => {
                if (e.key === 'Enter') sendMessage();
            });
            
            dom.startCallBtn.addEventListener('click', () => {
                if(appState.selectedUser) {
                    initiateCall(appState.selectedUser.id, appState.selectedUser.nome);
                }
            });
            
            dom.blockCurrentUserBtn.addEventListener('click', () => {
                 if(appState.selectedUser) {
                    blockUser(appState.selectedUser.id, appState.selectedUser.nome);
                }
            });
            
            // Listeners das configurações
            dom.soundNotificationSwitch.addEventListener('change', saveSettings);
            dom.onlineStatusSwitch.addEventListener('change', saveSettings);
            dom.darkThemeSwitch.addEventListener('change', saveSettings);
            dom.testMicrophoneBtn.addEventListener('click', testMicrophone);
        }

        function toggleChatWindow() {
            dom.chatContainer.classList.toggle('active');
        }

        function closeChatWindow() {
            dom.chatContainer.classList.remove('active');
        }
        
        function switchTab(tabName) {
            dom.chatTabs.forEach(tab => tab.classList.toggle('active', tab.dataset.tab === tabName));
            dom.tabContents.forEach(content => {
                // A aba de conversa individual é tratada de forma diferente
                if (content.id !== 'conversationTab') {
                    content.classList.toggle('active', content.id === `${tabName}Tab`);
                }
            });
            
            // Garante que a conversa individual seja escondida ao trocar de aba principal
            if (tabName !== 'conversation') {
                showListView();
            }
        }
        
        function showConversationView(user) {
            appState.selectedUser = user;
            
            // Esconder listas
            dom.conversationsList.parentElement.style.display = 'none';
            dom.usersList.parentElement.style.display = 'none';
            
            // Mostrar view da conversa
            dom.tabContents.forEach(c => c.classList.remove('active'));
            document.getElementById('conversationTab').classList.add('active');
            
            // Atualizar UI da conversa
            dom.currentUserName.textContent = user.nome || 'Usuário';
            dom.currentUserStatus.className = `user-status ${user.online ? '' : 'offline'}`;
            dom.messageInput.disabled = false;
            dom.sendMessageBtn.disabled = false;
            
            loadMessagesForConversation(appState.currentUser.uid, user.id);
        }

        function showListView() {
            appState.selectedUser = null;
            
            // Esconder conversa
            document.getElementById('conversationTab').classList.remove('active');
            
            // Mostrar lista ativa
            const activeTab = document.querySelector('.chat-tab.active').dataset.tab;
            document.getElementById(`${activeTab}Tab`).style.display = 'flex';
            document.getElementById(`${activeTab}Tab`).classList.add('active');
            
             // Resetar UI da conversa
            dom.currentUserName.textContent = '';
            dom.messageInput.disabled = true;
            dom.sendMessageBtn.disabled = true;
        }

        // =======================================================
        // 4. FIREBASE DATA & LISTENERS
        // =======================================================

        function attachFirebaseListeners() {
            // Limpa listeners antigos para evitar duplicação
            detachFirebaseListeners();

            const usersRef = db.ref('users');
            usersRef.on('value', handleUsersSnapshot, handleFirebaseError);
            appState.firebaseListeners.push({ ref: usersRef, event: 'value' });
            
            const blockedRef = db.ref(`users/${appState.currentUser.uid}/blockedUsers`);
            blockedRef.on('value', handleBlockedUsersSnapshot, handleFirebaseError);
            appState.firebaseListeners.push({ ref: blockedRef, event: 'value' });

            const conversationsRef = db.ref('conversations');
            conversationsRef.on('value', handleConversationsSnapshot, handleFirebaseError);
            appState.firebaseListeners.push({ ref: conversationsRef, event: 'value' });
        }

        function detachFirebaseListeners() {
            appState.firebaseListeners.forEach(({ ref, event }) => ref.off(event));
            appState.firebaseListeners = [];
        }

        function handleFirebaseError(error) {
            console.error("Erro no Firebase:", error);
        }

        function handleUsersSnapshot(snapshot) {
            appState.users = snapshot.val() || {};
            renderUsersList();
        }
        
        function handleBlockedUsersSnapshot(snapshot) {
            appState.blockedUsers = snapshot.val() || [];
            // Re-renderiza as listas que dependem dos usuários bloqueados
            renderUsersList();
            renderConversationsList();
        }

        function handleConversationsSnapshot(snapshot) {
            const allConversations = snapshot.val() || {};
            const userConversations = [];
            let unreadCount = 0;

            Object.keys(allConversations).forEach(convoId => {
                if (convoId.includes(appState.currentUser.uid)) {
                    const otherUserId = convoId.replace(appState.currentUser.uid, '').replace('_', '');
                    if (appState.blockedUsers.includes(otherUserId)) return; // Ignora conversas com bloqueados

                    const otherUser = appState.users[otherUserId];
                    if (!otherUser) return;
                    
                    const messages = Object.values(allConversations[convoId]);
                    const lastMessage = messages[messages.length - 1];
                    
                    if (lastMessage) {
                         userConversations.push({
                            id: otherUserId,
                            user: otherUser,
                            lastMessage: lastMessage
                        });
                        
                        // Lógica de contagem de não lidas (simplificada)
                        if(lastMessage.senderId !== appState.currentUser.uid && !lastMessage.read) {
                            unreadCount++;
                        }
                    }
                }
            });
            
            // Ordena por mais recente
            userConversations.sort((a, b) => b.lastMessage.timestamp - a.lastMessage.timestamp);
            
            renderConversationsList(userConversations);
            updateUnreadBadge(unreadCount);
        }
        
        function loadMessagesForConversation(userId1, userId2) {
            const convoId = [userId1, userId2].sort().join('_');
            const messagesRef = db.ref(`conversations/${convoId}`);
            
            messagesRef.orderByChild('timestamp').on('value', snapshot => {
                const messages = snapshot.val() || {};
                renderMessages(Object.values(messages));
            }, handleFirebaseError);

            appState.firebaseListeners.push({ ref: messagesRef, event: 'value' });
        }
        
        function sendMessage() {
            const text = dom.messageInput.value.trim();
            if (!text || !appState.selectedUser) return;

            const convoId = [appState.currentUser.uid, appState.selectedUser.id].sort().join('_');
            const messageRef = db.ref(`conversations/${convoId}`).push();
            
            const messageData = {
                text,
                senderId: appState.currentUser.uid,
                receiverId: appState.selectedUser.id,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            };

            messageRef.set(messageData).catch(handleFirebaseError);
            dom.messageInput.value = '';
        }
        
        function blockUser(userId, userName) {
            if (confirm(`Tem certeza que deseja bloquear ${userName}?`)) {
                if (!appState.blockedUsers.includes(userId)) {
                    const updatedBlocked = [...appState.blockedUsers, userId];
                    db.ref(`users/${appState.currentUser.uid}/blockedUsers`).set(updatedBlocked)
                        .then(() => {
                            console.log('Usuário bloqueado');
                            if (appState.selectedUser && appState.selectedUser.id === userId) {
                                showListView();
                            }
                        })
                        .catch(handleFirebaseError);
                }
            }
        }
        
        function unblockUser(userId) {
            const updatedBlocked = appState.blockedUsers.filter(id => id !== userId);
            db.ref(`users/${appState.currentUser.uid}/blockedUsers`).set(updatedBlocked)
                .catch(handleFirebaseError);
        }

        // =======================================================
        // 5. RENDERIZAÇÃO (ATUALIZAÇÃO DA UI)
        // =======================================================
        
        function renderLoggedOutView() {
            const message = `<div class="empty-state"><span class="material-icons">login</span><p>Faça login para usar o chat.</p></div>`;
            dom.usersList.innerHTML = message;
            dom.conversationsList.innerHTML = message;
        }

        function renderUsersList() {
            if (!appState.currentUser) return;
            dom.usersList.innerHTML = '';
            
            const userIds = Object.keys(appState.users);
            if(userIds.length <= 1) {
                 dom.usersList.innerHTML = `<div class="empty-state"><span class="material-icons">people</span><p>Nenhum outro usuário encontrado.</p></div>`;
                 return;
            }

            userIds.forEach(userId => {
                if (userId === appState.currentUser.uid || appState.blockedUsers.includes(userId)) return;

                const user = appState.users[userId];
                const userItem = document.createElement('div');
                userItem.className = 'user-item';
                userItem.innerHTML = `
                    <div class="user-avatar">${user.nome ? user.nome.charAt(0).toUpperCase() : 'U'}</div>
                    <div class="user-info">
                        <div class="user-name">${user.nome || 'Usuário'}</div>
                    </div>
                    <div class="user-actions">
                        <div class="user-status ${user.online ? '' : 'offline'}"></div>
                    </div>
                `;
                userItem.addEventListener('click', () => showConversationView({ id: userId, ...user }));
                dom.usersList.appendChild(userItem);
            });
        }
        
        function renderConversationsList(conversations = []) {
             if (!appState.currentUser) return;
             dom.conversationsList.innerHTML = '';
             
             if(conversations.length === 0) {
                 dom.conversationsList.innerHTML = `<div class="empty-state"><span class="material-icons">chat</span><p>Nenhuma conversa iniciada. Vá para a aba "Usuários".</p></div>`;
                 return;
             }
             
             conversations.forEach(convo => {
                 const isSentByMe = convo.lastMessage.senderId === appState.currentUser.uid;
                 const preview = (isSentByMe ? "Você: " : "") + convo.lastMessage.text;
                 
                 const convoItem = document.createElement('div');
                 convoItem.className = 'conversation-item';
                 convoItem.innerHTML = `
                    <div class="conversation-avatar">${convo.user.nome ? convo.user.nome.charAt(0).toUpperCase() : 'U'}</div>
                    <div class="conversation-info">
                        <div class="conversation-header">
                            <div class="conversation-name">${convo.user.nome || 'Usuário'}</div>
                            <div class="conversation-time">${formatTimestamp(convo.lastMessage.timestamp)}</div>
                        </div>
                        <div class="conversation-preview">${preview}</div>
                    </div>
                 `;
                 convoItem.addEventListener('click', () => showConversationView({ id: convo.id, ...convo.user }));
                 dom.conversationsList.appendChild(convoItem);
             });
        }
        
        function renderMessages(messages) {
            dom.messagesContainer.innerHTML = '';
            messages.forEach(msg => {
                const isSent = msg.senderId === appState.currentUser.uid;
                const msgEl = document.createElement('div');
                msgEl.className = `message ${isSent ? 'sent' : 'received'}`;
                msgEl.innerHTML = `
                    <div class="message-text">${msg.text}</div>
                    <div class="message-time">${formatTimestamp(msg.timestamp)}</div>
                `;
                dom.messagesContainer.appendChild(msgEl);
            });
            dom.messagesContainer.scrollTop = dom.messagesContainer.scrollHeight;
        }

        function updateUnreadBadge(count) {
            if (count > 0) {
                dom.unreadBadge.textContent = count > 9 ? '9+' : count;
                dom.unreadBadge.style.display = 'flex';
                dom.unreadBadge.classList.add('pulse');
                setTimeout(() => dom.unreadBadge.classList.remove('pulse'), 500);
            } else {
                dom.unreadBadge.style.display = 'none';
            }
        }
        
        // =======================================================
        // 6. CONFIGURAÇÕES
        // =======================================================

        function loadSettings() {
            const settingsRef = db.ref(`users/${appState.currentUser.uid}/settings`);
            settingsRef.once('value').then(snapshot => {
                const savedSettings = snapshot.val();
                if (savedSettings) {
                    appState.settings = { ...appState.settings, ...savedSettings };
                }
                applySettings();
            });
        }

        function saveSettings() {
             appState.settings.soundNotification = dom.soundNotificationSwitch.checked;
             appState.settings.onlineStatus = dom.onlineStatusSwitch.checked;
             appState.settings.darkTheme = dom.darkThemeSwitch.checked;

             db.ref(`users/${appState.currentUser.uid}/settings`).set(appState.settings);
             applySettings();
        }

        function applySettings() {
            // Aplica tema escuro
            document.body.classList.toggle('dark-theme', appState.settings.darkTheme);
            
            // Atualiza os controles na UI
            dom.soundNotificationSwitch.checked = appState.settings.soundNotification;
            dom.onlineStatusSwitch.checked = appState.settings.onlineStatus;
            dom.darkThemeSwitch.checked = appState.settings.darkTheme;
        }

        // =======================================================
        // 7. LÓGICA DE CHAMADA DE VOZ (WEBRTC)
        // =======================================================
        
        // --- Estado do WebRTC ---
        const rtcState = {
            localStream: null,
            peerConnection: null,
            currentCallerId: null,
            currentCalleeId: null,
            isCallActive: false
        };

        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };
        
        async function getMicStream() {
            try {
                return await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });
            } catch (error) {
                console.error("Erro ao acessar microfone:", error);
                alert("Não foi possível acessar o microfone. Verifique as permissões do navegador.");
                return null;
            }
        }
        
        async function initiateCall(calleeId, calleeName) {
            if (rtcState.isCallActive) return;

            rtcState.localStream = await getMicStream();
            if (!rtcState.localStream) return;
            
            rtcState.isCallActive = true;
            rtcState.currentCalleeId = calleeId;
            showCallUI('outgoing', calleeName);
            
            setupPeerConnection(calleeId);
            
            rtcState.localStream.getTracks().forEach(track => {
                rtcState.peerConnection.addTrack(track, rtcState.localStream);
            });
            
            const offer = await rtcState.peerConnection.createOffer();
            await rtcState.peerConnection.setLocalDescription(offer);

            const callData = {
                offer: { type: offer.type, sdp: offer.sdp },
                callerId: appState.currentUser.uid,
                callerName: appState.currentUser.displayName,
            };

            await db.ref(`calls/${calleeId}`).set(callData);
            
            // Listener para a resposta
            const answerRef = db.ref(`calls/${appState.currentUser.uid}/answer`);
            answerRef.on('value', snapshot => {
                if (snapshot.exists()) {
                    const answer = snapshot.val();
                    if (rtcState.peerConnection && !rtcState.peerConnection.currentRemoteDescription) {
                        rtcState.peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
                    }
                    answerRef.off(); // Remove o listener após receber a resposta
                }
            });
        }
        
        function listenForIncomingCalls(userId) {
            const callRef = db.ref(`calls/${userId}`);
            callRef.on('value', async (snapshot) => {
                const callData = snapshot.val();
                if (callData && callData.offer && !rtcState.isCallActive) {
                    rtcState.isCallActive = true;
                    rtcState.currentCallerId = callData.callerId;
                    showCallUI('incoming', callData.callerName);

                    dom.answerCallBtn.onclick = async () => {
                        rtcState.localStream = await getMicStream();
                        if (!rtcState.localStream) {
                            cleanupCall();
                            return;
                        }
                        
                        showCallUI('outgoing', callData.callerName); // Muda a UI para chamada em andamento
                        dom.outgoingCallStatus.textContent = 'Conectado';

                        setupPeerConnection(callData.callerId);
                        
                        rtcState.localStream.getTracks().forEach(track => {
                            rtcState.peerConnection.addTrack(track, rtcState.localStream);
                        });

                        await rtcState.peerConnection.setRemoteDescription(new RTCSessionDescription(callData.offer));
                        
                        const answer = await rtcState.peerConnection.createAnswer();
                        await rtcState.peerConnection.setLocalDescription(answer);

                        await db.ref(`calls/${callData.callerId}/answer`).set({
                            type: answer.type, sdp: answer.sdp
                        });
                        
                        // Limpa a oferta para não ser atendida de novo
                        callRef.remove();
                    };

                    dom.rejectCallBtn.onclick = () => {
                        callRef.remove();
                        cleanupCall();
                    };
                    
                     dom.hangUpBtn.onclick = () => {
                        callRef.remove();
                        cleanupCall();
                    };
                }
            });
        }
        
        function setupPeerConnection(otherUserId) {
            rtcState.peerConnection = new RTCPeerConnection(rtcConfig);

            // Coleta e envia ICE candidates
            rtcState.peerConnection.onicecandidate = event => {
                if (event.candidate) {
                    db.ref(`calls/${otherUserId}/iceCandidates`).push(event.candidate.toJSON());
                }
            };
            
            // Escuta por ICE candidates do outro par
            const iceRef = db.ref(`calls/${appState.currentUser.uid}/iceCandidates`);
            iceRef.on('child_added', snapshot => {
                if (snapshot.exists()) {
                    rtcState.peerConnection.addIceCandidate(new RTCIceCandidate(snapshot.val()));
                    snapshot.ref.remove(); // Remove o candidate depois de usar
                }
            });

            // Adiciona a stream remota a um elemento de áudio
            rtcState.peerConnection.ontrack = event => {
                const remoteAudio = document.createElement('audio');
                remoteAudio.autoplay = true;
                remoteAudio.srcObject = event.streams[0];
                document.body.appendChild(remoteAudio);
            };

            // Monitora o estado da conexão
            rtcState.peerConnection.onconnectionstatechange = () => {
                if (['disconnected', 'failed', 'closed'].includes(rtcState.peerConnection.connectionState)) {
                    cleanupCall();
                }
            };
        }

        function cleanupCall() {
            if (!rtcState.isCallActive) return;
            
            // Parar tracks
            if (rtcState.localStream) {
                rtcState.localStream.getTracks().forEach(track => track.stop());
                rtcState.localStream = null;
            }

            // Fechar PeerConnection
            if (rtcState.peerConnection) {
                rtcState.peerConnection.close();
                rtcState.peerConnection = null;
            }
            
            // Limpar dados do Firebase
            const otherUserId = rtcState.currentCalleeId || rtcState.currentCallerId;
            if(otherUserId) {
                db.ref(`calls/${otherUserId}`).remove();
            }
             db.ref(`calls/${appState.currentUser.uid}`).remove();

            // Limpar UI e estado
            document.querySelectorAll('audio[srcObject]').forEach(el => el.remove());
            hideCallUI();
            rtcState.currentCallerId = null;
            rtcState.currentCalleeId = null;
            rtcState.isCallActive = false;
        }

        function showCallUI(type, userName) {
            dom.callModal.classList.add('active');
            const initial = userName.charAt(0).toUpperCase();

            if (type === 'incoming') {
                dom.incomingCallUI.style.display = 'block';
                dom.outgoingCallUI.style.display = 'none';
                dom.incomingCallName.textContent = userName;
                dom.incomingCallAvatar.textContent = initial;
            } else { // outgoing ou em andamento
                dom.incomingCallUI.style.display = 'none';
                dom.outgoingCallUI.style.display = 'block';
                dom.outgoingCallName.textContent = userName;
                dom.outgoingCallAvatar.textContent = initial;
                dom.outgoingCallStatus.textContent = 'Chamando...';
            }
        }
        
        function hideCallUI() {
             dom.callModal.classList.remove('active');
        }
        
        async function testMicrophone() {
            const stream = await getMicStream();
            if (stream) {
                alert("Microfone funcionando! Você pode parar o acesso na barra de endereço do navegador.");
                // Opcional: parar o stream após um tempo
                setTimeout(() => stream.getTracks().forEach(track => track.stop()), 3000);
            }
        }

        // =======================================================
        // 8. FUNÇÕES UTILITÁRIAS
        // =======================================================

        function formatTimestamp(timestamp) {
            if (!timestamp) return '';
            const date = new Date(timestamp);
            return date.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        }
        
    })(); // Fim da IIFE
    </script>
</body>
</html>
