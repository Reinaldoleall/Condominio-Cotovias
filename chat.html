// SENSOR DE PROXIMIDADE (OUVIDO)
function setupProximitySensor() {
    if ('ondeviceproximity' in window || 'onuserproximity' in window) {
        enableProximitySensor();
    } else {
        console.log('Sensor de proximidade não disponível');
        setupAudioBasedProximity();
    }
}

function enableProximitySensor() {
    if ('ondeviceproximity' in window) {
        window.addEventListener('deviceproximity', handleProximityEvent);
    }
    
    if ('onuserproximity' in window) {
        window.addEventListener('userproximity', handleProximityEvent);
    }
    
    proximitySensorEnabled = true;
}

function handleProximityEvent(event) {
    const wasNearEar = isNearEar;
    isNearEar = event.near;
    
    if (wasNearEar !== isNearEar) {
        toggleAudioOutput(isNearEar);
    }
}

function setupAudioBasedProximity() {
    let lastTouchTime = 0;
    
    document.addEventListener('touchstart', (e) => {
        lastTouchTime = Date.now();
        if (e.touches[0].clientY < window.innerHeight * 0.3) {
            toggleAudioOutput(true);
        }
    });
    
    document.addEventListener('touchend', () => {
        setTimeout(() => {
            if (Date.now() - lastTouchTime > 1000) {
                toggleAudioOutput(false);
            }
        }, 1500);
    });
    
    if (window.DeviceOrientationEvent) {
        window.addEventListener('deviceorientation', handleOrientation);
    }
}

function handleOrientation(event) {
    const gamma = Math.abs(event.gamma);
    const beta = Math.abs(event.beta);
    
    if (gamma > 45 && beta > 45) {
        toggleAudioOutput(true);
    } else {
        toggleAudioOutput(false);
    }
}

function toggleAudioOutput(nearEar) {
    if (nearEar) {
        disableSpeaker();
        setAudioOutput('earpiece');
    } else {
        enableSpeaker();
        setAudioOutput('speaker');
    }
}

// RECONEXÃO E MONITORAMENTO
function setupReconnectionLogic() {
    if (peerConnection) {
        peerConnection.onconnectionstatechange = () => {
            console.log('Estado da conexão:', peerConnection.connectionState);
            
            switch(peerConnection.connectionState) {
                case 'disconnected':
                case 'failed':
                    if (reconnectAttempts < MAX_RECONNECT_ATTEMPTS) {
                        reconnectTimeout = setTimeout(() => {
                            reconnectCall();
                            reconnectAttempts++;
                        }, 2000);
                    } else {
                        alert('Falha na conexão. Chamada será encerrada.');
                        hangUp();
                    }
                    break;
                case 'connected':
                    reconnectAttempts = 0;
                    updateCallStatus('Conectado');
                    break;
            }
        };
    }
}

async function reconnectCall() {
    if (!currentCalleeId || !peerConnection) return;
    
    try {
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        
        await db.ref(`calls/${currentCalleeId}`).update({
            offer: {
                type: offer.type,
                sdp: offer.sdp,
            },
            reconnect: true,
            timestamp: Date.now()
        });
        
        updateCallStatus('Reconectando...');
    } catch (error) {
        console.error('Erro na reconexão:', error);
    }
}

function setupCallQualityMonitoring() {
    if (!peerConnection) return;
    
    setInterval(async () => {
        if (peerConnection.iceConnectionState === 'connected') {
            try {
                const stats = await peerConnection.getStats();
                let audioLevel = 0;
                let packetsLost = 0;
                let packetsTotal = 0;
                
                stats.forEach(report => {
                    if (report.type === 'inbound-rtp' && report.mediaType === 'audio') {
                        audioLevel = report.audioLevel || 0;
                        packetsLost += report.packetsLost || 0;
                        packetsTotal += report.packetsReceived || 1;
                    }
                });
                
                updateCallQualityIndicator(audioLevel, packetsLost, packetsTotal);
            } catch (error) {
                console.log('Erro ao obter estatísticas:', error);
            }
        }
    }, 3000);
}

function updateCallQualityIndicator(level, packetsLost, packetsTotal) {
    const qualityElement = document.getElementById('callQuality');
    const qualityDot = document.getElementById('qualityDot');
    
    if (!qualityElement || !qualityDot) return;
    
    const packetLoss = packetsTotal > 0 ? (packetsLost / packetsTotal) * 100 : 0;
    let quality = 'Boa';
    let qualityClass = '';
    
    if (packetLoss > 10 || level < 0.05) {
        quality = 'Fraca';
        qualityClass = 'poor';
    } else if (packetLoss > 5 || level < 0.1) {
        quality = 'Média';
    }
    
    qualityElement.textContent = `Qualidade: ${quality}`;
    qualityDot.className = `quality-dot ${qualityClass}`;
}

// TIMER DA CHAMADA
function startCallTimer() {
    callStartTime = Date.now();
    callTimerInterval = setInterval(updateCallTimer, 1000);
}

function updateCallTimer() {
    const elapsed = Math.floor((Date.now() - callStartTime) / 1000);
    const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
    const seconds = (elapsed % 60).toString().padStart(2, '0');
    
    const callTimer = document.getElementById('callTimer');
    if (callTimer) {
        callTimer.textContent = `${minutes}:${seconds}`;
    }
}

function stopCallTimer() {
    if (callTimerInterval) {
        clearInterval(callTimerInterval);
        callTimerInterval = null;
    }
    
    const callTimer = document.getElementById('callTimer');
    if (callTimer) {
        callTimer.textContent = '00:00';
    }
}

// WEBRTC EVENT HANDLERS
function registerPeerConnectionListeners(otherUserId) {
    if (!peerConnection) return;

    // Envia os ICE candidates gerados localmente para o outro usuário
    peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
            db.ref(`calls/${otherUserId}/iceCandidates`).push(event.candidate.toJSON());
        }
    };

    // Recebe e processa os ICE candidates do outro usuário (JÁ CORRIGIDO)
    db.ref(`calls/${currentUser.uid}/iceCandidates`).on('child_added', (snapshot) => {
        if (snapshot.exists()) {
            const candidate = new RTCIceCandidate(snapshot.val());

            // Se a conexão já estiver pronta (com remote description), adiciona o candidate
            if (peerConnection && peerConnection.currentRemoteDescription) {
                peerConnection.addIceCandidate(candidate).catch(error => {
                    console.error('Erro ao adicionar ICE candidate recebido:', error);
                });
            } else {
                // Se não, armazena temporariamente no buffer
                iceCandidateBuffer.push(candidate);
                console.log('Candidate guardado no buffer para uso posterior.');
            }
            // Remove o candidate do Firebase para não processá-lo novamente
            snapshot.ref.remove();
        }
    });

    // Quando o stream de áudio remoto chegar, toca o áudio
    peerConnection.ontrack = (event) => {
        remoteStream = event.streams[0];
        const remoteAudio = new Audio();
        remoteAudio.srcObject = remoteStream;
        remoteAudio.autoplay = true;
        remoteAudio.controls = false;
        
        // Adiciona o elemento de áudio ao corpo do documento para garantir a reprodução
        document.body.appendChild(remoteAudio);
    };

    // Monitora o estado da conexão para depuração
    peerConnection.oniceconnectionstatechange = () => {
        console.log('ICE Connection State:', peerConnection.iceConnectionState);
    };
}


// CONTROLES DA CHAMADA
function rejectCall() {
    if (currentCallerId) {
        db.ref(`calls/${currentCalleeId}`).remove();
    }
    cleanupCall();
}

function hangUp() {
    const userToRemove = currentCallerId || currentCalleeId;
    if (userToRemove) {
        db.ref(`calls/${userToRemove}`).remove();
    }
    cleanupCall();
}

// LIMPEZA DE RECURSOS
// LIMPEZA DE RECURSOS
function cleanupCall() {
    console.log('Limpando recursos da chamada...');
    
    // Parar som de chamada
    stopIncomingCallSound();
    
    // 1. Parar timer
    stopCallTimer();
    
    // 2. Esconder controles
    hideCallControls();
    
    // 3. Limpar áudio
    cleanupAudio();
    
    // 4. Resetar variáveis
    resetCallVariables();
    
    // 5. Fechar PeerConnection
    closePeerConnection();
    
    // 6. Parar streams
    stopMediaStreams();
    
    // 7. Remover listeners
    removeFirebaseListeners();
    
    // 8. Limpar dados do Firebase
    cleanupFirebaseData();
    
    // 9. Remover sensores
    removeSensorListeners();
    
    // 10. Esconder UI
    hideCallUI();
    
    console.log('Chamada finalizada - recursos liberados');
    showNotification('Chamada finalizada.', 'info');
}

function hideCallControls() {
    const callControls = document.getElementById('callControls');
    const callStatusBar = document.getElementById('callStatusBar');
    if (callControls) callControls.style.display = 'none';
    if (callStatusBar) callStatusBar.style.display = 'none';
}

function cleanupAudio() {
    if (audioContext) {
        audioContext.close().catch(error => {
            console.log('Erro ao fechar audio context:', error);
        });
        audioContext = null;
        gainNode = null;
    }
}

function resetCallVariables() {
    isSpeakerOn = false;
    isMuted = false;
    reconnectAttempts = 0;
    isNearEar = false;
    currentCallerId = null;
    currentCalleeId = null;
    iceCandidateBuffer = [];
}

function closePeerConnection() {
    if (peerConnection) {
        peerConnection.onconnectionstatechange = null;
        peerConnection.onicecandidate = null;
        peerConnection.ontrack = null;
        peerConnection.onnegotiationneeded = null;
        peerConnection.oniceconnectionstatechange = null;
        
        peerConnection.close();
        peerConnection = null;
    }
}

function stopMediaStreams() {
    if (localStream) {
        localStream.getTracks().forEach(track => {
            track.stop();
            track.enabled = true;
        });
        localStream = null;
    }
    
    if (remoteStream) {
        remoteStream.getTracks().forEach(track => track.stop());
        remoteStream = null;
    }
    
    // Remover elementos de áudio
    const remoteAudioElements = document.querySelectorAll('audio[srcObject]');
    remoteAudioElements.forEach(audio => {
        audio.srcObject = null;
        audio.remove();
    });
}

function removeFirebaseListeners() {
    if (currentCallerId) {
        db.ref(`calls/${currentCallerId}/answer`).off();
        db.ref(`calls/${currentCallerId}/iceCandidates`).off();
    }
    if (currentCalleeId) {
        db.ref(`calls/${currentCalleeId}`).off();
        db.ref(`calls/${currentCalleeId}/iceCandidates`).off();
    }
}

function cleanupFirebaseData() {
    const cleanupPromises = [];
    if (currentCallerId) {
        cleanupPromises.push(db.ref(`calls/${currentCallerId}`).remove());
    }
    if (currentCalleeId) {
        cleanupPromises.push(db.ref(`calls/${currentCalleeId}`).remove());
    }
    
    Promise.allSettled(cleanupPromises).then(results => {
        results.forEach((result, index) => {
            if (result.status === 'rejected') {
                console.warn(`Falha ao limpar dados ${index}:`, result.reason);
            }
        });
    });
}

function removeSensorListeners() {
    if (proximitySensorEnabled) {
        window.removeEventListener('deviceproximity', handleProximityEvent);
        window.removeEventListener('userproximity', handleProximityEvent);
        window.removeEventListener('deviceorientation', handleOrientation);
        proximitySensorEnabled = false;
    }
}

// INTERFACE DO USUÁRIO
function showCallUI(type, userName) {
    const callModal = document.getElementById('callModal');
    if (!callModal) return;
    
    callModal.classList.add('active');

function updateCallStatus(status) {

        if (savedSettings) {
            userSettings = { ...userSettings, ...savedSettings };
            applySettings();
            
            // Se estivermos na aba de configurações, atualizar a interface
            if (document.querySelector('#settingsTab.active')) {
                applySettingsToUI();
            }
        }
    }).catch(error => {
        console.error('Erro ao carregar configurações:', error);
    });
}

function saveSettings() {
    if (!currentUser) return;
    
    // Atualizar objeto de configurações a partir da UI
    updateSettingsFromUI();
    
    // Salvar no Firebase
    const settingsRef = database.ref(`users/${currentUser.uid}/settings`);
    settingsRef.set(userSettings)
        .then(() => {
            console.log('Configurações salvas com sucesso');
            showNotification('Configurações salvas com sucesso!', 'success');
        })
        .catch(error => {
            console.error('Erro ao salvar configurações:', error);
            showNotification('Erro ao salvar configurações.', 'error');
        });
    
    // Aplicar configurações imediatamente
    applySettings();
}

function updateSettingsFromUI() {
    const soundNotification = document.getElementById('soundNotification');
    const tabNotification = document.getElementById('tabNotification');
    const onlineStatus = document.getElementById('onlineStatus');
    const receiveMessages = document.getElementById('receiveMessages');
    const darkTheme = document.getElementById('darkTheme');
    const fontSize = document.getElementById('fontSize');
    
    if (soundNotification) {
        userSettings.soundNotification = soundNotification.checked;
        userSettings.tabNotification = tabNotification.checked;
        userSettings.onlineStatus = onlineStatus.checked;
        userSettings.receiveMessages = receiveMessages.checked;
        userSettings.darkTheme = darkTheme.checked;
        userSettings.fontSize = fontSize.value;
    }
}

function applySettingsToUI() {
    const soundNotification = document.getElementById('soundNotification');
    const tabNotification = document.getElementById('tabNotification');
    const onlineStatus = document.getElementById('onlineStatus');
    const receiveMessages = document.getElementById('receiveMessages');
    const darkTheme = document.getElementById('darkTheme');
    const fontSize = document.getElementById('fontSize');
    
    if (soundNotification) {
        soundNotification.checked = userSettings.soundNotification;
        tabNotification.checked = userSettings.tabNotification;
        onlineStatus.checked = userSettings.onlineStatus;
        receiveMessages.checked = userSettings.receiveMessages;
        darkTheme.checked = userSettings.darkTheme;
        fontSize.value = userSettings.fontSize;
    }
}

function applySettings() {
    // Aplicar tema
    if (userSettings.darkTheme) {
        document.body.classList.add('dark-theme');
    } else {
        document.body.classList.remove('dark-theme');
    }
    
    // Aplicar tamanho da fonte
    document.body.style.fontSize = getFontSizeValue(userSettings.fontSize);
    
    // Atualizar controles da interface apenas se existirem
    applySettingsToUI();
}

function getFontSizeValue(size) {
    switch(size) {
        case 'small': return '12px';
        case 'large': return '16px';
        default: return '14px';
    }
}

function toggleDarkTheme() {
    userSettings.darkTheme = document.getElementById('darkTheme').checked;
    saveSettings();
}

// Funções de Ação
function clearAllBlockedUsers() {
    if (confirm('Tem certeza que deseja desbloquear todos os usuários?')) {
        blockedUsers = [];
        database.ref(`users/${currentUser.uid}/blockedUsers`).set([])
            .then(() => {
                updateBlockedUsersList();
                showNotification('Todos os usuários foram desbloqueados.', 'success');
            })
            .catch(error => {
                console.error('Erro ao desbloquear usuários:', error);
                showNotification('Erro ao desbloquear usuários.', 'error');
            });
    }
}

function clearChatHistory() {
    if (confirm('Tem certeza que deseja limpar todo o histórico de conversas? Esta ação não pode ser desfeita.')) {
        const conversationsRef = database.ref('conversations');
        conversationsRef.once('value').then(snapshot => {
            const conversations = snapshot.val();
            const updates = {};
            
            Object.keys(conversations).forEach(conversationId => {
                if (conversationId.includes(currentUser.uid)) {
                    updates[`conversations/${conversationId}`] = null;
                }
            });
            
            database.ref().update(updates)
                .then(() => {
                    loadConversationsList();
                    showNotification('Histórico de conversas limpo com sucesso.', 'success');
                })
                .catch(error => {
                    console.error('Erro ao limpar histórico:', error);
                    showNotification('Erro ao limpar histórico.', 'error');
                });
        });
    }
}

function exportChatHistory() {
    const conversationsRef = database.ref('conversations');
    conversationsRef.once('value').then(snapshot => {
        const conversations = snapshot.val();
        const userConversations = [];
        
        Object.keys(conversations).forEach(conversationId => {
            if (conversationId.includes(currentUser.uid)) {
                const messages = conversations[conversationId];
                userConversations.push({
                    conversationId: conversationId,
                    messages: messages
                });
            }
        });
        
        // Criar arquivo de exportação
        const dataStr = JSON.stringify(userConversations, null, 2);
        const dataBlob = new Blob([dataStr], { type: 'application/json' });
        
        const link = document.createElement('a');
        link.href = URL.createObjectURL(dataBlob);
        link.download = `chat-export-${new Date().toISOString().split('T')[0]}.json`;
        link.click();
        
        showNotification('Conversas exportadas com sucesso!', 'success');
    }).catch(error => {
        console.error('Erro ao exportar conversas:', error);
        showNotification('Erro ao exportar conversas.', 'error');
    });
}

function resetAllSettings() {
    if (confirm('Tem certeza que deseja redefinir todas as configurações para os valores padrão?')) {
        userSettings = {
            soundNotification: true,
            tabNotification: true,
            onlineStatus: true,
            receiveMessages: true,
            darkTheme: false,
            fontSize: 'medium'
        };
        
        const settingsRef = database.ref(`users/${currentUser.uid}/settings`);
        settingsRef.set(userSettings)
            .then(() => {
                applySettings();
                showNotification('Configurações redefinidas com sucesso.', 'success');
            })
            .catch(error => {
                console.error('Erro ao redefinir configurações:', error);
                showNotification('Erro ao redefinir configurações.', 'error');
            });
    }
}

// Teste de microfone
// Teste de microfone
async function testMicrophoneFunction() {
    try {
        console.log('Iniciando teste do microfone...');
        
        // Verificar permissão primeiro
        const hasPermission = await checkMicrophonePermission();
        if (!hasPermission) {
            showNotification('Permita o acesso ao microfone primeiro.', 'error');
            showMicrophonePermissionInstructions();
            return;
        }
        
        const stream = await navigator.mediaDevices.getUserMedia({ 
            audio: {
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: true,
                sampleRate: 48000,
                channelCount: 1
            } 
        });
        
        // Criar elemento de áudio para feedback
        const audioContext = new AudioContext();
        const source = audioContext.createMediaStreamSource(stream);
        const analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;
        source.connect(analyser);
        
        // Mostrar indicador visual
        showMicrophoneTestUI(stream, analyser);
        
    } catch (error) {
        console.error('Erro ao testar microfone:', error);
        showNotification('Erro ao acessar microfone: ' + error.message, 'error');
        
        if (error.name === 'NotAllowedError') {
            showMicrophonePermissionInstructions();
        }
    }
}

function showMicrophoneTestUI(stream, analyser) {
    const modal = document.createElement('div');
    modal.style.cssText = `
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.8);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10000;
    `;
    
    modal.innerHTML = `
        <div style="background: white; padding: 24px; border-radius: 12px; max-width: 300px; text-align: center;">
            <h3 style="color: var(--md-sys-color-primary); margin-bottom: 16px;">Teste do Microfone</h3>
            <div id="volumeIndicator" style="width: 100%; height: 20px; background: #f0f0f0; border-radius: 10px; margin: 20px 0; overflow: hidden;">
                <div id="volumeLevel" style="height: 100%; background: #4CAF50; width: 0%; transition: width 0.1s;"></div>
            </div>
            <p id="volumeText" style="margin-bottom: 20px;">Fale para testar o microfone...</p>
            <button id="stopMicrophoneTest" 
                    style="background: var(--md-sys-color-primary); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer;">
                Parar Teste
            </button>
        </div>
    `;
    
    document.body.appendChild(modal);
    
    // Animar o indicador de volume
    const volumeLevel = document.getElementById('volumeLevel');
    const volumeText = document.getElementById('volumeText');
    const dataArray = new Uint8Array(analyser.frequencyBinCount);
    
    function updateVolume() {
        analyser.getByteFrequencyData(dataArray);
        const volume = Math.max(...dataArray) / 255 * 100;
        volumeLevel.style.width = volume + '%';
        
        if (volume < 10) {
            volumeLevel.style.background = '#f44336';
            volumeText.textContent = 'Microfone não detectando áudio';
        } else if (volume < 30) {
            volumeLevel.style.background = '#FF9800';
            volumeText.textContent = 'Volume baixo';
        } else {
            volumeLevel.style.background = '#4CAF50';
            volumeText.textContent = 'Microfone funcionando!';
        }
        
        if (modal.isConnected) {
            requestAnimationFrame(updateVolume);
        }
    }
    
    updateVolume();
    
    // Event listener para o botão de parar
    document.getElementById('stopMicrophoneTest').addEventListener('click', function() {
        if (stream) {
            stream.getTracks().forEach(track => track.stop());
        }
        if (audioContext) {
            audioContext.close();
        }
        modal.remove();
    });
    
    // Armazenar a stream para parar depois
    modal._stream = stream;
    modal._audioContext = audioContext;
}

// Atualizar lista de usuários bloqueados na aba de configurações
function updateBlockedUsersList() {
    const blockedUsersList = document.getElementById('blockedUsersList');
    if (!blockedUsersList) return;
    
    blockedUsersList.innerHTML = '';
    
    if (blockedUsers.length === 0) {
        blockedUsersList.innerHTML = `
            <div class="empty-state">
                <span class="material-icons">block</span>
                <p>Nenhum usuário bloqueado</p>
            </div>
        `;
        return;
    }
    
    // Buscar informações dos usuários bloqueados
    usersRef.once('value').then(snapshot => {
        const allUsers = snapshot.val();
        
        blockedUsers.forEach(userId => {
            if (allUsers[userId]) {
                const user = allUsers[userId];
                const blockedUserElement = document.createElement('div');
                blockedUserElement.className = 'blocked-user';
                
                blockedUserElement.innerHTML = `
                    <div>
                        <div class="user-name">${user.nome || 'Usuário'}</div>
                        <div class="user-details">${user.bloco ? `Bloco ${user.bloco}, AP ${user.apartamento}` : 'Portaria'}</div>
                    </div>
                    <button class="unblock-btn" data-user-id="${userId}">Desbloquear</button>
                `;
                
                blockedUsersList.appendChild(blockedUserElement);
            }
        });
        
        // Adicionar event listeners aos botões de desbloquear
        document.querySelectorAll('.unblock-btn').forEach(button => {
            button.addEventListener('click', function() {
                const userIdToUnblock = this.dataset.userId;
                unblockUser(userIdToUnblock);
            });
        });
    }).catch(error => {
        console.error('Erro ao carregar usuários bloqueados:', error);
        blockedUsersList.innerHTML = `
            <div class="empty-state">
                <span class="material-icons">error</span>
                <p>Erro ao carregar usuários bloqueados</p>
            </div>
        `;
    });
}

// Desbloquear usuário
function unblockUser(userId) {
    if (confirm(`Tem certeza que deseja desbloquear este usuário?`)) {
        blockedUsers = blockedUsers.filter(id => id !== userId);
        database.ref(`users/${currentUser.uid}/blockedUsers`).set(blockedUsers)
            .then(() => {
                updateBlockedUsersList();
                // Recarregar listas
                loadUsersList();
                loadConversationsList();
                showNotification('Usuário desbloqueado com sucesso.', 'success');
            })
            .catch(error => {
                console.error('Erro ao desbloquear usuário:', error);
                showNotification('Erro ao desbloquear usuário.', 'error');
            });
    }
}
// Fallback: carregar configurações quando a aba se tornar visível
const observer = new MutationObserver(function(mutations) {
    mutations.forEach(function(mutation) {
        if (mutation.type === 'attributes' && mutation.attributeName === 'class') {
            const settingsTab = document.getElementById('settingsTab');
            if (settingsTab && settingsTab.classList.contains('active') && !settingsInitialized) {
                console.log('Aba de configurações ativada - inicializando...');
                initializeSettings();
            }
        }
    });
});

// Iniciar observação quando o DOM estiver carregado
document.addEventListener('DOMContentLoaded', function() {
    const settingsTab = document.getElementById('settingsTab');
    if (settingsTab) {
        observer.observe(settingsTab, { attributes: true });
    }
});
