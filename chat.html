<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#4A90E2">
    <title>Interfone Virtual - Condomínio Cotovias</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#EBF3FE',
                            100: '#D7E8FD',
                            200: '#B0D1FB',
                            300: '#88B9F8',
                            400: '#61A2F6',
                            500: '#4A90E2',
                            600: '#3A73B5',
                            700: '#2B5688',
                            800: '#1D3A5A',
                            900: '#0E1D2D',
                        }
                    },
                    fontFamily: {
                        'inter': ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'slide-up': 'slideUp 0.3s ease-out',
                        'slide-down': 'slideDown 0.3s ease-out',
                        'scale-in': 'scaleIn 0.2s ease-out',
                        'float': 'float 3s ease-in-out infinite',
                        'pulse-slow': 'pulse 2s infinite',
                        'spin-slow': 'spin 1s linear infinite',
                        'fade-in': 'fadeIn 0.3s ease-out',
                        'slide-in-right': 'slideInRight 0.3s ease-out',
                    },
                    keyframes: {
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        slideDown: {
                            '0%': { opacity: '0', transform: 'translateY(-20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        scaleIn: {
                            '0%': { opacity: '0', transform: 'scale(0.95)' },
                            '100%': { opacity: '1', transform: 'scale(1)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-5px)' },
                        },
                        spin: {
                            'from': { transform: 'rotate(0deg)' },
                            'to': { transform: 'rotate(360deg)' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        slideInRight: {
                            '0%': { transform: 'translateX(100%)', opacity: '0' },
                            '100%': { transform: 'translateX(0)', opacity: '1' },
                        },
                    },
                },
            },
        }
    </script>
    
    <style>
        /* Estilos customizados */
        * {
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: linear-gradient(135deg, #F7F8FC 0%, #EEF2F7 100%);
            font-family: 'Inter', sans-serif;
        }
        
        /* Glass effect */
        .glass-header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(74, 144, 226, 0.1);
        }
        
        /* Scrollbar customizada */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: #E4E6EB;
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #4A90E2, #3A73B5);
            border-radius: 10px;
        }
        
        /* Chat container */
        .chat-container {
            background: linear-gradient(135deg, #F8FAFC 0%, #FFFFFF 100%);
        }
        
        /* Theme styles */
        body.dark-theme {
            background: linear-gradient(135deg, #1E293B 0%, #0F172A 100%);
        }
        
        body.dark-theme .chat-container {
            background: linear-gradient(135deg, #1E293B 0%, #0F172A 100%);
        }
        
        body.dark-theme .glass-header {
            background: rgba(30, 41, 59, 0.95);
            border-bottom-color: rgba(74, 144, 226, 0.2);
        }
        
        /* Message styles */
        .message.sent {
            background: linear-gradient(135deg, #4A90E2, #3A73B5);
            color: white;
        }
        
        .message.received {
            background: #F1F5F9;
            color: #1E293B;
        }
        
        body.dark-theme .message.received {
            background: #334155;
            color: #F1F5F9;
        }
        
        /* User item hover */
        .user-item:hover {
            background: rgba(74, 144, 226, 0.08);
        }
        
        /* Tab styles */
        .chat-tab {
            transition: all 0.2s ease;
            position: relative;
        }
        
        .chat-tab.active {
            color: #4A90E2;
        }
        
        .chat-tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, #4A90E2, #3A73B5);
            border-radius: 2px;
        }
        
        /* Ripple effect */
        .ripple {
            position: relative;
            overflow: hidden;
        }
        
        .ripple::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.4s, height 0.4s;
        }
        
        .ripple:active::after {
            width: 200px;
            height: 200px;
        }
        
        /* Call controls */
        .call-controls {
            animation: slideUp 0.3s ease-out;
        }
        
        /* Notification */
        .notification {
            animation: slideInRight 0.3s ease-out;
        }
        
        /* Switch toggle */
        .switch input:checked + .slider {
            background-color: #4A90E2;
        }
        
        .switch input:checked + .slider:before {
            transform: translateX(20px);
        }
        
        /* Loading spinner */
        .spinner-custom {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(74, 144, 226, 0.2);
            border-top-color: #4A90E2;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        /* Empty state icon */
        .empty-state-icon {
            animation: float 3s ease-in-out infinite;
        }
        
        /* Modal animation */
        .modal-scale {
            animation: scaleIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        /* Gradient text */
        .gradient-text {
            background: linear-gradient(135deg, #4A90E2, #3A73B5);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        /* Online status dot */
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #10B981;
        }
        
        .status-dot.offline {
            background-color: #9CA3AF;
        }
        
        /* Volume indicator */
        .volume-level {
            transition: width 0.1s ease;
        }
    </style>
</head>

    <script>
        // ============================================
        // CÓDIGO ORIGINAL COMPLETO - TODAS FUNCIONALIDADES MANTIDAS
        // ============================================
        
        // Variáveis globais
        let currentUser = null;
        let userSettings = {
            soundNotification: true,
            tabNotification: true,
            onlineStatus: true,
            receiveMessages: true,
            darkTheme: false,
            fontSize: 'medium'
        };

        // Elementos DOM
        const chatToggle = document.getElementById('chatToggle');
        const chatContainer = document.getElementById('chatContainer');
        const minimizeChat = document.getElementById('minimizeChat');
        const closeChat = document.getElementById('closeChat');
        const chatTabs = document.querySelectorAll('.chat-tab');
        const tabContents = document.querySelectorAll('.chat-tab-content');

        // Inicialização
        document.addEventListener('DOMContentLoaded', function () {
            // Verificar se o usuário está autenticado
            auth.onAuthStateChanged(user => {
                if (user) {
                    currentUser = user;
                    initializeChat();
                } else {
                    document.getElementById('usersList').innerHTML = `
                        <div class="empty-state text-center py-12">
                            <div class="inline-flex items-center justify-center w-16 h-16 bg-gray-100 rounded-full mb-4 empty-state-icon">
                                <i class="material-icons-outlined text-2xl text-gray-400">login</i>
                            </div>
                            <p class="text-gray-500">Faça login para usar o interfone virtual</p>
                        </div>
                    `;
                }
            });

            // Event Listeners
            if (chatToggle) chatToggle.addEventListener('click', toggleChat);
            if (minimizeChat) minimizeChat.addEventListener('click', minimizeChatWindow);
            if (closeChat) closeChat.addEventListener('click', closeChatWindow);

            chatTabs.forEach(tab => {
                tab.addEventListener('click', () => switchTab(tab.dataset.tab));
            });

            // Carregar configurações
            loadSettings();
        });

        function toggleChat() {
            // Função para compatibilidade
        }

        function minimizeChatWindow() {
            // Função para compatibilidade
        }

        function closeChatWindow() {
            // Função para compatibilidade
        }

        function switchTab(tabName) {
            chatTabs.forEach(tab => {
                tab.classList.toggle('active', tab.dataset.tab === tabName);
            });

            tabContents.forEach(content => {
                content.classList.toggle('active', content.id === `${tabName}Tab`);
            });

            if (tabName === 'settings') {
                setTimeout(() => {
                    const settingsContent = document.getElementById('settingsContent');
                    if (settingsContent && (!settingsContent.innerHTML.trim() || settingsContent.innerHTML.includes('spinner'))) {
                        initializeSettings();
                    }
                }, 50);
            }
        }

        function updateUserLastSeen() {
            if (currentUser) {
                database.ref(`users/${currentUser.uid}/lastSeen`).set(Date.now());
            }
        }

        window.addEventListener('load', updateUserLastSeen);
        setInterval(updateUserLastSeen, 60000);

        function getConversationId(user1, user2) {
            return [user1, user2].sort().join('_');
        }

        function formatTime(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        }

        function showNotification(message, type = 'info') {
            const existingNotification = document.querySelector('.notification');
            if (existingNotification) existingNotification.remove();

            const notification = document.createElement('div');
            notification.className = `notification fixed top-20 right-4 z-[2000] px-4 py-3 rounded-xl shadow-lg flex items-center gap-2 ${
                type === 'success' ? 'bg-green-500 text-white' : type === 'error' ? 'bg-red-500 text-white' : 'bg-blue-500 text-white'
            }`;
            notification.innerHTML = `
                <i class="material-icons text-sm">${type === 'success' ? 'check_circle' : type === 'error' ? 'error' : 'info'}</i>
                <span class="text-sm">${message}</span>
            `;
            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 3000);
        }

        function showOnPageNotification(title, body, onClickCallback) {
            const oldNotif = document.getElementById('onPageNotification');
            if (oldNotif) oldNotif.remove();

            const notification = document.createElement('div');
            notification.id = 'onPageNotification';
            notification.className = 'fixed top-20 right-4 bg-white rounded-xl shadow-lg p-4 max-w-sm cursor-pointer z-[2000] border-l-4 border-primary-500 animate-slide-in-right';
            notification.innerHTML = `
                <div class="font-semibold text-gray-800 mb-1">${title}</div>
                <div class="text-sm text-gray-600">${body}</div>
            `;
            notification.onclick = () => {
                if (onClickCallback) onClickCallback();
                notification.remove();
            };
            document.body.appendChild(notification);
            setTimeout(() => notification.remove(), 5000);
        }

        // ============================================
        // CHAT FUNCTIONS
        // ============================================
        
        let selectedUser = null;
        let usersRef = null;
        let messagesRef = null;
        let blockedUsers = [];
        let conversationsList = [];

        const usersList = document.getElementById('usersList');
        const messagesContainer = document.getElementById('messagesContainer');
        const messageInput = document.getElementById('messageInput');
        const sendMessageBtn = document.getElementById('sendMessage');
        const backToUsers = document.getElementById('backToUsers');
        const currentUserNameSpan = document.getElementById('currentUserName');
        const currentUserStatusSpan = document.getElementById('currentUserStatus');
        const blockCurrentUserBtn = document.getElementById('blockCurrentUser');

        function initializeChat() {
            usersRef = database.ref('users');
            messagesRef = database.ref('messages');

            loadBlockedUsers();
            loadUsersList();
            loadConversationsList();
            loadSettings();
            initializeSettings();

            updateUserLastSeen();
            setTimeout(updateUnreadMessagesIndicator, 2000);

            if (backToUsers) {
                backToUsers.addEventListener('click', () => switchTab('users'));
            }
            if (sendMessageBtn) {
                sendMessageBtn.addEventListener('click', sendNewMessage);
            }
            if (messageInput) {
                messageInput.addEventListener('keypress', function (e) {
                    if (e.key === 'Enter') sendNewMessage();
                });
            }
            if (blockCurrentUserBtn) {
                blockCurrentUserBtn.addEventListener('click', () => {
                    if (selectedUser) blockUser(selectedUser.id);
                });
            }

            // Escutar por novas mensagens
            listenForMessagesOptimized();
        }

        function loadUsersList() {
            usersRef.on('value', snapshot => {
                const users = snapshot.val();
                if (!usersList) return;
                usersList.innerHTML = '';

                if (!users) {
                    usersList.innerHTML = `
                        <div class="empty-state text-center py-12">
                            <div class="inline-flex items-center justify-center w-16 h-16 bg-gray-100 rounded-full mb-4 empty-state-icon">
                                <i class="material-icons-outlined text-2xl text-gray-400">people</i>
                            </div>
                            <p class="text-gray-500">Nenhum usuário cadastrado</p>
                        </div>
                    `;
                    return;
                }

                Object.keys(users).forEach(userId => {
                    if (userId === currentUser?.uid) return;
                    const user = users[userId];
                    const isBlocked = blockedUsers.includes(userId);
                    const isOnline = user.lastSeen && (Date.now() - user.lastSeen) < 300000;

                    const userItem = document.createElement('div');
                    userItem.className = `user-item flex items-center gap-3 p-3 rounded-xl cursor-pointer transition-all ${isBlocked ? 'opacity-50' : 'hover:bg-gray-100'}`;
                    userItem.dataset.userId = userId;

                    if (isBlocked) {
                        userItem.innerHTML = `
                            <div class="user-avatar w-10 h-10 rounded-full bg-gray-200 flex items-center justify-center font-semibold text-gray-500">${user.nome ? user.nome.charAt(0).toUpperCase() : 'U'}</div>

                                <div class="user-details text-xs text-gray-400">${user.bloco ? `Bloco ${user.bloco}, AP ${user.apartamento}` : 'Portaria'}</div>

                                <i class="material-icons text-sm text-gray-500">lock_open</i>

                        `;

                        unblockBtn.addEventListener('click', (e) => {
                            e.stopPropagation();

                        });

                        userItem.addEventListener('click', () => {
                            alert('Este usuário está bloqueado. Desbloqueie-o nas configurações para enviar mensagens.');
                        });
                    } else {
                        userItem.innerHTML = `
                            <div class="user-avatar w-10 h-10 rounded-full bg-gradient-to-br from-primary-500 to-primary-600 flex items-center justify-center font-semibold text-white">${user.nome ? user.nome.charAt(0).toUpperCase() : 'U'}</div>
                            <div class="user-info flex-1">
                                <div class="user-name font-medium text-gray-800">${user.nome || 'Usuário'}</div>
                                <div class="user-details text-xs text-gray-500">${user.bloco ? `Bloco ${user.bloco}, AP ${user.apartamento}` : 'Portaria'}</div>
                            </div>
                            <div class="user-actions flex items-center gap-1">
                                <div class="status-dot ${isOnline ? '' : 'offline'}"></div>
                                <button class="block-btn w-8 h-8 rounded-full flex items-center justify-center hover:bg-red-50 transition-all">
                                    <i class="material-icons text-sm text-gray-400 hover:text-red-500">block</i>
                                </button>
                            </div>
                        `;
                        const blockBtn = userItem.querySelector('.block-btn');
                        blockBtn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            blockUser(userId);
                        });
                        userItem.addEventListener('click', () => selectUser(userId, user));
                    }
                    usersList.appendChild(userItem);
                });
            });
        }

        function selectUser(userId, userData) {
            if (blockedUsers.includes(userId)) {
                alert('Este usuário está bloqueado. Desbloqueie-o nas configurações para enviar mensagens.');
                return;
            }

            selectedUser = { id: userId, ...userData };
            if (currentUserNameSpan) currentUserNameSpan.textContent = userData.nome || 'Usuário';
            if (blockCurrentUserBtn) blockCurrentUserBtn.style.display = 'flex';

            const isOnline = userData.lastSeen && (Date.now() - userData.lastSeen) < 300000;
            if (currentUserStatusSpan) {
                currentUserStatusSpan.className = `status-dot ${isOnline ? '' : 'offline'}`;
            }

            switchTab('conversation');
            loadConversationMessages();
            if (messageInput) messageInput.disabled = false;
            if (sendMessageBtn) sendMessageBtn.disabled = false;

            const conversationId = getConversationId(currentUser.uid, selectedUser.id);
            onConversationOpened(conversationId);
        }

        function loadConversationMessages() {
            if (!selectedUser) return;
            const conversationId = getConversationId(currentUser.uid, selectedUser.id);
            const conversationRef = database.ref(`conversations/${conversationId}`);

            conversationRef.on('value', snapshot => {
                const messages = snapshot.val();
                if (!messagesContainer) return;
                messagesContainer.innerHTML = '';

                if (!messages) {
                    messagesContainer.innerHTML = `
                        <div class="empty-state text-center py-12">
                            <div class="inline-flex items-center justify-center w-16 h-16 bg-gray-100 rounded-full mb-4 empty-state-icon">
                                <i class="material-icons-outlined text-2xl text-gray-400">chat_bubble_outline</i>
                            </div>
                            <p class="text-gray-500">Nenhuma mensagem ainda. Inicie a conversa!</p>
                        </div>
                    `;
                    return;
                }

                const sortedMessages = Object.values(messages).sort((a, b) => a.timestamp - b.timestamp);
                sortedMessages.forEach(message => {
                    const messageElement = document.createElement('div');
                    const isSent = message.senderId === currentUser.uid;
                    messageElement.className = `message max-w-[80%] p-3 rounded-2xl ${isSent ? 'sent self-end rounded-br-md' : 'received self-start rounded-bl-md'}`;
                    messageElement.innerHTML = `
                        <div class="message-text text-sm">${escapeHtml(message.text)}</div>
                        <div class="message-time text-xs opacity-70 mt-1 text-right">${formatTime(message.timestamp)}</div>
                    `;
                    messagesContainer.appendChild(messageElement);
                });
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function sendNewMessage() {
            if (!selectedUser || !messageInput?.value.trim()) return;
            const messageText = messageInput.value.trim();
            const conversationId = getConversationId(currentUser.uid, selectedUser.id);
            const messageRef = database.ref(`conversations/${conversationId}`).push();

            const messageData = {
                text: messageText,
                senderId: currentUser.uid,
                receiverId: selectedUser.id,
                timestamp: Date.now()
            };

            messageRef.set(messageData).then(() => {
                messageInput.value = '';
                loadConversationsList();
            }).catch(error => {
                console.error('Erro ao enviar mensagem:', error);
                showNotification('Erro ao enviar mensagem. Tente novamente.', 'error');
            });
        }

        function loadConversationsList() {
            if (!currentUser) return;
            const conversationsRef = database.ref('conversations');

            conversationsRef.on('value', snapshot => {
                const conversations = snapshot.val();
                const conversationsListElement = document.getElementById('conversationsList');
                if (!conversationsListElement) return;
                conversationsList = [];

                if (!conversations) {
                    conversationsListElement.innerHTML = `
                        <div class="empty-state text-center py-12">
                            <div class="inline-flex items-center justify-center w-16 h-16 bg-gray-100 rounded-full mb-4 empty-state-icon">
                                <i class="material-icons-outlined text-2xl text-gray-400">forum</i>
                            </div>
                            <p class="text-gray-500">Nenhuma conversa ainda</p>
                        </div>
                    `;
                    return;
                }

                database.ref('users').once('value').then(usersSnapshot => {
                    const allUsers = usersSnapshot.val();
                    const userConversations = [];

                    Object.keys(conversations).forEach(conversationId => {
                        if (conversationId.includes(currentUser.uid)) {
                            const messages = conversations[conversationId];
                            if (!messages) return;
                            const messageKeys = Object.keys(messages);
                            const lastMessageKey = messageKeys[messageKeys.length - 1];
                            const lastMessage = messages[lastMessageKey];
                            if (!lastMessage) return;

                            const userIds = conversationId.split('_');
                            const otherUserId = userIds[0] === currentUser.uid ? userIds[1] : userIds[0];
                            const otherUser = allUsers[otherUserId];

                            if (otherUser && !blockedUsers.includes(otherUserId)) {
                                userConversations.push({
                                    userId: otherUserId,
                                    userData: otherUser,
                                    lastMessage: lastMessage,
                                    conversationId: conversationId
                                });
                            }
                        }
                    });

                    userConversations.sort((a, b) => b.lastMessage.timestamp - a.lastMessage.timestamp);
                    conversationsList = userConversations;
                    updateConversationsListDisplay();
                });
            });
        }

        function updateConversationsListDisplay() {
            const conversationsListElement = document.getElementById('conversationsList');
            if (!conversationsListElement) return;
            conversationsListElement.innerHTML = '';

            if (conversationsList.length === 0) {
                conversationsListElement.innerHTML = `
                    <div class="empty-state text-center py-12">
                        <div class="inline-flex items-center justify-center w-16 h-16 bg-gray-100 rounded-full mb-4 empty-state-icon">
                            <i class="material-icons-outlined text-2xl text-gray-400">forum</i>
                        </div>
                        <p class="text-gray-500">Nenhuma conversa ainda</p>
                    </div>
                `;
                return;
            }

            conversationsList.forEach(conversation => {
                const conversationItem = document.createElement('div');
                const lastMessage = conversation.lastMessage;
                const isSent = lastMessage.senderId === currentUser.uid;
                const messagePreview = isSent ? `Você: ${lastMessage.text.substring(0, 50)}${lastMessage.text.length > 50 ? '...' : ''}` : lastMessage.text.substring(0, 50) + (lastMessage.text.length > 50 ? '...' : '');
                const time = formatTime(lastMessage.timestamp);

                conversationItem.className = 'conversation-item flex items-center gap-3 p-3 rounded-xl cursor-pointer hover:bg-gray-100 transition-all';
                conversationItem.dataset.userId = conversation.userId;
                conversationItem.innerHTML = `
                    <div class="conversation-avatar w-10 h-10 rounded-full bg-gradient-to-br from-primary-500 to-primary-600 flex items-center justify-center font-semibold text-white">
                        ${conversation.userData.nome ? conversation.userData.nome.charAt(0).toUpperCase() : 'U'}
                    </div>
                    <div class="conversation-info flex-1 min-w-0">
                        <div class="conversation-header flex justify-between items-center mb-1">
                            <div class="conversation-name font-medium text-gray-800 truncate">${conversation.userData.nome || 'Usuário'}</div>
                            <div class="conversation-time text-xs text-gray-400">${time}</div>
                        </div>
                        <div class="conversation-preview text-xs text-gray-500 truncate">${messagePreview}</div>
                    </div>
                    <button class="block-btn w-8 h-8 rounded-full flex items-center justify-center hover:bg-red-50 transition-all" title="Bloquear">
                        <i class="material-icons text-sm text-gray-400 hover:text-red-500">block</i>
                    </button>
                `;

                const blockBtn = conversationItem.querySelector('.block-btn');
                blockBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    blockUser(conversation.userId);
                });

                conversationItem.addEventListener('click', () => {
                    selectUser(conversation.userId, conversation.userData);
                });

                conversationsListElement.appendChild(conversationItem);
            });
        }

        function listenForMessagesOptimized() {
            const userConversationsRef = database.ref('conversations');
            let updateTimeout;

            const handleConversationUpdate = (snapshot, eventType) => {
                const conversationId = snapshot.key;
                if (conversationId.includes(currentUser.uid)) {
                    const messages = snapshot.val();
                    const messageKeys = Object.keys(messages || {});
                    if (messageKeys.length === 0) return;
                    const lastMessageKey = messageKeys[messageKeys.length - 1];
                    const lastMessage = messages[lastMessageKey];
                    const isReceivedMessage = lastMessage && lastMessage.senderId !== currentUser.uid;
                    const isCurrentConversation = selectedUser && conversationId === getConversationId(currentUser.uid, selectedUser.id);

                    clearTimeout(updateTimeout);
                    updateTimeout = setTimeout(() => {
                        loadConversationsList();
                        if (isCurrentConversation) {
                            loadConversationMessages();
                            if (isReceivedMessage) markConversationAsRead(conversationId);
                        } else if (isReceivedMessage && eventType === 'child_changed') {
                            handleNewMessageNotification(lastMessage, conversationId);
                        }
                        updateUnreadMessagesIndicator();
                    }, 100);
                }
            };

            userConversationsRef.on('child_changed', snapshot => handleConversationUpdate(snapshot, 'child_changed'));
            userConversationsRef.on('child_added', snapshot => handleConversationUpdate(snapshot, 'child_added'));
        }

        function handleNewMessageNotification(lastMessage, conversationId) {
            if (userSettings.soundNotification) playNotificationSound();
            if (userSettings.tabNotification) showDesktopNotification(lastMessage, conversationId);

            database.ref('users').child(lastMessage.senderId).once('value').then(snapshot => {
                const sender = snapshot.val();
                const senderName = sender ? sender.nome || 'Usuário' : 'Usuário';
                showOnPageNotification(`Nova Mensagem de ${senderName}`, lastMessage.text, () => {
                    if (sender) selectUser(lastMessage.senderId, sender);
                });
            });

            const badge = document.getElementById('unreadBadge');
            if (badge) {
                badge.classList.add('pulse');
                setTimeout(() => badge.classList.remove('pulse'), 1000);
            }
        }

        function onConversationOpened(conversationId) {
            markConversationAsRead(conversationId);
        }

        function loadBlockedUsers() {
            const blockedRef = database.ref(`users/${currentUser.uid}/blockedUsers`);
            blockedRef.on('value', snapshot => {
                blockedUsers = snapshot.val() || [];
                updateBlockedUsersListDisplay();
            });
        }

        function updateBlockedUsersListDisplay() {
            const blockedUsersListEl = document.getElementById('blockedUsersList');
            if (!blockedUsersListEl) return;
            blockedUsersListEl.innerHTML = '';

            if (blockedUsers.length === 0) {
                blockedUsersListEl.innerHTML = `
                    <div class="empty-state text-center py-8">
                        <i class="material-icons-outlined text-4xl text-gray-400 mb-2">block</i>
                        <p class="text-gray-500 text-sm">Nenhum usuário bloqueado</p>
                    </div>
                `;
                return;
            }

            database.ref('users').once('value').then(snapshot => {
                const allUsers = snapshot.val();
                blockedUsers.forEach(userId => {
                    if (allUsers[userId]) {
                        const user = allUsers[userId];
                        const blockedUserElement = document.createElement('div');
                        blockedUserElement.className = 'blocked-user flex justify-between items-center p-3 rounded-xl bg-gray-50 mb-2';
                        blockedUserElement.innerHTML = `
                            <div>
                                <div class="user-name font-medium text-gray-800">${user.nome || 'Usuário'}</div>
                                <div class="user-details text-xs text-gray-500">${user.bloco ? `Bloco ${user.bloco}, AP ${user.apartamento}` : 'Portaria'}</div>
                            </div>
                            <button class="unblock-btn px-3 py-1 text-sm text-red-500 hover:bg-red-50 rounded-lg transition-all" data-user-id="${userId}">Desbloquear</button>
                        `;
                        blockedUsersListEl.appendChild(blockedUserElement);
                    }
                });

                document.querySelectorAll('.unblock-btn').forEach(button => {
                    button.addEventListener('click', function () {
                        const userIdToUnblock = this.dataset.userId;
                        unblockUser(userIdToUnblock);
                    });
                });
            });
        }

        function blockUser(userId) {
            if (!currentUser) return;
            if (!confirm('Tem certeza que deseja bloquear este usuário?')) return;
            if (!blockedUsers.includes(userId)) {
                blockedUsers.push(userId);
                database.ref(`users/${currentUser.uid}/blockedUsers`).set(blockedUsers).then(() => {
                    updateBlockedUsersListDisplay();
                    loadUsersList();
                    loadConversationsList();
                    if (selectedUser && selectedUser.id === userId) {
                        switchTab('users');
                        selectedUser = null;
                        if (messageInput) messageInput.disabled = true;
                        if (sendMessageBtn) sendMessageBtn.disabled = true;
                    }
                    showNotification('Usuário bloqueado com sucesso!', 'success');
                }).catch(error => {
                    console.error('Erro ao bloquear usuário:', error);
                    showNotification('Erro ao bloquear usuário. Tente novamente.', 'error');
                });
            }
        }

        function unblockUser(userId) {
            blockedUsers = blockedUsers.filter(id => id !== userId);
            database.ref(`users/${currentUser.uid}/blockedUsers`).set(blockedUsers).then(() => {
                updateBlockedUsersListDisplay();
                loadUsersList();
                loadConversationsList();
                showNotification('Usuário desbloqueado com sucesso.', 'success');
            }).catch(error => {
                console.error('Erro ao desbloquear usuário:', error);
                showNotification('Erro ao desbloquear usuário.', 'error');
            });
        }

        function updateUnreadMessagesIndicator() {
            if (!currentUser) return;
            const userConversationsRef = database.ref('conversations');
            let unreadCount = 0;

            userConversationsRef.once('value').then(snapshot => {
                const conversations = snapshot.val();
                if (!conversations) return;

                const lastSeenRef = database.ref(`users/${currentUser.uid}/lastSeenConversations`);
                lastSeenRef.once('value').then(lastSeenSnapshot => {
                    const lastSeenTimes = lastSeenSnapshot.val() || {};

                    Object.keys(conversations).forEach(conversationId => {
                        if (conversationId.includes(currentUser.uid)) {
                            const messages = conversations[conversationId];
                            if (!messages) return;
                            const messageKeys = Object.keys(messages);
                            const lastMessageKey = messageKeys[messageKeys.length - 1];
                            const lastMessage = messages[lastMessageKey];

                            if (lastMessage && lastMessage.senderId !== currentUser.uid) {
                                const conversationLastSeen = lastSeenTimes[conversationId] || 0;
                                if (lastMessage.timestamp > conversationLastSeen) unreadCount++;
                            }
                        }
                    });
                    updateBadge(unreadCount);
                });
            });
        }

        function updateBadge(count) {
            const badge = document.getElementById('unreadBadge');
            if (badge) {
                if (count > 0) {
                    badge.textContent = count > 9 ? '9+' : count;
                    badge.style.display = 'flex';
                } else {
                    badge.style.display = 'none';
                }
            }
        }

        function markConversationAsRead(conversationId) {
            if (!currentUser) return;
            const lastSeenRef = database.ref(`users/${currentUser.uid}/lastSeenConversations/${conversationId}`);
            lastSeenRef.set(Date.now()).then(() => updateUnreadMessagesIndicator());
        }

        function playNotificationSound() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                oscillator.frequency.value = 800;
                oscillator.type = 'sine';
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.3);
            } catch (error) {
                console.log('Web Audio API não suportada');
            }
        }

        function showDesktopNotification(lastMessage, conversationId) {
            if (!("Notification" in window)) return;
            if (Notification.permission === "granted") {
                createNotification(lastMessage);
            } else if (Notification.permission !== "denied") {
                Notification.requestPermission().then(permission => {
                    if (permission === "granted") createNotification(lastMessage);
                });
            }

            function createNotification(message) {
                database.ref('users').child(message.senderId).once('value').then(snapshot => {
                    const sender = snapshot.val();
                    const senderName = sender ? sender.nome || 'Usuário' : 'Usuário';
                    const notification = new Notification("Interfone Virtual - Nova Mensagem", {
                        body: `${senderName}: ${message.text.substring(0, 100)}`,
                        icon: '/favicon.ico',
                        tag: conversationId
                    });
                    notification.onclick = function () {
                        window.focus();
                        database.ref('users').child(message.senderId).once('value').then(userSnapshot => {
                            const userData = userSnapshot.val();
                            if (userData) selectUser(message.senderId, userData);
                        });
                        notification.close();
                    };
                    setTimeout(() => notification.close(), 5000);
                });
            }
        }

        setInterval(updateUnreadMessagesIndicator, 30000);

                        <div class="setting-info">
                            <div class="setting-label font-medium text-gray-700">Tamanho do texto</div>
                            <div class="setting-description text-xs text-gray-500">Ajustar o tamanho das mensagens</div>
                        </div>
                        <select id="fontSize" class="setting-select px-3 py-1.5 border border-gray-200 rounded-lg text-sm">
                            <option value="small">Pequeno</option>
                            <option value="medium" selected>Médio</option>
                            <option value="large">Grande</option>
                        </select>
                    </div>
                </div>

                <div class="settings-section mb-6">
                    <div class="settings-title text-lg font-semibold text-gray-800 mb-3 pb-2 border-b border-gray-200">Ações</div>
                    <div class="settings-actions flex flex-col gap-2">
                        <button id="clearHistory" class="action-btn secondary w-full px-4 py-2 bg-gray-100 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-200 transition-all flex items-center justify-center gap-2">
                            <i class="material-icons-outlined text-sm">delete</i> Limpar Histórico
                        </button>
                        <button id="exportChat" class="action-btn secondary w-full px-4 py-2 bg-gray-100 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-200 transition-all flex items-center justify-center gap-2">
                            <i class="material-icons-outlined text-sm">download</i> Exportar Conversas
                        </button>
                        <button id="resetSettings" class="action-btn danger w-full px-4 py-2 bg-red-50 text-red-600 rounded-lg text-sm font-medium hover:bg-red-100 transition-all flex items-center justify-center gap-2">
                            <i class="material-icons-outlined text-sm">restore</i> Redefinir Configurações
                        </button>
                    </div>
                </div>
            `;

            setTimeout(() => {
                setupSettingsEventListeners();
                applySettingsToUI();
            }, 100);
        }

        function setupSettingsEventListeners() {
            const soundNotification = document.getElementById('soundNotification');
            const tabNotification = document.getElementById('tabNotification');
            const onlineStatus = document.getElementById('onlineStatus');
            const receiveMessages = document.getElementById('receiveMessages');
            const darkTheme = document.getElementById('darkTheme');
            const fontSize = document.getElementById('fontSize');

            if (soundNotification) {
                soundNotification.addEventListener('change', saveSettings);
                tabNotification.addEventListener('change', saveSettings);
                onlineStatus.addEventListener('change', saveSettings);
                receiveMessages.addEventListener('change', saveSettings);
                darkTheme.addEventListener('change', () => { saveSettings(); toggleDarkTheme(); });
                fontSize.addEventListener('change', saveSettings);
            }

            const clearBlocked = document.getElementById('clearBlocked');
            const clearHistory = document.getElementById('clearHistory');
            const exportChat = document.getElementById('exportChat');
            const resetSettings = document.getElementById('resetSettings');

            if (clearBlocked) clearBlocked.addEventListener('click', clearAllBlockedUsers);
            if (clearHistory) clearHistory.addEventListener('click', clearChatHistory);
            if (exportChat) exportChat.addEventListener('click', exportChatHistory);
            if (resetSettings) resetSettings.addEventListener('click', resetAllSettings);
        }

        function loadSettings() {
            if (!currentUser) return;
            const settingsRef = database.ref(`users/${currentUser.uid}/settings`);
            settingsRef.once('value').then(snapshot => {
                const savedSettings = snapshot.val();
                if (savedSettings) {
                    userSettings = { ...userSettings, ...savedSettings };
                    applySettings();
                    if (document.querySelector('#settingsTab.active')) applySettingsToUI();
                }
            });
        }

        function saveSettings() {
            if (!currentUser) return;
            updateSettingsFromUI();
            const settingsRef = database.ref(`users/${currentUser.uid}/settings`);
            settingsRef.set(userSettings).then(() => {
                showNotification('Configurações salvas com sucesso!', 'success');
            }).catch(error => {
                console.error('Erro ao salvar configurações:', error);
                showNotification('Erro ao salvar configurações.', 'error');
            });
            applySettings();
        }

        function updateSettingsFromUI() {
            const soundNotification = document.getElementById('soundNotification');
            const tabNotification = document.getElementById('tabNotification');
            const onlineStatus = document.getElementById('onlineStatus');
            const receiveMessages = document.getElementById('receiveMessages');
            const darkTheme = document.getElementById('darkTheme');
            const fontSize = document.getElementById('fontSize');

            if (soundNotification) {
                userSettings.soundNotification = soundNotification.checked;
                userSettings.tabNotification = tabNotification.checked;
                userSettings.onlineStatus = onlineStatus.checked;
                userSettings.receiveMessages = receiveMessages.checked;
                userSettings.darkTheme = darkTheme.checked;
                userSettings.fontSize = fontSize.value;
            }
        }

        function applySettingsToUI() {
            const soundNotification = document.getElementById('soundNotification');
            const tabNotification = document.getElementById('tabNotification');
            const onlineStatus = document.getElementById('onlineStatus');
            const receiveMessages = document.getElementById('receiveMessages');
            const darkTheme = document.getElementById('darkTheme');
            const fontSize = document.getElementById('fontSize');

            if (soundNotification) {
                soundNotification.checked = userSettings.soundNotification;
                tabNotification.checked = userSettings.tabNotification;
                onlineStatus.checked = userSettings.onlineStatus;
                receiveMessages.checked = userSettings.receiveMessages;
                darkTheme.checked = userSettings.darkTheme;
                fontSize.value = userSettings.fontSize;
            }
        }

        function applySettings() {
            if (userSettings.darkTheme) {
                document.body.classList.add('dark-theme');
            } else {
                document.body.classList.remove('dark-theme');
            }
            const fontSizeValue = userSettings.fontSize === 'small' ? '12px' : userSettings.fontSize === 'large' ? '16px' : '14px';
            document.body.style.fontSize = fontSizeValue;
            applySettingsToUI();
        }

        function toggleDarkTheme() {
            userSettings.darkTheme = document.getElementById('darkTheme').checked;
            saveSettings();
        }

        function clearAllBlockedUsers() {
            if (confirm('Tem certeza que deseja desbloquear todos os usuários?')) {
                blockedUsers = [];
                database.ref(`users/${currentUser.uid}/blockedUsers`).set([]).then(() => {
                    updateBlockedUsersListDisplay();
                    loadUsersList();
                    loadConversationsList();
                    showNotification('Todos os usuários foram desbloqueados.', 'success');
                }).catch(error => {
                    console.error('Erro ao desbloquear usuários:', error);
                    showNotification('Erro ao desbloquear usuários.', 'error');
                });
            }
        }

        function clearChatHistory() {
            if (confirm('Tem certeza que deseja limpar todo o histórico de conversas? Esta ação não pode ser desfeita.')) {
                const conversationsRef = database.ref('conversations');
                conversationsRef.once('value').then(snapshot => {
                    const conversations = snapshot.val();
                    const updates = {};
                    Object.keys(conversations).forEach(conversationId => {
                        if (conversationId.includes(currentUser.uid)) {
                            updates[`conversations/${conversationId}`] = null;
                        }
                    });
                    database.ref().update(updates).then(() => {
                        loadConversationsList();
                        showNotification('Histórico de conversas limpo com sucesso.', 'success');
                    }).catch(error => {
                        console.error('Erro ao limpar histórico:', error);
                        showNotification('Erro ao limpar histórico.', 'error');
                    });
                });
            }
        }

        function exportChatHistory() {
            const conversationsRef = database.ref('conversations');
            conversationsRef.once('value').then(snapshot => {
                const conversations = snapshot.val();
                const userConversations = [];
                Object.keys(conversations).forEach(conversationId => {
                    if (conversationId.includes(currentUser.uid)) {
                        userConversations.push({ conversationId, messages: conversations[conversationId] });
                    }
                });
                const dataStr = JSON.stringify(userConversations, null, 2);
                const dataBlob = new Blob([dataStr], { type: 'application/json' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(dataBlob);
                link.download = `chat-export-${new Date().toISOString().split('T')[0]}.json`;
                link.click();
                showNotification('Conversas exportadas com sucesso!', 'success');
            });
        }

        function resetAllSettings() {
            if (confirm('Tem certeza que deseja redefinir todas as configurações para os valores padrão?')) {
                userSettings = {
                    soundNotification: true,
                    tabNotification: true,
                    onlineStatus: true,
                    receiveMessages: true,
                    darkTheme: false,
                    fontSize: 'medium'
                };
                const settingsRef = database.ref(`users/${currentUser.uid}/settings`);
                settingsRef.set(userSettings).then(() => {
                    applySettings();
                    showNotification('Configurações redefinidas com sucesso.', 'success');
                }).catch(error => {
                    console.error('Erro ao redefinir configurações:', error);
                    showNotification('Erro ao redefinir configurações.', 'error');
                });
            }
        }

        // Observador para inicializar configurações quando a aba for ativada
        const observer = new MutationObserver(function (mutations) {
            mutations.forEach(function (mutation) {
                if (mutation.type === 'attributes' && mutation.attributeName === 'class') {
                    const settingsTab = document.getElementById('settingsTab');
                    if (settingsTab && settingsTab.classList.contains('active') && !settingsInitialized) {
                        initializeSettings();
                    }
                }
            });
        });

        document.addEventListener('DOMContentLoaded', function () {
            const settingsTab = document.getElementById('settingsTab');
            if (settingsTab) observer.observe(settingsTab, { attributes: true });
        });
    </script>
</body>

</html>
