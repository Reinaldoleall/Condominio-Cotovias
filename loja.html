<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#4A90E2">
    <title>Carregando Loja...</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#EBF3FE',
                            100: '#D7E8FD',
                            200: '#B0D1FB',
                            300: '#88B9F8',
                            400: '#61A2F6',
                            500: '#4A90E2',
                            600: '#3A73B5',
                            700: '#2B5688',
                            800: '#1D3A5A',
                            900: '#0E1D2D',
                        }
                    },
                    fontFamily: {
                        'inter': ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'slide-up': 'slideUp 0.4s ease-out',
                        'slide-down': 'slideDown 0.3s ease-out',
                        'scale-in': 'scaleIn 0.2s ease-out',
                        'float': 'float 3s ease-in-out infinite',
                        'shimmer': 'shimmer 2s infinite',
                    },
                    keyframes: {
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        slideDown: {
                            '0%': { opacity: '0', transform: 'translateY(-20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        scaleIn: {
                            '0%': { opacity: '0', transform: 'scale(0.95)' },
                            '100%': { opacity: '1', transform: 'scale(1)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-5px)' },
                        },
                        shimmer: {
                            '0%': { backgroundPosition: '-200% 0' },
                            '100%': { backgroundPosition: '200% 0' },
                        },
                    },
                },
            },
        }
    </script>
    
    <style>
        /* Estilos customizados essenciais */
        * {
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: linear-gradient(135deg, #F7F8FC 0%, #EEF2F7 100%);
            font-family: 'Inter', sans-serif;
        }
        
        /* Variáveis CSS dinâmicas */
        :root {
            --store-primary-color: #4A90E2;
            --store-on-primary-color: #FFFFFF;
        }
        
        /* Scrollbar customizada */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #E4E6EB;
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #4A90E2, #3A73B5);
            border-radius: 10px;
        }
        
        /* Glass effect para top bar */
        .glass-top-bar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(74, 144, 226, 0.1);
        }
        
        /* Shimmer skeleton */
        .shimmer-bg {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
        }
        
        /* Card hover premium */
        .premium-card {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .premium-card:hover {
            transform: translateY(-8px) scale(1.01);
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.15), 0 4px 18px rgba(0, 0, 0, 0.05);
        }
        
        /* Loading spinner */
        .loading-spinner-custom {
            width: 48px;
            height: 48px;
            border: 3px solid #E4E6EB;
            border-top-color: #4A90E2;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Animação de entrada para cards */
        .card-enter {
            animation: slideUp 0.5s ease-out forwards;
            opacity: 0;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Toast animation */
        .toast-slide {
            animation: slideUp 0.3s ease-out;
        }
        
        /* Badge pulse */
        @keyframes badgePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
        
        /* Ripple effect */
        .ripple {
            position: relative;
            overflow: hidden;
        }
        
        .ripple::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(74, 144, 226, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.4s, height 0.4s;
        }
        
        .ripple:active::after {
            width: 200px;
            height: 200px;
        }
        
        /* Modal animation */
        .modal-scale {
            animation: scaleIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        /* Cart sidebar slide */
        .cart-slide {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        /* Esconde scrollbar em containers */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* Product image container */
        .product-image-container {
            position: relative;
            overflow: hidden;
        }
        
        .product-image-container img {
            transition: transform 0.3s ease;
        }
        
        .product-card:hover .product-image-container img {
            transform: scale(1.05);
        }
        
        /* Gradient text */
        .gradient-text {
            background: linear-gradient(135deg, #4A90E2, #3A73B5);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
    </style>
</head>

<body>

    <!-- Loading Overlay -->
    <div id="loading-indicator" class="fixed inset-0 bg-white/90 backdrop-blur-sm flex items-center justify-center z-[2000]">
        <div class="flex flex-col items-center gap-4">
            <div class="loading-spinner-custom"></div>
            <p class="text-gray-500 text-sm animate-pulse">Carregando loja...</p>
        </div>
    </div>

    <div id="store-container" style="display: none;">
        <!-- Top Bar com efeito glass -->
        <div id="top-bar" class="glass-top-bar sticky top-0 z-50 shadow-sm px-4 sm:px-6 lg:px-8 py-3">
            <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
                <span id="top-bar-title" class="top-bar__title text-lg sm:text-xl font-bold gradient-text whitespace-nowrap"></span>
                <div class="flex items-center gap-3 flex-1 justify-end">
                    <div class="flex-1 max-w-md relative">
                        <div class="search-bar flex items-center bg-gray-50 border border-gray-200 rounded-2xl transition-all focus-within:border-primary-500 focus-within:shadow-[0_0_0_3px_rgba(74,144,226,0.15)]">
                            <i class="material-icons-outlined text-gray-400 pl-4">search</i>
                            <input type="search" id="product-search" placeholder="Buscar produtos..." autocomplete="off" class="w-full border-none bg-transparent py-3 px-3 text-gray-800 outline-none text-base">
                        </div>
                        <div id="search-suggestions" class="search-suggestions hidden absolute top-full left-0 right-0 mt-2 bg-white rounded-2xl shadow-lg border border-gray-100 z-[1050] max-h-80 overflow-y-auto"></div>
                    </div>
                    <button id="top-bar-cart-btn" class="top-bar__cart-btn relative w-12 h-12 bg-white border border-gray-200 rounded-xl flex items-center justify-center hover:border-primary-500 hover:shadow-md transition-all ripple">
                        <i class="material-icons-outlined text-gray-600">shopping_cart</i>
                        <span id="cart-badge" class="cart-badge absolute -top-1 -right-1 bg-primary-500 text-white min-w-[20px] h-5 rounded-full text-xs font-bold flex items-center justify-center border-2 border-white" style="display: none;">0</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Store Header com banner -->
        <header id="store-header" class="store-header relative w-full h-64 bg-gradient-to-r from-primary-600 to-primary-800 flex items-end p-6 sm:p-8 overflow-hidden">
            <!-- Banner será inserido via JS -->
        </header>

        <!-- Conteúdo Principal -->
        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
            <!-- Seção Destaques -->
            <section id="featured-section" class="mb-8">
                <h2 class="section-title text-2xl sm:text-3xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                    <i class="material-icons-outlined text-primary-500 text-2xl">stars</i>
                    Destaques
                </h2>
                <div id="featured-grid" class="products-grid grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-5"></div>
            </section>
            
            <!-- Seção Todos os Produtos -->
            <section>
                <h2 class="section-title text-2xl sm:text-3xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                    <i class="material-icons-outlined text-primary-500 text-2xl">storefront</i>
                    Todos os Produtos
                </h2>
                <nav id="filters-container" class="filters-container flex gap-2 overflow-x-auto pb-3 mb-6 hide-scrollbar"></nav>
                <div id="products-grid" class="products-grid grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-5"></div>
                <div id="no-results" class="hidden text-center py-12">
                    <div class="inline-flex items-center justify-center w-20 h-20 bg-gray-100 rounded-full mb-4">
                        <i class="material-icons-outlined text-3xl text-gray-400">search_off</i>
                    </div>
                    <p class="text-gray-500">Nenhum produto encontrado.</p>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="store-footer text-center py-6 mt-8 bg-white border-t border-gray-100">
            <p id="footer-text" class="text-sm text-gray-500"></p>
        </footer>

        <!-- Cart Sidebar -->
        <div id="cart-overlay" class="modal-overlay fixed inset-0 bg-black/60 backdrop-blur-sm z-[1099] hidden"></div>
        <aside id="cart-sidebar" class="cart-sidebar fixed top-0 right-0 w-full max-w-md h-full bg-white z-[1100] shadow-2xl cart-slide transform translate-x-full">
            <div class="flex flex-col h-full">
                <div class="cart-header flex justify-between items-center p-5 border-b border-gray-100">
                    <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2">
                        <i class="material-icons-outlined text-primary-500">shopping_cart</i>
                        Meu Carrinho
                    </h2>
                    <button id="close-cart-btn" class="close-btn w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center hover:bg-gray-200 transition-all">
                        <i class="material-icons-outlined text-gray-600">close</i>
                    </button>
                </div>
                <div id="cart-items" class="cart-items flex-1 overflow-y-auto p-5"></div>
                <div class="cart-footer p-5 border-t border-gray-100 bg-gray-50">
                    <div class="cart-summary">
                        <h3 class="text-base font-semibold text-gray-800 mb-4">Resumo do Pedido</h3>
                        <div class="space-y-3">
                            <div><label class="block text-sm font-medium text-gray-700 mb-1">Seu Nome</label><input type="text" id="customer-name" placeholder="Digite seu nome completo" class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:border-primary-500 focus:outline-none"></div>
                            <div><label class="block text-sm font-medium text-gray-700 mb-1">Endereço de Entrega</label><input type="text" id="customer-address" placeholder="Rua, Número, Bairro, Cidade" class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:border-primary-500 focus:outline-none"></div>
                            <div><label class="block text-sm font-medium text-gray-700 mb-1">Opção de Entrega</label><select id="delivery-option" class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:border-primary-500 focus:outline-none"></select></div>
                            <div><label class="block text-sm font-medium text-gray-700 mb-1">Forma de Pagamento</label><select id="payment-method" class="w-full px-4 py-2 border border-gray-200 rounded-xl focus:border-primary-500 focus:outline-none"></select></div>
                        </div>
                    </div>
                    <div class="cart-total flex justify-between items-center mt-4 pt-4 border-t border-gray-200">
                        <span class="text-base font-semibold text-gray-800">Total</span>
                        <span id="cart-total" class="text-xl font-bold text-primary-500">R$ 0,00</span>
                    </div>
                    <a id="checkout-btn" class="checkout-btn w-full mt-4 py-3 bg-green-500 text-white rounded-xl font-semibold flex items-center justify-center gap-2 hover:bg-green-600 transition-all" href="#" target="_blank">
                        <i class="material-icons-outlined">whatsapp</i> Finalizar Pedido
                    </a>
                </div>
            </div>
        </aside>

        <!-- Product Modal -->
        <div id="product-modal-overlay" class="modal-overlay fixed inset-0 bg-black/60 backdrop-blur-sm z-[1099] hidden items-center justify-center p-4">
            <div id="product-modal" class="product-modal bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-hidden modal-scale">
                <button id="close-modal-btn" class="close-modal-btn absolute top-4 right-4 w-10 h-10 bg-black/40 rounded-full flex items-center justify-center hover:bg-black/60 transition-all z-10">
                    <i class="material-icons-outlined text-white">close</i>
                </button>
                <div class="flex flex-col h-full">
                    <div id="product-modal-image" class="product-modal-image relative pt-[60%] bg-gray-100"></div>
                    <div class="product-modal-info p-6 overflow-y-auto flex-1">
                        <h2 id="product-modal-name" class="text-2xl font-bold text-gray-800 mb-2"></h2>
                        <p id="product-modal-price" class="price text-2xl font-bold text-primary-500 mb-4"></p>
                        <p id="product-modal-description" class="description text-gray-600 leading-relaxed"></p>
                    </div>
                    <div class="product-modal-footer p-5 border-t border-gray-100 flex gap-4 items-center">
                        <div class="quantity-selector flex items-center gap-2">
                            <button id="modal-quantity-minus" class="w-10 h-10 border border-gray-200 rounded-full flex items-center justify-center hover:border-primary-500 transition-all">-</button>
                            <input type="text" id="modal-quantity-input" value="1" readonly class="w-12 text-center text-lg font-semibold bg-transparent">
                            <button id="modal-quantity-plus" class="w-10 h-10 border border-gray-200 rounded-full flex items-center justify-center hover:border-primary-500 transition-all">+</button>
                        </div>
                        <button id="modal-add-to-cart" class="modal-add-to-cart flex-1 py-3 bg-primary-500 text-white rounded-xl font-semibold hover:bg-primary-600 transition-all">Adicionar ao Carrinho</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Toast Container -->
        <div id="toast-container" class="toast-container fixed bottom-6 left-1/2 transform -translate-x-1/2 z-[2000]"></div>
    </div>

    <script type="module">
        // ============================================
        // JAVASCRIPT ORIGINAL - NENHUMA ALTERAÇÃO
        // ============================================
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-database.js";

        document.addEventListener('DOMContentLoaded', async () => {
            const firebaseConfig = {
                apiKey: "AIzaSyD8FxHqt1g2V-mmureRPQyYe6QCuRSieGI",
                authDomain: "marketplaceconnect-af26d.firebaseapp.com",
                databaseURL: "https://marketplaceconnect-af26d-default-rtdb.firebaseio.com",
                projectId: "marketplaceconnect-af26d",
                storageBucket: "marketplaceconnect-af26d.firebasestorage.app",
                messagingSenderId: "768552546759",
                appId: "1:768552546759:web:4367fc4a161ecf90c469e2",
                measurementId: "G-7HHR78MHDP"
            };
            const app = initializeApp(firebaseConfig);
            const db = getDatabase(app);

            let storeData = {};
            let allProducts = [];
            let cart = [];

            const urlParams = new URLSearchParams(window.location.search);
            const userId = urlParams.get('userId');
            const CART_STORAGE_KEY = `store_cart_${userId}`;

            if (!userId) {
                document.body.innerHTML = '<p style="padding:20px; text-align:center;">Erro: ID da loja não encontrado na URL.</p>';
                return;
            }

            const showToast = (message, duration = 3000) => {
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                toast.className = 'toast bg-gray-800 text-white px-5 py-3 rounded-full shadow-lg text-sm toast-slide';
                toast.textContent = message;
                container.appendChild(toast);
                setTimeout(() => toast.remove(), duration);
            };
            
            const loadCart = () => {
                const savedCart = localStorage.getItem(CART_STORAGE_KEY);
                cart = savedCart ? JSON.parse(savedCart) : [];
                updateCart();
            };
            
            const saveCart = () => {
                localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cart));
            };
            
            const debounce = (func, delay) => {
                let timeout;
                return (...args) => {
                    clearTimeout(timeout);
                    timeout = setTimeout(() => func.apply(this, args), delay);
                };
            };

            try {
                const snapshot = await get(ref(db, `stores/${userId}`));
                if (snapshot.exists()) {
                    storeData = snapshot.val();
                    allProducts = storeData.products ? Object.entries(storeData.products).map(([id, p]) => ({ id, ...p })) : [];
                    renderStore();
                    loadCart();
                    document.getElementById('loading-indicator').style.display = 'none';
                    document.getElementById('store-container').style.display = 'block';

                    if (window.location.hash && window.location.hash.startsWith('#product-')) {
                        const productId = window.location.hash.substring(9);
                        const productToShow = allProducts.find(p => p.id === productId);
                        if (productToShow) {
                            setTimeout(() => openProductModal(productToShow), 100);
                        }
                    }

                } else {
                    document.body.innerHTML = '<p style="padding:20px; text-align:center;">Loja não encontrada.</p>';
                }
            } catch (error) {
                document.body.innerHTML = '<p style="padding:20px; text-align:center;">Ocorreu um erro ao carregar a loja.</p>';
                console.error(error);
            }

            function renderStore() {
                document.documentElement.style.setProperty('--store-primary-color', storeData.color || '#4A90E2');
                document.title = storeData.name || 'Loja';

                document.getElementById('top-bar-title').textContent = storeData.name || 'Loja';
                const header = document.getElementById('store-header');
                header.innerHTML = '';

                if (storeData.logo) {
                    const img = document.createElement('img');
                    img.src = storeData.logo;
                    img.alt = "Banner";
                    img.className = 'absolute top-0 left-0 w-full h-full object-cover';
                    header.appendChild(img);
                    const overlay = document.createElement('div');
                    overlay.className = 'absolute inset-0 bg-gradient-to-t from-black/60 to-transparent';
                    header.appendChild(overlay);
                }

                const infoDiv = document.createElement('div');
                infoDiv.className = 'store-info relative z-10';
                infoDiv.innerHTML = `<h1 class="text-white text-3xl sm:text-4xl font-bold drop-shadow-lg">${storeData.name || 'Nome da Loja'}</h1><p class="text-white/90 mt-2 max-w-lg drop-shadow">${storeData.description || ''}</p>`;
                header.appendChild(infoDiv);

                document.getElementById('footer-text').textContent = `© ${new Date().getFullYear()} ${storeData.name}. Todos os direitos reservados.`;

                renderFilters();
                renderSummaryOptions();
                renderFeaturedProducts();
                filterAndRenderProducts();
                setupEventListeners();
            }

            function renderFilters() {
                const filtersContainer = document.getElementById('filters-container');
                filtersContainer.innerHTML = `<button class="category-chip active px-4 py-2 rounded-full text-sm font-medium transition-all bg-primary-500 text-white shadow-md" data-id="all">Todos</button>`;
                if (storeData.categories) {
                    Object.entries(storeData.categories).forEach(([id, name]) => {
                        filtersContainer.innerHTML += `<button class="category-chip px-4 py-2 rounded-full text-sm font-medium transition-all bg-white border border-gray-200 text-gray-600 hover:border-primary-500" data-id="${id}">${name}</button>`;
                    });
                }
            }

            function renderSummaryOptions() {
                const deliverySelect = document.getElementById('delivery-option');
                const paymentSelect = document.getElementById('payment-method');
                deliverySelect.innerHTML = storeData.deliveryOptions ? Object.values(storeData.deliveryOptions).map(opt => `<option>${opt}</option>`).join('') : '<option>Não há opções</option>';
                paymentSelect.innerHTML = storeData.paymentMethods ? Object.values(storeData.paymentMethods).map(opt => `<option>${opt}</option>`).join('') : '<option>Não há opções</option>';
            }

            function filterAndRenderProducts() {
                const searchTerm = document.getElementById('product-search').value.toLowerCase();
                const activeChip = document.querySelector('.category-chip.active');
                const categoryId = activeChip ? activeChip.dataset.id : 'all';

                let filtered = allProducts;
                if (categoryId !== 'all') {
                    filtered = filtered.filter(p => p.category === categoryId);
                }
                if (searchTerm) {
                    filtered = filtered.filter(p => p.name.toLowerCase().includes(searchTerm));
                }
                renderProducts(filtered, 'products-grid');
            }

            function renderFeaturedProducts() {
                const featured = allProducts.filter(p => p.available).slice(0, 4);
                if (featured.length > 0) {
                    document.getElementById('featured-section').style.display = 'block';
                    renderProducts(featured, 'featured-grid');
                } else {
                    document.getElementById('featured-section').style.display = 'none';
                }
            }

            function renderProducts(products, gridId) {
                const grid = document.getElementById(gridId);
                const noResults = document.getElementById('no-results');
                grid.innerHTML = '';
                if (products.length === 0 && gridId === 'products-grid') {
                    noResults.style.display = 'block';
                    return;
                }
                if (gridId === 'products-grid') noResults.style.display = 'none';

                products.forEach((product, index) => {
                    const card = document.createElement('div');
                    card.className = 'product-card bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-xl transition-all premium-card card-enter';
                    card.style.animationDelay = `${index * 0.05}s`;
                    card.innerHTML = `
                        <a href="#" class="product-card__image-link block">
                            <div class="product-image-container relative pt-[100%] bg-gray-100">
                                <img src="${product.image || ''}" alt="${product.name}" loading="lazy" class="absolute top-0 left-0 w-full h-full object-contain p-4">
                            </div>
                        </a>
                        <div class="product-card__info p-4">
                            <div class="product-card__name font-semibold text-gray-800 mb-2 line-clamp-2">${product.name}</div>
                            <div class="product-card__footer flex justify-between items-center mt-2">
                                <span class="product-card__price text-lg font-bold text-primary-500">R$ ${product.price.toFixed(2).replace('.', ',')}</span>
                                <button class="product-card__add-btn w-10 h-10 bg-primary-500 text-white rounded-xl flex items-center justify-center hover:bg-primary-600 transition-all" ${!product.available ? 'disabled' : ''}><i class="material-icons-outlined text-lg">add_shopping_cart</i></button>
                            </div>
                        </div>
                        ${!product.available ? '<div class="absolute inset-0 bg-white/80 flex items-center justify-center"><span class="bg-gray-800 text-white px-3 py-1 rounded-full text-sm">Esgotado</span></div>' : ''}
                    `;
                    card.querySelector('.product-card__image-link').onclick = (e) => { e.preventDefault(); openProductModal(product); };
                    if (product.available) {
                        card.querySelector('.product-card__add-btn').onclick = () => addToCart(product, 1);
                    }
                    grid.appendChild(card);
                });
            }

            function setupEventListeners() {
                document.getElementById('top-bar-cart-btn').onclick = () => toggleCartSidebar(true);
                document.getElementById('close-cart-btn').onclick = () => toggleCartSidebar(false);
                document.getElementById('cart-overlay').onclick = () => toggleCartSidebar(false);

                const searchInput = document.getElementById('product-search');

                searchInput.addEventListener('keyup', (e) => {
                    if (e.key === 'Enter') {
                        filterAndRenderProducts();
                        hideSearchSuggestions();
                    }
                });

                searchInput.addEventListener('input', debounce(() => {
                    filterAndRenderProducts();
                    renderSearchSuggestions(searchInput.value)
                }, 300));

                document.addEventListener('click', (e) => {
                    if (!e.target.closest('.top-bar__search')) {
                        hideSearchSuggestions();
                    }
                });

                document.getElementById('filters-container').addEventListener('click', e => {
                    if (e.target.classList.contains('category-chip')) {
                        document.querySelector('.category-chip.active').classList.remove('active');
                        e.target.classList.add('active');
                        filterAndRenderProducts();
                    }
                });

                document.getElementById('checkout-btn').addEventListener('click', (e) => {
                    e.preventDefault();
                    if (document.getElementById('customer-name').value.trim() === '' || document.getElementById('customer-address').value.trim() === '') {
                        showToast('Por favor, preencha seu nome e endereço.');
                        return;
                    }
                    window.open(e.target.href, '_blank');
                });
            }

            function renderSearchSuggestions(query) {
                const suggestionsContainer = document.getElementById('search-suggestions');
                const searchTerm = query.toLowerCase().trim();

                if (!searchTerm) { hideSearchSuggestions(); return; }

                const matchedProducts = allProducts.filter(p => p.name.toLowerCase().includes(searchTerm)).slice(0, 5);

                if (matchedProducts.length === 0) { hideSearchSuggestions(); return; }

                suggestionsContainer.innerHTML = matchedProducts.map(product => `
                    <div class="suggestion-item flex items-center gap-3 p-3 cursor-pointer hover:bg-gray-50 transition-colors border-b border-gray-100" data-product-id="${product.id}">
                        <div class="suggestion-item__image w-12 h-12 bg-cover bg-center rounded-lg flex-shrink-0" style="background-image: url('${product.image || ''}')"></div>
                        <div class="suggestion-item__info flex-1">
                            <span class="suggestion-item__name block font-medium text-gray-800">${product.name}</span>
                            <span class="suggestion-item__price text-sm text-primary-500 font-semibold">R$ ${product.price.toFixed(2).replace('.', ',')}</span>
                        </div>
                    </div>
                `).join('');

                suggestionsContainer.querySelectorAll('.suggestion-item').forEach(item => {
                    item.addEventListener('click', () => {
                        const productId = item.dataset.productId;
                        const product = allProducts.find(p => p.id === productId);
                        if (product) {
                            openProductModal(product);
                            document.getElementById('product-search').value = '';
                            hideSearchSuggestions();
                        }
                    });
                });

                suggestionsContainer.style.display = 'block';
            }

            function hideSearchSuggestions() { document.getElementById('search-suggestions').style.display = 'none'; }
            
            function toggleCartSidebar(open) {
                const sidebar = document.getElementById('cart-sidebar');
                const overlay = document.getElementById('cart-overlay');
                if (open) {
                    sidebar.classList.remove('translate-x-full');
                    overlay.classList.remove('hidden');
                    document.body.style.overflow = 'hidden';
                } else {
                    sidebar.classList.add('translate-x-full');
                    overlay.classList.add('hidden');
                    document.body.style.overflow = '';
                }
            }

            function addToCart(product, quantity) {
                const existingItem = cart.find(item => item.id === product.id);
                if (existingItem) existingItem.quantity += quantity;
                else cart.push({ ...product, quantity: quantity });
                showToast(`${product.name} adicionado ao carrinho!`);
                updateCart();
            }

            function updateCart() {
                const cartItemsContainer = document.getElementById('cart-items');
                cartItemsContainer.innerHTML = cart.length === 0 ? '<p class="text-center text-gray-400 py-8">Seu carrinho está vazio.</p>' : '';

                let total = 0, totalItems = 0;
                cart.forEach(item => {
                    total += item.price * item.quantity;
                    totalItems += item.quantity;
                    cartItemsContainer.innerHTML += `
                        <div class="cart-item flex gap-4 mb-4 pb-4 border-b border-gray-100">
                            <div class="cart-item-img w-16 h-16 bg-cover bg-center rounded-xl flex-shrink-0" style="background-image: url('${item.image}')"></div>
                            <div class="cart-item-info flex-1">
                                <div class="cart-item-name font-medium text-gray-800">${item.name}</div>
                                <div class="cart-item-price text-primary-500 font-semibold">R$ ${(item.price * item.quantity).toFixed(2).replace('.', ',')}</div>
                                <div class="cart-item-actions flex items-center gap-2 mt-2">
                                    <button class="remove-one-btn w-8 h-8 border border-gray-200 rounded-lg flex items-center justify-center hover:border-primary-500" data-id="${item.id}">-</button>
                                    <input type="number" value="${item.quantity}" readonly class="w-12 text-center border border-gray-200 rounded-lg bg-gray-50">
                                    <button class="add-one-btn w-8 h-8 border border-gray-200 rounded-lg flex items-center justify-center hover:border-primary-500" data-id="${item.id}">+</button>
                                    <button class="remove-all-btn ml-auto text-red-500 hover:text-red-600" data-id="${item.id}"><i class="material-icons-outlined">delete</i></button>
                                </div>
                            </div>
                        </div>`;
                });

                cartItemsContainer.querySelectorAll('.add-one-btn').forEach(b => b.onclick = () => updateQuantity(b.dataset.id, 1));
                cartItemsContainer.querySelectorAll('.remove-one-btn').forEach(b => b.onclick = () => updateQuantity(b.dataset.id, -1));
                cartItemsContainer.querySelectorAll('.remove-all-btn').forEach(b => b.onclick = () => removeFromCart(b.dataset.id));

                document.getElementById('cart-total').textContent = `R$ ${total.toFixed(2).replace('.', ',')}`;
                const badge = document.getElementById('cart-badge');
                badge.textContent = totalItems;
                badge.style.display = totalItems > 0 ? 'flex' : 'none';

                updateCheckoutLink();
                saveCart();
            }

            function updateQuantity(productId, change) {
                const item = cart.find(i => i.id === productId);
                if (item) {
                    item.quantity += change;
                    if (item.quantity <= 0) removeFromCart(productId);
                    else updateCart();
                }
            }

            function removeFromCart(productId) {
                cart = cart.filter(i => i.id !== productId);
                updateCart();
            }

            function updateCheckoutLink() {
                const phone = storeData.whatsapp, btn = document.getElementById('checkout-btn');
                if (!phone || cart.length === 0) {
                    btn.setAttribute('disabled', true);
                    btn.href = '#';
                    return;
                }
                btn.removeAttribute('disabled');

                const name = document.getElementById('customer-name').value;
                const address = document.getElementById('customer-address').value;
                const delivery = document.getElementById('delivery-option').value;
                const payment = document.getElementById('payment-method').value;

                let message = `🛒 *PEDIDO - ${storeData.name}* 🛒\n\n`;
                message += `*Cliente:* ${name || 'Não informado'}\n`;
                message += `*Endereço:* ${address || 'Não informado'}\n`;
                message += `*Entrega:* ${delivery}\n`;
                message += `*Pagamento:* ${payment}\n\n`;
                message += `*ITENS DO PEDIDO:*\n`;
                message += '─'.repeat(30) + '\n';

                let total = 0;
                cart.forEach((item, index) => {
                    const itemTotal = item.price * item.quantity;
                    total += itemTotal;
                    message += `\n*${item.quantity}x* ${item.name}\n`;
                    message += `   R$ ${item.price.toFixed(2).replace('.', ',')} (un)\n`;
                    message += `   *Subtotal: R$ ${itemTotal.toFixed(2).replace('.', ',')}*\n`;

                    if (index < cart.length - 1) {
                        message += '   ───────────────────\n';
                    }
                });

                message += '\n' + '─'.repeat(30) + '\n';
                message += `\n💰 *VALOR TOTAL: R$ ${total.toFixed(2).replace('.', ',')}* 💰\n\n`;
                message += `_Pedido gerado automaticamente via loja virtual_`;

                btn.href = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
            }

            function openProductModal(product) {
                if (!product.available) return;

                const modalImgContainer = document.getElementById('product-modal-image');
                modalImgContainer.innerHTML = `<img src="${product.image || ''}" alt="${product.name}" class="absolute top-0 left-0 w-full h-full object-contain p-4">`;

                document.getElementById('product-modal-name').textContent = product.name;
                document.getElementById('product-modal-price').textContent = `R$ ${product.price.toFixed(2).replace('.', ',')}`;
                document.getElementById('product-modal-description').textContent = product.description;

                const overlay = document.getElementById('product-modal-overlay');
                overlay.classList.remove('hidden');
                overlay.classList.add('flex');
                document.body.style.overflow = 'hidden';

                let quantity = 1;
                const quantityInput = document.getElementById('modal-quantity-input');
                const updateQtyUI = () => quantityInput.value = quantity;
                updateQtyUI();

                document.getElementById('modal-quantity-plus').onclick = () => { quantity++; updateQtyUI(); };
                document.getElementById('modal-quantity-minus').onclick = () => { if (quantity > 1) quantity--; updateQtyUI(); };

                document.getElementById('modal-add-to-cart').onclick = () => {
                    addToCart(product, quantity);
                    closeProductModal();
                };

                document.getElementById('close-modal-btn').onclick = closeProductModal;
                overlay.onclick = (e) => { if (e.target === overlay) closeProductModal(); };
            }

            function closeProductModal() {
                const overlay = document.getElementById('product-modal-overlay');
                overlay.classList.add('hidden');
                overlay.classList.remove('flex');
                document.body.style.overflow = '';
            }

            ['customer-name', 'customer-address', 'delivery-option', 'payment-method'].forEach(id => {
                document.getElementById(id).addEventListener('input', updateCheckoutLink);
            });
        });
    </script>
    
    <style>
        /* Utilitários adicionais */
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        @media (max-width: 640px) {
            .products-grid {
                gap: 12px;
            }
        }
        
        .toast {
            animation: slideUp 0.3s ease-out;
        }
    </style>
</body>
</html>
