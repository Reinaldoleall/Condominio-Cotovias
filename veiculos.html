<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portaria Ágil - Controle e Relatórios</title>

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <meta name="theme-color" content="#f8fafc">

<style>
    /* 1. CONFIGURAÇÃO GERAL E TEMAS */
    :root {
        --primary-color: #2563eb; /* Azul */
        --primary-color-light: #eff6ff;
        --success-color: #16a34a; /* Verde */
        --danger-color: #dc2626; /* Vermelho */
        
        --bg-color: #f8fafc; /* Fundo Principal (Quase Branco) */
        --surface-color: #ffffff; /* Cor dos Cards */
        --outline-color: #e2e8f0; /* Bordas */
        
        --text-primary: #0f172a; /* Texto Principal (Escuro) */
        --text-secondary: #64748b; /* Texto Secundário (Cinza) */

        --font-family: 'Inter', sans-serif;
        --border-radius: 0.75rem; /* 12px */
        --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        --transition: all 0.2s ease-in-out;
    }

    [data-theme="dark"] {
        --primary-color: #3b82f6;
        --primary-color-light: #1e293b;
        --bg-color: #0f172a;
        --surface-color: #1e293b;
        --outline-color: #334155;
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
    }

    /* Reset Básico */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-tap-highlight-color: transparent; }
    body {
        font-family: var(--font-family);
        background-color: var(--bg-color);
        color: var(--text-primary);
        line-height: 1.5;
        font-size: 16px;
        transition: var(--transition);
    }

    /* 2. LAYOUT PRINCIPAL */
    .app-container { max-width: 900px; margin: 0 auto; padding: 1.5rem 1rem; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
    .app-title { font-size: 1.5rem; font-weight: 700; color: var(--primary-color); display: flex; align-items: center; gap: 0.5rem; }
    .header-controls { display: flex; align-items: center; gap: 0.5rem; }
    .user-info { font-weight: 500; color: var(--text-secondary); }

    /* 3. COMPONENTES */
    .card { background-color: var(--surface-color); border-radius: var(--border-radius); box-shadow: var(--shadow); border: 1px solid var(--outline-color); padding: 1.5rem; margin-bottom: 2rem; transition: var(--transition); }
    #entry-form { display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-start; }
    .input-group { flex: 1 1 200px; }
    label { font-size: 0.875rem; font-weight: 500; color: var(--text-secondary); display: block; margin-bottom: 0.5rem; }
    input[type="text"] { width: 100%; height: 48px; padding: 0 1rem; font-size: 1rem; border: 1px solid var(--outline-color); border-radius: 0.5rem; background-color: var(--bg-color); color: var(--text-primary); transition: var(--transition); }
    input[type="text"]:focus { border-color: var(--primary-color); box-shadow: 0 0 0 3px var(--primary-color-light); outline: none; }
    #placa { text-transform: uppercase; font-weight: 600; }
    
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; height: 48px; padding: 0 1.5rem; border: none; border-radius: 0.5rem; font-size: 1rem; font-weight: 600; cursor: pointer; transition: var(--transition); text-decoration: none; }
    .btn-sm { height: 40px; padding: 0 1rem; font-size: 0.875rem; }
    .btn-primary { background-color: var(--primary-color); color: white; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-secondary { background-color: var(--surface-color); color: var(--text-secondary); border: 1px solid var(--outline-color); }
    .btn-secondary:hover { background-color: var(--primary-color-light); color: var(--primary-color); }
    .btn-icon { background: none; border: none; padding: 0.5rem; border-radius: 50%; color: var(--text-secondary); }
    .btn-icon:hover { color: var(--text-primary); background-color: var(--primary-color-light); }

    .log-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 1rem; }
    .log-title { font-size: 1.25rem; font-weight: 600; }
    .controls-group { display: flex; gap: 0.5rem; align-items: center; }
    .filter-btn-group button { border: 1px solid var(--outline-color); background: var(--surface-color); color: var(--text-secondary); }
    .filter-btn-group button.active { background-color: var(--primary-color-light); color: var(--primary-color); border-color: var(--primary-color); }
    .filter-btn-group button:first-child { border-radius: 0.5rem 0 0 0.5rem; }
    .filter-btn-group button:last-child { border-radius: 0 0.5rem 0.5rem 0; border-left: 0; }
    
    .log-list ul { list-style: none; }
    .log-list li { display: grid; grid-template-columns: 1fr auto; gap: 1rem; padding: 1rem; border-bottom: 1px solid var(--outline-color); transition: var(--transition); }
    .log-list li:hover { background-color: var(--primary-color-light); }
    .log-list li:last-child { border-bottom: none; }
    .vehicle-info .placa { font-size: 1.125rem; font-weight: 600; color: var(--text-primary); }
    .vehicle-info .details { font-size: 0.875rem; color: var(--text-secondary); }
    .log-actions { display: flex; align-items: center; }
    .exited-log { opacity: 0.6; }
    .exited-log .placa { text-decoration: line-through; }
    .exited-log .btn-exit { display: none; }
    .empty-state { text-align: center; padding: 3rem; border: 2px dashed var(--outline-color); border-radius: var(--border-radius); }

    /* Loading e Notificações */
    #loadingOverlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(5px); z-index: 10000; display: flex; align-items: center; justify-content: center; }
    [data-theme="dark"] #loadingOverlay { background: rgba(15, 23, 42, 0.7); }
    .spinner { width: 48px; height: 48px; border: 5px solid var(--outline-color); border-top-color: var(--primary-color); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast-container { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 9999; }
    .toast { display: flex; align-items: center; gap: 0.75rem; padding: 1rem; border-radius: 0.5rem; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); color: white; animation: toast-in 0.5s ease, toast-out 0.5s 4.5s ease forwards; }
    .toast-success { background-color: var(--success-color); }
    .toast-error { background-color: var(--danger-color); }
    @keyframes toast-in { from { transform: translateX(120%); } to { transform: translateX(0); } }
    @keyframes toast-out { from { transform: translateX(0); } to { transform: translateX(120%); } }

    @media (max-width: 768px) {
        .log-header { flex-direction: column; align-items: stretch; }
        .log-list li { grid-template-columns: 1fr; text-align: center; }
        .log-actions { justify-content: center; margin-top: 0.5rem; }
    }
</style>
</head>

<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

    <div id="loadingOverlay">
        <div class="spinner"></div>
    </div>
    <div id="toastContainer" class="toast-container"></div>

    <div class="app-container">
        <header>
            <div class="app-title">
                <span class="material-icons-outlined">shield</span>
                <span>Portaria Ágil</span>
            </div>
            <div class="header-controls">
                <div class="user-info"><span id="nomePorteiroLogado"></span></div>
                <button class="btn-icon" id="theme-toggle" aria-label="Alternar tema"><span class="material-icons-outlined">dark_mode</span></button>
                <button id="btnLogout" class="btn-icon" aria-label="Sair"><span class="material-icons-outlined" style="color: var(--danger-color);">logout</span></button>
            </div>
        </header>

        <main>
            <section class="card no-print">
                <form id="entry-form">
                    <div class="input-group">
                        <label for="placa">Placa do Veículo*</label>
                        <input type="text" id="placa" name="placa" required autocomplete="off">
                    </div>
                    <div class="input-group">
                        <label for="obs">Observações (Opcional)</label>
                        <input type="text" id="obs" name="obs" autocomplete="off" placeholder="Ex: Gol Prata, Bloco 5">
                    </div>
                    <div style="padding-top: 1.75rem;">
                        <button type="submit" class="btn btn-primary" id="btnRegistrar"><span class="material-icons-outlined">login</span> Registrar Entrada</button>
                    </div>
                </form>
            </section>
            
            <section>
                <div class="log-header">
                    <h2 class="log-title">Registros de Veículos</h2>
                    <div class="controls-group no-print">
                         <div class="filter-btn-group">
                            <button id="filter-present" class="btn btn-sm active">No Pátio</button>
                            <button id="filter-all" class="btn btn-sm">Histórico Completo</button>
                        </div>
                        <button id="export-csv" class="btn btn-sm btn-secondary"><span class="material-icons-outlined">description</span>CSV</button>
                        <button id="export-pdf" class="btn btn-sm btn-secondary"><span class="material-icons-outlined">picture_as_pdf</span>PDF</button>
                    </div>
                </div>
                <div class="log-list card">
                    <ul id="vehicle-list"></ul>
                    <div id="emptyState" class="empty-state" style="display: none;">
                        <h3>Nenhum registro encontrado</h3>
                        <p>A lista de veículos aparecerá aqui.</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        // --- 1. CONFIGURAÇÃO FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyByyM8RvGNM5pyrQIQ7nCH6mmgYAIpq0bc",
            authDomain: "rifas-c414b.firebaseapp.com",
            databaseURL: "https://rifas-c414b-default-rtdb.firebaseio.com",
            projectId: "rifas-c414b",
            storageBucket: "rifas-c414b.firebasestorage.app",
            messagingSenderId: "770195193538",
            appId: "1:770195193538:web:48e585ac5661d27f3dc55b"
        };
        firebase.initializeApp(firebaseConfig);
        
        // --- 2. REFERÊNCIAS ---
        const auth = firebase.auth();
        const db = firebase.database();
        const vehicleRef = db.ref('veiculos');
        
        const UI = {
            loading: document.getElementById('loadingOverlay'),
            toastContainer: document.getElementById('toastContainer'),
            form: document.getElementById('entry-form'),
            placaInput: document.getElementById('placa'),
            obsInput: document.getElementById('obs'),
            vehicleList: document.getElementById('vehicle-list'),
            emptyState: document.getElementById('emptyState'),
            themeToggle: document.getElementById('theme-toggle'),
            userName: document.getElementById('nomePorteiroLogado'),
            logoutBtn: document.getElementById('btnLogout'),
            filterPresentBtn: document.getElementById('filter-present'),
            filterAllBtn: document.getElementById('filter-all'),
            exportCsvBtn: document.getElementById('export-csv'),
            exportPdfBtn: document.getElementById('export-pdf'),
        };

        let allEntries = [];
        let currentUser = null;
        let currentView = 'present'; // 'present' ou 'all'

        // --- 3. FUNÇÕES DE UI E UTILITÁRIOS ---
        const showLoading = (show) => { UI.loading.style.display = show ? 'flex' : 'none'; };
        const showToast = (message, type = 'success') => {
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerHTML = `<span class="material-icons-outlined">${type === 'success' ? 'check_circle' : 'error'}</span> ${message}`;
            UI.toastContainer.appendChild(toast);
            setTimeout(() => toast.remove(), 5000);
        };
        const formatDate = (ts) => ts ? new Date(ts).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short'}) : '—';
        const formatPlacaMask = (value) => {
            value = value.toUpperCase().replace(/[^A-Z0-9]/g, '');
            if (value.length > 3) return value.slice(0, 3) + '-' + value.slice(3, 7);
            return value;
        };

        // --- 4. LÓGICA DA APLICAÇÃO ---
        const renderList = () => {
            const entriesToDisplay = currentView === 'present' 
                ? allEntries.filter(e => e.status === 'presente') 
                : allEntries;

            UI.vehicleList.innerHTML = '';
            UI.emptyState.style.display = entriesToDisplay.length === 0 ? 'block' : 'none';

            entriesToDisplay.forEach(entry => {
                const isExited = entry.status === 'saida';
                const li = document.createElement('li');
                li.className = isExited ? 'exited-log' : '';
                
                li.innerHTML = `
                    <div class="vehicle-info">
                        <div class="placa">${entry.placa}</div>
                        <div class="details">
                            <span>Entrada: <b>${formatDate(entry.entryTimestamp)}</b></span>
                            ${entry.observacoes ? `&bull; ${entry.observacoes}` : ''}
                            ${isExited ? `&bull; Saída: <b>${formatDate(entry.exitTimestamp)}</b>` : ''}
                        </div>
                    </div>
                    <div class="log-actions">
                        <button class="btn btn-secondary btn-sm btn-exit" data-id="${entry.id}">
                            <span class="material-icons-outlined">logout</span> Sair
                        </button>
                    </div>
                `;
                
                li.querySelector('.btn-exit').addEventListener('click', () => {
                    if (confirm(`Confirmar saída do veículo ${entry.placa}?`)) {
                        registerExit(entry.id);
                    }
                });
                UI.vehicleList.appendChild(li);
            });
        };

        const registerExit = (id) => {
            vehicleRef.child(id).update({
                status: 'saida',
                exitTimestamp: firebase.database.ServerValue.TIMESTAMP,
                porteiroSaida: { uid: currentUser.uid, nome: currentUser.nome }
            }).catch(err => showToast('Erro ao registrar saída.', 'error'));
        };
        
        // --- 5. EXPORTAÇÃO ---
        const exportToCSV = () => {
            const headers = ["Placa", "Observações", "Data Entrada", "Porteiro Entrada", "Data Saída", "Porteiro Saída", "Status"];
            const csvRows = [headers.join(',')];
            
            for (const entry of allEntries) {
                const values = [
                    entry.placa,
                    `"${entry.observacoes || ''}"`,
                    `"${formatDate(entry.entryTimestamp)}"`,
                    `"${entry.porteiroEntrada?.nome || ''}"`,
                    `"${formatDate(entry.exitTimestamp)}"`,
                    `"${entry.porteiroSaida?.nome || ''}"`,
                    entry.status
                ];
                csvRows.push(values.join(','));
            }

            const blob = new Blob([csvRows.join('\n')], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('hidden', '');
            a.setAttribute('href', url);
            a.setAttribute('download', `relatorio_portaria_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        };

        const exportToPDF = () => {
            const doc = new window.jspdf.jsPDF();
            const tableColumn = ["Placa", "Observações", "Entrada", "Saída", "Status"];
            const tableRows = [];

            allEntries.forEach(entry => {
                const ticketData = [
                    entry.placa,
                    entry.observacoes || '-',
                    formatDate(entry.entryTimestamp),
                    formatDate(entry.exitTimestamp),
                    entry.status
                ];
                tableRows.push(ticketData);
            });

            doc.autoTable({
                head: [tableColumn],
                body: tableRows,
                startY: 20,
                theme: 'striped',
                headStyles: { fillColor: [37, 99, 235] } // Cor azul do tema
            });
            doc.text("Relatório de Veículos - Portaria Ágil", 14, 15);
            doc.save(`relatorio_portaria_${new Date().toISOString().slice(0,10)}.pdf`);
            showToast('PDF gerado com sucesso!');
        };
        
        // --- 6. FIREBASE E DADOS ---
        auth.onAuthStateChanged(user => {
            showLoading(true);
            if (user) {
                currentUser = { uid: user.uid, nome: user.displayName || 'Porteiro' };
                UI.userName.textContent = currentUser.nome;
                
                vehicleRef.orderByChild('entryTimestamp').on('value', snapshot => {
                    allEntries = [];
                    if (snapshot.exists()) {
                        snapshot.forEach(child => {
                            allEntries.push({ id: child.key, ...child.val() });
                        });
                    }
                    allEntries.reverse(); // Mais novos primeiro
                    renderList();
                    showLoading(false);
                });
            } else {
                window.location.href = 'login.html';
            }
        });

        // --- 7. EVENT LISTENERS ---
        UI.form.addEventListener('submit', (e) => {
            e.preventDefault();
            const placa = UI.placaInput.value.trim();
            if (!placa) return;

            vehicleRef.push({
                placa,
                observacoes: UI.obsInput.value.trim(),
                entryTimestamp: firebase.database.ServerValue.TIMESTAMP,
                status: 'presente',
                porteiroEntrada: { uid: currentUser.uid, nome: currentUser.nome }
            }).then(() => {
                showToast(`Entrada de ${placa} registrada!`);
                UI.form.reset();
                UI.placaInput.focus();
            }).catch(err => showToast('Erro ao registrar entrada.', 'error'));
        });

        UI.placaInput.addEventListener('input', (e) => { e.target.value = formatPlacaMask(e.target.value); });
        UI.logoutBtn.addEventListener('click', () => auth.signOut());
        UI.exportCsvBtn.addEventListener('click', exportToCSV);
        UI.exportPdfBtn.addEventListener('click', exportToPDF);

        UI.filterPresentBtn.addEventListener('click', () => {
            currentView = 'present';
            UI.filterPresentBtn.classList.add('active');
            UI.filterAllBtn.classList.remove('active');
            renderList();
        });
        UI.filterAllBtn.addEventListener('click', () => {
            currentView = 'all';
            UI.filterAllBtn.classList.add('active');
            UI.filterPresentBtn.classList.remove('active');
            renderList();
        });
        
        // Tema Escuro / Claro
        const applyTheme = (theme) => {
            document.documentElement.setAttribute('data-theme', theme);
            UI.themeToggle.querySelector('.material-icons-outlined').textContent = theme === 'dark' ? 'light_mode' : 'dark_mode';
            localStorage.setItem('portaria-agil-theme', theme);
        };
        UI.themeToggle.addEventListener('click', () => {
            const newTheme = (document.documentElement.getAttribute('data-theme') || 'light') === 'light' ? 'dark' : 'light';
            applyTheme(newTheme);
        });
        applyTheme(localStorage.getItem('portaria-agil-theme') || 'light');
    });
    </script>
</body>
</html>
