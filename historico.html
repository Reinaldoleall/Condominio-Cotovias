<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
<meta name="viewport" content="width=1024">

    <title>Histórico - Sistema de Encomendas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <meta name="theme-color" content="#111827">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>
<style>
/* ==========================================================================
   DESIGN DE PAPÉIS ANOTADOS - SEM DARK MODE
   ========================================================================== */

/* --------------------------------------------------------------------------
   0. VARIÁVEIS E CONFIGURAÇÕES GLOBAIS
   -------------------------------------------------------------------------- */
:root {
    /* Cores do tema claro - Papel */
    --color-primary: #3b82f6;
    --color-primary-dark: #2563eb;
    --color-danger: #ef4444;
    --color-danger-dark: #dc2626;
    --color-success: #22c55e;
    --color-success-dark: #16a34a;
    --color-warning: #f59e0b;
    
    /* Cores de UI (Interface) - Tema Claro */
    --color-bg: #f5f5f5; /* Fundo cinza claro */
    --color-surface: #ffffff; /* Superfície dos cards (Branco) */
    --color-surface-light: #f8f9fa;
    --color-border: #e5e7eb; /* Bordas e divisores */
    --color-text-primary: #1f2937; /* Texto principal (Cinza escuro) */
    --color-text-secondary: #6b7280; /* Texto secundário (Cinza médio) */
    --color-text-placeholder: #9ca3af;
    
    /* Efeitos de papel */
    --paper-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    --paper-shadow-hover: 0 4px 12px rgba(0, 0, 0, 0.15);
    
    /* Tipografia */
    --font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    
    /* Layout e Efeitos */
    --border-radius: 8px;
    --shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
    --transition-normal: 300ms cubic-bezier(0.4, 0, 0.2, 1);
}

/* --------------------------------------------------------------------------
   1. ESTILOS DE BASE
   -------------------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }
body {
    font-family: var(--font-family);
    background-color: var(--color-bg);
    color: var(--color-text-primary);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    height: 100vh;
    overflow: hidden;
}
/* ... seus estilos atuais ... */

.share-option[data-share="pdf"] {
    display: none;
}
#btnExportarHistorico {
    display: none !important;
}
#btnLimparHistorico {
    display: none;
}

/* ... resto do seu CSS ... */
/* --------------------------------------------------------------------------
   2. LAYOUT E COMPONENTES PRINCIPAIS
   -------------------------------------------------------------------------- */
.container {
    width: 100%;
    height: 100vh;
    margin: 0 auto;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
}

.page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
}

.page-title {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--color-text-primary);
}

.actions-group {
    display: flex;
    gap: 0.5rem;
}

.card {
    background-color: var(--color-surface);
    border-radius: var(--border-radius);
    border: 1px solid var(--color-border);
    overflow: hidden;
    box-shadow: var(--shadow);
}

.card-content {
    padding: 1rem;
}

.filter-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 0.75rem;
    align-items: flex-end;
}

/* --------------------------------------------------------------------------
   3. LAYOUT DAS ENCOMENDAS COMO PAPÉIS
   -------------------------------------------------------------------------- */
.encomendas-container {
    flex: 1;
    overflow-y: auto;
    padding: 0.5rem;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1rem;
    align-content: flex-start;
}

.encomenda-card {
    background-color: var(--color-surface);
    border-radius: var(--border-radius);
    padding: 1.25rem;
    box-shadow: var(--paper-shadow);
    position: relative;
    transition: transform var(--transition-fast), box-shadow var(--transition-fast);
    border: 1px solid var(--color-border);
    min-height: 200px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background: linear-gradient(to bottom, #ffffff, #fefefe);
}

.encomenda-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--paper-shadow-hover);
}

.encomenda-card.pendente {
    border-left: 4px solid var(--color-danger);
    background: linear-gradient(to bottom, #ffffff, #fff5f5);
}

.encomenda-card.retirado {
    border-left: 4px solid var(--color-success);
    background: linear-gradient(to bottom, #ffffff, #f0fdf4);
}

.encomenda-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 0.75rem;
}

.encomenda-data {
    font-size: 0.75rem;
    color: var(--color-text-secondary);
    font-weight: 500;
}

.encomenda-bloco {
    font-weight: 700;
    font-size: 1.125rem;
    color: var(--color-text-primary);
    margin-top: 0.25rem;
}

.encomenda-detalhes {
    margin-bottom: 1rem;
    flex: 1;
}

.encomenda-descricao {
    font-size: 0.875rem;
    color: var(--color-text-primary);
    margin-bottom: 0.5rem;
    line-height: 1.4;
}

.encomenda-quantidade {
    font-size: 0.875rem;
    color: var(--color-text-secondary);
    font-weight: 500;
}

.encomenda-info {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
    margin-bottom: 1rem;
}

.encomenda-info-item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.75rem;
    color: var(--color-text-secondary);
}

.encomenda-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* --------------------------------------------------------------------------
   4. COMPONENTES DE UI
   -------------------------------------------------------------------------- */

/* ----- Botões ----- */
.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    height: 36px;
    padding: 0 1rem;
    border: 1px solid transparent;
    border-radius: var(--border-radius);
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    transition: all var(--transition-fast);
}
.btn .material-icons-outlined { font-size: 1rem; }
.btn:disabled { cursor: not-allowed; opacity: 0.5; }

.btn-primary {
    background-color: var(--color-primary);
    color: white;
}
.btn-primary:hover:not(:disabled) { 
    background-color: var(--color-primary-dark); 
    transform: translateY(-1px); 
    box-shadow: var(--shadow-md); 
}

.btn-danger {
    background-color: var(--color-danger);
    color: white;
}
.btn-danger:hover:not(:disabled) { 
    background-color: var(--color-danger-dark); 
    transform: translateY(-1px); 
    box-shadow: var(--shadow-md); 
}

.btn-secondary {
    background-color: var(--color-surface-light);
    color: var(--color-text-primary);
    border-color: var(--color-border);
}
.btn-secondary:hover:not(:disabled) {
    background-color: var(--color-primary);
    border-color: var(--color-primary);
    color: white;
}

.btn-text {
    background: none;
    color: var(--color-text-secondary);
    height: auto;
    padding: 0.25rem;
}
.btn-text:hover:not(:disabled) { 
    color: var(--color-primary); 
    background-color: rgba(59, 130, 246, 0.1); 
}

/* ----- Campos de Input ----- */
.input-group {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
}
.input-group label {
    font-size: 0.75rem;
    font-weight: 500;
    color: var(--color-text-secondary);
}
.input-group input {
    width: 100%;
    height: 36px;
    padding: 0 0.75rem;
    border: 1px solid var(--color-border);
    border-radius: var(--border-radius);
    background-color: white;
    color: var(--color-text-primary);
    font-family: var(--font-family);
    font-size: 0.85rem;
    transition: all var(--transition-fast);
}
.input-group input:focus {
    outline: none;
    border-color: var(--color-primary);
    box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
}
.input-group input::placeholder { color: var(--color-text-placeholder); }

/* ----- Badge de Status ----- */
.badge {
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
    padding: 0.25rem 0.5rem;
    border-radius: 999px;
    font-weight: 600;
    font-size: 0.7rem;
    text-transform: capitalize;
    color: white;
}
.status-pendente { background-color: var(--color-danger); }
.status-retirado { background-color: var(--color-success); }

/* ----- Modal ----- */
.modal-overlay {
    position: fixed;
    inset: 0;
    background-color: rgb(0 0 0 / 0.5);
    backdrop-filter: blur(2px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--transition-normal);
}
.modal-overlay.active { opacity: 1; pointer-events: auto; }
.modal {
    background-color: var(--color-surface);
    border-radius: var(--border-radius);
    padding: 1.5rem;
    width: 100%;
    max-width: 500px;
    box-shadow: var(--shadow-lg);
    transform: scale(0.95) translateY(10px);
    transition: transform var(--transition-normal);
}
.modal-overlay.active .modal { transform: scale(1) translateY(0); }
.modal-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem; }
.modal-content { color: var(--color-text-secondary); margin-bottom: 1.5rem; line-height: 1.6; }
.modal-footer { display: flex; justify-content: flex-end; gap: 0.5rem; }
.share-options { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 0.5rem; }
.share-option {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem;
    border-radius: var(--border-radius);
    background-color: var(--color-surface-light);
    border: 1px solid var(--color-border);
    transition: all var(--transition-fast);
    color: var(--color-text-primary);
    font-size: 0.75rem;
    cursor: pointer;
}
.share-option:hover { 
    background-color: var(--color-primary); 
    color: white; 
    border-color: var(--color-primary); 
}

/* ----- Toast/Snackbar ----- */
.toast {
    position: fixed;
    bottom: 1rem;
    right: 1rem;
    transform: translateX(calc(100% + 1rem));
    background-color: var(--color-text-primary);
    color: white;
    padding: 0.5rem 1rem;
    border-radius: var(--border-radius);
    box-shadow: var(--shadow-lg);
    z-index: 2000;
    transition: transform var(--transition-normal);
    pointer-events: none;
    font-weight: 600;
    font-size: 0.75rem;
}
.toast.show { transform: translateX(0); }
.toast.success { background-color: var(--color-success); }
.toast.error { background-color: var(--color-danger); }

/* ----- Estados Vazios/Carregando ----- */
.empty-state {
    grid-column: 1 / -1;
    padding: 3rem 1rem;
    text-align: center;
    color: var(--color-text-secondary);
}
.empty-state .material-icons-outlined { 
    font-size: 3rem; 
    margin-bottom: 1rem; 
    color: var(--color-border); 
}
.loading {
    width: 20px;
    height: 20px;
    border: 2px solid currentColor;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* --------------------------------------------------------------------------
   5. SKELETON LOADER
   -------------------------------------------------------------------------- */
.skeleton {
    opacity: 0.7;
    animation: shimmer 1.5s linear infinite forwards;
    background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
    background-size: 200% 100%;
    border-radius: 4px;
}

@keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
}

.skeleton-card {
    background-color: var(--color-surface);
    border-radius: var(--border-radius);
    padding: 1.25rem;
    box-shadow: var(--paper-shadow);
    border: 1px solid var(--color-border);
    min-height: 200px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.skeleton-text { height: 12px; margin-bottom: 8px; }
.skeleton-text.short { width: 40%; }
.skeleton-text.long { width: 90%; }
.skeleton-title { height: 20px; width: 60%; margin-bottom: 12px; }
.skeleton-badge { height: 22px; width: 70px; border-radius: 999px; }
.skeleton-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem; }
.skeleton-icon { width: 24px; height: 24px; border-radius: 50%; }

/* --------------------------------------------------------------------------
   6. RESPONSIVIDADE
   -------------------------------------------------------------------------- */
@media (max-width: 768px) {
    .container { padding: 0.75rem; gap: 0.75rem; }
    .page-title { font-size: 1.25rem; }
    .card-content { padding: 0.75rem; }
    .filter-grid { grid-template-columns: 1fr; }
    .encomendas-container { grid-template-columns: 1fr; }
    
    .page-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
    }
    
    .actions-group {
        width: 100%;
        justify-content: space-between;
    }
}
.share-option[data-share="pdf"] {
    display: none;
}
#btnExportarHistorico {
    display: none;
}
#btnLimparHistorico {
    display: none;
}
</style>
<body>
    <main class="container">
        
        <header class="page-header">
            <h1 class="page-title">Histórico de Encomendas</h1>
            <div class="actions-group">
                <button id="btnExportarHistorico" class="btn btn-secondary" style="display: none;">
                    <span class="material-icons-outlined">download</span>
                    <span>Exportar</span>
                </button>
                <button id="btnLimparHistorico" class="btn btn-danger">
                    <span class="material-icons-outlined">delete_sweep</span>
                    <span>Limpar Entregues</span>
                </button>
            </div>
        </header>

        <div class="card">
            <div class="card-content">
                <form id="filterForm" class="filter-grid">
                    <div class="input-group">
                        <label for="filtroBloco">Filtrar por Bloco</label>
                        <input type="text" id="filtroBloco" placeholder="Ex: A">
                    </div>
                    <div class="input-group">
                        <label for="filtroApto">Filtrar por Apartamento</label>
                        <input type="text" id="filtroApto" placeholder="Ex: 101">
                    </div>
                    <div class="actions-group">
                        <button id="btnFiltrar" type="submit" class="btn btn-primary">
                            <span class="material-icons-outlined">search</span>
                            <span>Filtrar</span>
                        </button>
                        <button id="btnLimparFiltro" type="reset" class="btn btn-secondary">
                            <span class="material-icons-outlined">clear</span>
                            <span>Limpar</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="encomendas-container" id="encomendasContainer">
            </div>

    </main>

    <div id="modalLimparHistorico" class="modal-overlay">
        <div class="modal">
            <h2 class="modal-title">Confirmar Limpeza</h2>
            <p class="modal-content">
                Tem certeza de que deseja remover <strong>todas as encomendas já entregues</strong>? Esta ação não pode ser desfeita.
            </p>
            <div class="modal-footer">
                <button class="btn btn-secondary modal-close">Cancelar</button>
                <button id="btnConfirmarLimparHistorico" class="btn btn-danger">Sim, Limpar</button>
            </div>
        </div>
    </div>

    <div id="modalCompartilhar" class="modal-overlay">
        <div class="modal">
            <h2 class="modal-title">Compartilhar Encomenda</h2>
            <div class="modal-content">
                <div id="detalhesCompartilhar" style="margin-bottom: 1rem; padding: 1rem; background-color: var(--color-surface-light); border-radius: var(--border-radius);"></div>
                <div class="share-options">
                    <button class="share-option" data-share="whatsapp">
                        <span class="material-icons-outlined">email</span> WhatsApp
                    </button>
                    <button class="share-option" data-share="email">
                        <span class="material-icons-outlined">email</span> E-mail
                    </button>
                    <button class="share-option" data-share="copy">
                        <span class="material-icons-outlined">content_copy</span> Copiar
                    </button>
                    <button class="share-option" data-share="pdf">
                        <span class="material-icons-outlined">picture_as_pdf</span> PDF
                    </button>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary modal-close">Fechar</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
    const App = {
        state: {
            firebaseConfig: {
                // NOTA DE SEGURANÇA: As chaves de configuração do Firebase são visíveis no lado do cliente.
                // Isso é esperado para apps web. Garanta que as Regras de Segurança (Security Rules)
                // no console do Firebase estejam configuradas corretamente para proteger seus dados.
                apiKey: "AIzaSyByyM8RvGNM5pyrQIQ7nCH6mmgYAIpq0bc",
                authDomain: "rifas-c414b.firebaseapp.com",
                databaseURL: "https://rifas-c414b-default-rtdb.firebaseio.com",
                projectId: "rifas-c414b",
                storageBucket: "rifas-c414b.appspot.com",
                messagingSenderId: "770195193538",
                appId: "1:770195193538:web:48e585ac5661d27f3dc55b"
            },
            database: null,
            historicoCompleto: [],
            encomendaAtual: null,
        },
        methods: {
            async carregarHistorico() {
                App.helpers.renderSkeletonState(true);
                try {
                    const snapshot = await App.state.database.ref('encomendas').once('value');
                    
                    if (!snapshot.exists()) {
                        App.helpers.renderEmptyState('Nenhum registro no histórico');
                        return;
                    }
                    
                    const encomendas = [];
                    snapshot.forEach(child => {
                        encomendas.push({ id: child.key, ...child.val() });
                    });
                    
                    App.state.historicoCompleto = encomendas.sort((a, b) => (b.data || 0) - (a.data || 0));
                    App.methods.atualizarEncomendas(App.state.historicoCompleto);
                    
                } catch (error) {
                    console.error('Erro ao carregar histórico:', error);
                    App.helpers.showToast('Erro ao carregar histórico', 'error');
                    App.helpers.renderEmptyState('Falha ao carregar dados');
                } finally {
                    document.getElementById('btnExportarHistorico').style.display = 
                        App.state.historicoCompleto.length > 0 ? 'inline-flex' : 'none';
                }
            },
            atualizarEncomendas(dados) {
                const container = document.getElementById('encomendasContainer');
                container.innerHTML = ''; // Limpa os skeletons ou o conteúdo anterior

                if (dados.length === 0) {
                    const message = App.state.historicoCompleto.length > 0 
                        ? 'Nenhum registro encontrado para os filtros aplicados' 
                        : 'Nenhuma encomenda registrada';
                    App.helpers.renderEmptyState(message);
                    return;
                }

                dados.forEach(item => {
                    const card = document.createElement('div');
                    card.className = `encomenda-card ${item.status}`;
                    
                    const statusClass = item.status === 'pendente' ? 'status-pendente' : 'status-retirado';
                    const statusText = item.status === 'pendente' ? 'Pendente' : 'Retirado';
                    
                    card.innerHTML = `
                        <div class="encomenda-header">
                            <div>
                                <div class="encomenda-data">${App.helpers.formatarData(item.data)}</div>
                                <div class="encomenda-bloco">${item.blocoApto || 'N/A'}</div>
                            </div>
                            <button class="btn btn-text" onclick="App.handlers.abrirModalCompartilhar('${item.id}')" aria-label="Compartilhar encomenda">
                                <span class="material-icons-outlined">share</span>
                            </button>
                        </div>
                        
                        <div class="encomenda-detalhes">
                            <div class="encomenda-descricao">${item.descricao || 'Sem detalhes'}</div>
                            <div class="encomenda-quantidade">${item.quantidade || 0} item(s)</div>
                        </div>
                        
                        <div class="encomenda-info">
                            <div class="encomenda-info-item">
                                <span class="material-icons-outlined" style="font-size: 16px;">person</span>
                                <span>Porteiro: ${item.registradoPorNome || 'N/A'}</span>
                            </div>
                            ${item.retiradoPorNome ? `
                            <div class="encomenda-info-item">
                                <span class="material-icons-outlined" style="font-size: 16px;">how_to_reg</span>
                                <span>Retirado por: ${item.retiradoPorNome}</span>
                            </div>
                            ` : ''}
                        </div>
                        
                        <div class="encomenda-footer">
                            <span class="badge ${statusClass}">${statusText}</span>
                        </div>
                    `;
                    
                    container.appendChild(card);
                });
            },
            aplicarFiltros(event) {
                if (event && event.type === 'submit') {
                    event.preventDefault();
                }
                
                const filtroBloco = document.getElementById('filtroBloco').value.trim().toLowerCase();
                const filtroApto = document.getElementById('filtroApto').value.trim().toLowerCase();
                
                const dadosFiltrados = App.state.historicoCompleto.filter(item => {
                    const blocoApto = (item.blocoApto || '').toLowerCase();
                    const matchBloco = !filtroBloco || blocoApto.includes(filtroBloco);
                    const matchApto = !filtroApto || blocoApto.includes(filtroApto);
                    return matchBloco && matchApto;
                });
                
                App.methods.atualizarEncomendas(dadosFiltrados);
            },
            limparFiltros(event) {
                event.preventDefault();
                document.getElementById('filterForm').reset();
                App.methods.atualizarEncomendas(App.state.historicoCompleto);
            },
            async limparHistoricoEntregues() {
                const btn = document.getElementById('btnConfirmarLimparHistorico');
                App.helpers.toggleButtonLoading(btn, true);
                
                try {
                    const snapshot = await App.state.database.ref('encomendas')
                        .orderByChild('status').equalTo('retirado').once('value');
                    
                    if (!snapshot.exists()) {
                        App.helpers.showToast('Nenhuma encomenda entregue para limpar.', 'info');
                        return;
                    }
                    
                    const updates = {};
                    snapshot.forEach(child => { 
                        updates[child.key] = null; 
                    });
                    
                    await App.state.database.ref('encomendas').update(updates);
                    App.helpers.showToast('Histórico de entregues limpo!', 'success');
                    await App.methods.carregarHistorico();
                    App.helpers.toggleModal('modalLimparHistorico', false);
                    
                } catch (error) {
                    console.error('Erro ao limpar histórico:', error);
                    App.helpers.showToast('Erro ao limpar histórico.', 'error');
                } finally {
                    App.helpers.toggleButtonLoading(btn, false);
                }
            }
        },
        helpers: {
            formatarData(timestamp) {
                return timestamp ? 
                    new Date(timestamp).toLocaleString('pt-BR', { 
                        day: '2-digit', month: '2-digit', year: 'numeric',
                        hour: '2-digit', minute: '2-digit'
                    }) : 'N/A';
            },
            toggleModal(modalId, show) {
                document.getElementById(modalId)?.classList.toggle('active', show);
            },
            showToast(message, type = 'info') {
                const toast = document.getElementById('toast');
                toast.textContent = message;
                toast.className = `toast show ${type}`;
                setTimeout(() => toast.classList.remove('show'), 3000);
            },
            toggleButtonLoading(button, isLoading) {
                button.disabled = isLoading;
                if (isLoading) {
                    button.dataset.originalText = button.innerHTML;
                    button.innerHTML = `<span class="loading"></span>`;
                } else if (button.dataset.originalText) {
                    button.innerHTML = button.dataset.originalText;
                }
            },
            renderSkeletonState(show) {
                const container = document.getElementById('encomendasContainer');
                if (!show) return;

                container.innerHTML = '';
                const skeletonHTML = `
                    <div class="skeleton-card">
                        <div class="skeleton-header">
                            <div>
                                <div class="skeleton skeleton-text short"></div>
                                <div class="skeleton skeleton-title"></div>
                            </div>
                            <div class="skeleton skeleton-icon"></div>
                        </div>
                        <div>
                            <div class="skeleton skeleton-text long"></div>
                            <div class="skeleton skeleton-text"></div>
                        </div>
                        <div style="margin-top: 1.25rem;">
                            <div class="skeleton skeleton-text"></div>
                            <div class="skeleton skeleton-text short"></div>
                        </div>
                        <div class="skeleton-footer" style="margin-top: 1rem;">
                            <div class="skeleton skeleton-badge"></div>
                        </div>
                    </div>
                `;
                for (let i = 0; i < 6; i++) {
                    container.innerHTML += skeletonHTML;
                }
            },
            renderEmptyState(message) {
                const container = document.getElementById('encomendasContainer');
                container.innerHTML = `
                    <div class="empty-state">
                        <span class="material-icons-outlined">inbox</span>
                        <p>${message}</p>
                    </div>
                `;
            },
            gerarTextoCompartilhamento(encomenda) {
                return `📦 Detalhes da Encomenda 📦\n\n` +
                       `Para: ${encomenda.blocoApto}\n` +
                       `Data de Registro: ${App.helpers.formatarData(encomenda.data)}\n` +
                       `Quantidade: ${encomenda.quantidade} item(s)\n` +
                       `Descrição: ${encomenda.descricao || 'N/A'}\n` +
                       `Status: ${encomenda.status === 'pendente' ? 'Pendente para retirada' : 'Já retirado'}`;
            },
            gerarPDF(encomendas, title, filename) {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                doc.setFontSize(18);
                doc.text(title, 14, 22);
                const head = [['Data', 'Bloco/Apto', 'Qtd', 'Porteiro', 'Retirado por', 'Status']];
                const body = encomendas.map(item => [ 
                    App.helpers.formatarData(item.data), 
                    item.blocoApto, 
                    item.quantidade, 
                    item.registradoPorNome || 'N/A', 
                    item.retiradoPorNome || 'N/A', 
                    item.status === 'pendente' ? 'Pendente' : 'Retirado' 
                ]);
                doc.autoTable({ 
                    startY: 30, head, body, theme: 'grid', 
                    headStyles: { fillColor: [59, 130, 246] } 
                });
                doc.save(filename);
            }
        },
        handlers: {
            abrirModalCompartilhar(id) {
                App.state.encomendaAtual = App.state.historicoCompleto.find(item => item.id === id);
                if (!App.state.encomendaAtual) return;
                
                document.getElementById('detalhesCompartilhar').innerHTML = `
                    <p><strong>Para:</strong> ${App.state.encomendaAtual.blocoApto}</p>
                    <p><strong>Data:</strong> ${App.helpers.formatarData(App.state.encomendaAtual.data)}</p>
                    <p><strong>Descrição:</strong> ${App.state.encomendaAtual.descricao || 'N/A'}</p>
                `;
                
                App.helpers.toggleModal('modalCompartilhar', true);
            },
            compartilhar(event) {
                const action = event.currentTarget.dataset.share;
                const encomenda = App.state.encomendaAtual;
                if (!encomenda) return;
                
                const texto = App.helpers.gerarTextoCompartilhamento(encomenda);
                
                switch(action) {
                    case 'whatsapp': 
                        window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`, '_blank'); 
                        break;
                    case 'email': 
                        window.location.href = `mailto:?subject=Detalhes da Encomenda - ${encomenda.blocoApto}&body=${encodeURIComponent(texto)}`; 
                        break;
                    case 'copy': 
                        navigator.clipboard.writeText(texto)
                            .then(() => App.helpers.showToast('Texto copiado!', 'success'))
                            .catch(() => App.helpers.showToast('Falha ao copiar.', 'error')); 
                        break;
                    case 'pdf': 
                        App.helpers.gerarPDF([encomenda], `Detalhes da Encomenda`, `encomenda_${encomenda.blocoApto}.pdf`); 
                        break;
                }
            },
            exportarTabelaCompleta() {
                const btn = document.getElementById('btnExportarHistorico');
                App.helpers.toggleButtonLoading(btn, true);
                
                try {
                    const filtroBloco = document.getElementById('filtroBloco').value.trim().toLowerCase();
                    const filtroApto = document.getElementById('filtroApto').value.trim().toLowerCase();
                    
                    const dadosFiltrados = App.state.historicoCompleto.filter(item => {
                         const blocoApto = (item.blocoApto || '').toLowerCase();
                         return (!filtroBloco || blocoApto.includes(filtroBloco)) && 
                                (!filtroApto || blocoApto.includes(filtroApto));
                    });
                    
                    if (dadosFiltrados.length === 0) {
                        App.helpers.showToast('Nenhum dado para exportar com os filtros atuais.', 'warning');
                        return;
                    }
                    
                    App.helpers.gerarPDF(dadosFiltrados, 'Histórico de Encomendas', 'historico_encomendas.pdf');
                    
                } catch(e) {
                    console.error('Erro ao exportar:', e);
                    App.helpers.showToast('Erro ao gerar o PDF.', 'error');
                } finally {
                    App.helpers.toggleButtonLoading(btn, false);
                }
            }
        },
        init() {
            if (!firebase.apps.length) {
                firebase.initializeApp(App.state.firebaseConfig);
            }
            App.state.database = firebase.database();

            const setupEventListeners = () => {
                App.methods.carregarHistorico();
                
                document.getElementById('btnLimparHistorico').addEventListener('click', 
                    () => App.helpers.toggleModal('modalLimparHistorico', true));
                document.getElementById('btnConfirmarLimparHistorico').addEventListener('click', 
                    App.methods.limparHistoricoEntregues);
                document.getElementById('btnExportarHistorico').addEventListener('click', 
                    App.handlers.exportarTabelaCompleta);
                
                // Filtros
                document.getElementById('filterForm').addEventListener('submit', App.methods.aplicarFiltros);
                document.getElementById('filterForm').addEventListener('reset', App.methods.limparFiltros);
                document.getElementById('filtroBloco').addEventListener('input', App.methods.aplicarFiltros);
                document.getElementById('filtroApto').addEventListener('input', App.methods.aplicarFiltros);
                
                // Modais
                document.querySelectorAll('.modal-overlay').forEach(modal => {
                    modal.addEventListener('click', (e) => { 
                        if (e.target === modal) App.helpers.toggleModal(modal.id, false); 
                    });
                });
                document.querySelectorAll('.modal-close').forEach(btn => {
                    btn.addEventListener('click', () => 
                        App.helpers.toggleModal(btn.closest('.modal-overlay').id, false));
                });
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        document.querySelectorAll('.modal-overlay.active').forEach(modal => 
                            App.helpers.toggleModal(modal.id, false));
                    }
                });
                
                // Compartilhamento
                document.querySelectorAll('.share-option').forEach(btn => {
                    btn.addEventListener('click', App.handlers.compartilhar);
                });
            };
            
            document.addEventListener('DOMContentLoaded', setupEventListeners);
        }
    };

    App.init();
    </script>
</body>
</html>
