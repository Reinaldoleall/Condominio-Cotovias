<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#4A90E2">
    <title>Histórico - Sistema de Encomendas</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#EBF3FE',
                            100: '#D7E8FD',
                            200: '#B0D1FB',
                            300: '#88B9F8',
                            400: '#61A2F6',
                            500: '#4A90E2',
                            600: '#3A73B5',
                            700: '#2B5688',
                            800: '#1D3A5A',
                            900: '#0E1D2D',
                        }
                    },
                    fontFamily: {
                        'inter': ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'slide-up': 'slideUp 0.4s ease-out',
                        'slide-down': 'slideDown 0.3s ease-out',
                        'scale-in': 'scaleIn 0.2s ease-out',
                        'float': 'float 3s ease-in-out infinite',
                        'spin-slow': 'spin 1s linear infinite',
                        'shimmer': 'shimmer 1.5s linear infinite',
                    },
                    keyframes: {
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        slideDown: {
                            '0%': { opacity: '0', transform: 'translateY(-20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        scaleIn: {
                            '0%': { opacity: '0', transform: 'scale(0.95)' },
                            '100%': { opacity: '1', transform: 'scale(1)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-5px)' },
                        },
                        spin: {
                            'from': { transform: 'rotate(0deg)' },
                            'to': { transform: 'rotate(360deg)' },
                        },
                        shimmer: {
                            '0%': { backgroundPosition: '200% 0' },
                            '100%': { backgroundPosition: '-200% 0' },
                        },
                    },
                },
            },
        }
    </script>
    
    <style>
        /* Estilos customizados */
        * {
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: linear-gradient(135deg, #F7F8FC 0%, #EEF2F7 100%);
            font-family: 'Inter', sans-serif;
        }
        
        /* Glass effect */
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        /* Scrollbar customizada */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #E4E6EB;
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #4A90E2, #3A73B5);
            border-radius: 10px;
        }
        
        /* Card hover premium */
        .premium-card {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .premium-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.15);
        }
        
        /* Loading spinner */
        .loading-spinner-custom {
            width: 20px;
            height: 20px;
            border: 2px solid currentColor;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        /* Badge styles */
        .badge-custom {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        .badge-pending {
            background: linear-gradient(135deg, #EF4444, #DC2626);
            color: white;
        }
        
        .badge-completed {
            background: linear-gradient(135deg, #10B981, #059669);
            color: white;
        }
        
        /* Encomenda card styles */
        .encomenda-card {
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #FFFFFF, #FEFEFE);
        }
        
        .encomenda-card.pendente {
            border-left: 4px solid #EF4444;
            background: linear-gradient(135deg, #FFFFFF, #FFF5F5);
        }
        
        .encomenda-card.retirado {
            border-left: 4px solid #10B981;
            background: linear-gradient(135deg, #FFFFFF, #F0FDF4);
        }
        
        .encomenda-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px -6px rgba(0, 0, 0, 0.1);
        }
        
        /* Input focus effect */
        .input-focus:focus {
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.15);
            border-color: #4A90E2;
        }
        
        /* Ripple effect */
        .ripple {
            position: relative;
            overflow: hidden;
        }
        
        .ripple::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.4s, height 0.4s;
        }
        
        .ripple:active::after {
            width: 200px;
            height: 200px;
        }
        
        /* Gradient text */
        .gradient-text {
            background: linear-gradient(135deg, #4A90E2, #3A73B5);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        /* Empty state animation */
        .empty-state-icon {
            animation: float 3s ease-in-out infinite;
        }
        
        /* Modal animation */
        .modal-scale {
            animation: scaleIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        /* Toast animation */
        .toast-slide {
            animation: slideUp 0.3s ease-out;
        }
        
        /* Skeleton animation */
        .skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s linear infinite;
        }
        
        /* Share options hover */
        .share-option {
            transition: all 0.3s ease;
        }
        
        .share-option:hover {
            background: linear-gradient(135deg, #4A90E2, #3A73B5);
            color: white;
            transform: translateY(-2px);
        }
        
        /* Date picker custom */
        input[type="date"]::-webkit-calendar-picker-indicator {
            cursor: pointer;
            filter: invert(0.5);
        }
        
        input[type="date"]:focus::-webkit-calendar-picker-indicator {
            filter: invert(0.3);
        }
    </style>
</head>

<body class="antialiased">

    <main class="container max-w-7xl mx-auto px-4 sm:px-6 py-6 sm:py-8 h-screen flex flex-col">
        <!-- Header -->
        <header class="page-header flex flex-wrap justify-between items-center gap-4 mb-6">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-br from-primary-500 to-primary-600 rounded-xl flex items-center justify-center shadow-lg">
                    <i class="material-icons text-white text-2xl">history</i>
                </div>
                <div>
                    <h1 class="text-2xl sm:text-3xl font-bold gradient-text">Histórico de Encomendas</h1>
                    <p class="text-xs text-gray-500 hidden sm:block">Registro completo de todas as encomendas</p>
                </div>
            </div>
            <div class="actions-group flex gap-2">
                <button id="btnExportarPorDia" class="btn btn-primary px-4 py-2 bg-primary-500 text-white rounded-xl font-medium flex items-center gap-2 hover:bg-primary-600 transition-all ripple">
                    <i class="material-icons-outlined text-lg">calendar_today</i>
                    <span>Exportar por Dia</span>
                </button>
            </div>
        </header>

        <!-- Filtros -->
        <div class="card bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden mb-6">
            <div class="card-content p-5">
                <form id="filterForm" class="filter-grid grid grid-cols-1 sm:grid-cols-3 gap-3 items-end">
                    <div class="input-group">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Filtrar por Bloco</label>
                        <input type="text" id="filtroBloco" placeholder="Ex: A" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:border-primary-500 focus:outline-none input-focus transition-all">
                    </div>
                    <div class="input-group">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Filtrar por Apartamento</label>
                        <input type="text" id="filtroApto" placeholder="Ex: 101" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:border-primary-500 focus:outline-none input-focus transition-all">
                    </div>
                    <div class="actions-group flex gap-2">
                        <button id="btnFiltrar" type="submit" class="btn btn-primary flex-1 px-4 py-2.5 bg-primary-500 text-white rounded-xl font-medium flex items-center justify-center gap-2 hover:bg-primary-600 transition-all ripple">
                            <i class="material-icons-outlined text-lg">search</i>
                            <span>Filtrar</span>
                        </button>
                        <button id="btnLimparFiltro" type="reset" class="btn btn-secondary px-4 py-2.5 bg-gray-100 text-gray-600 rounded-xl font-medium flex items-center justify-center gap-2 hover:bg-gray-200 transition-all">
                            <i class="material-icons-outlined text-lg">clear</i>
                            <span>Limpar</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Lista de Encomendas -->
        <div class="encomendas-container flex-1 overflow-y-auto pb-4">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="encomendasContainer">
                <!-- Skeletons serão inseridos aqui -->
            </div>
        </div>
    </main>

    <!-- Modal Exportar por Dia -->
    <div id="modalExportarDia" class="modal-overlay fixed inset-0 bg-black/60 backdrop-blur-sm z-[1000] hidden items-center justify-center p-4">
        <div class="modal modal-scale bg-white rounded-2xl max-w-md w-full shadow-2xl">
            <div class="p-6">
                <h2 class="text-xl font-bold text-gray-800 mb-2 flex items-center gap-2">
                    <i class="material-icons-outlined text-primary-500">calendar_today</i>
                    Exportar Encomendas por Dia
                </h2>
                <p class="text-gray-500 text-sm mb-4">Selecione a data para gerar o relatório PDF</p>
                
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Data</label>
                    <input type="date" id="dataExportacao" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:border-primary-500 focus:outline-none input-focus transition-all">
                </div>
                
                <div class="flex justify-end gap-3">
                    <button class="modal-close px-5 py-2 border border-gray-300 rounded-xl text-gray-600 hover:bg-gray-50 transition-all">Cancelar</button>
                    <button id="btnConfirmarExportarDia" class="px-5 py-2 bg-primary-500 text-white rounded-xl font-medium hover:bg-primary-600 transition-all ripple">Gerar PDF</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Compartilhar -->
    <div id="modalCompartilhar" class="modal-overlay fixed inset-0 bg-black/60 backdrop-blur-sm z-[1000] hidden items-center justify-center p-4">
        <div class="modal modal-scale bg-white rounded-2xl max-w-md w-full shadow-2xl">
            <div class="p-6">
                <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                    <i class="material-icons-outlined text-primary-500">share</i>
                    Compartilhar Encomenda
                </h2>
                <div class="modal-content mb-4">
                    <div id="detalhesCompartilhar" class="bg-gray-50 p-4 rounded-xl mb-4 text-sm text-gray-600 space-y-2"></div>
                    <div class="share-options grid grid-cols-2 sm:grid-cols-3 gap-2">
                        <button class="share-option flex items-center justify-center gap-2 p-3 rounded-xl bg-gray-50 border border-gray-200 text-gray-700 hover:bg-primary-500 hover:text-white hover:border-primary-500 transition-all" data-share="whatsapp">
                            <i class="material-icons-outlined text-lg">chat</i> WhatsApp
                        </button>
                        <button class="share-option flex items-center justify-center gap-2 p-3 rounded-xl bg-gray-50 border border-gray-200 text-gray-700 hover:bg-primary-500 hover:text-white hover:border-primary-500 transition-all" data-share="email">
                            <i class="material-icons-outlined text-lg">email</i> E-mail
                        </button>
                        <button class="share-option flex items-center justify-center gap-2 p-3 rounded-xl bg-gray-50 border border-gray-200 text-gray-700 hover:bg-primary-500 hover:text-white hover:border-primary-500 transition-all" data-share="copy">
                            <i class="material-icons-outlined text-lg">content_copy</i> Copiar
                        </button>
                    </div>
                </div>
                <div class="flex justify-end">
                    <button class="modal-close px-5 py-2 border border-gray-300 rounded-xl text-gray-600 hover:bg-gray-50 transition-all">Fechar</button>
                </div>

        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast fixed bottom-6 left-1/2 transform -translate-x-1/2 z-[2000] hidden"></div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

    <script>
    // ============================================
    // JAVASCRIPT MODIFICADO - COM EXPORTAÇÃO POR DIA
    // ============================================
    
    const App = {
        state: {
            firebaseConfig: {
                apiKey: "AIzaSyByyM8RvGNM5pyrQIQ7nCH6mmgYAIpq0bc",
                authDomain: "rifas-c414b.firebaseapp.com",
                databaseURL: "https://rifas-c414b-default-rtdb.firebaseio.com",
                projectId: "rifas-c414b",
                storageBucket: "rifas-c414b.appspot.com",
                messagingSenderId: "770195193538",
                appId: "1:770195193538:web:48e585ac5661d27f3dc55b"
            },
            database: null,
            historicoCompleto: [],
            encomendaAtual: null,
        },
        methods: {
            async carregarHistorico() {
                App.helpers.renderSkeletonState(true);
                try {
                    const snapshot = await App.state.database.ref('encomendas').once('value');
                    
                    if (!snapshot.exists()) {
                        App.helpers.renderEmptyState('Nenhum registro no histórico');
                        return;
                    }
                    
                    const encomendas = [];
                    snapshot.forEach(child => {
                        encomendas.push({ id: child.key, ...child.val() });
                    });
                    
                    App.state.historicoCompleto = encomendas.sort((a, b) => (b.data || 0) - (a.data || 0));
                    App.methods.atualizarEncomendas(App.state.historicoCompleto);
                    
                } catch (error) {
                    console.error('Erro ao carregar histórico:', error);
                    App.helpers.showToast('Erro ao carregar histórico', 'error');
                    App.helpers.renderEmptyState('Falha ao carregar dados');
                }
            },
            atualizarEncomendas(dados) {
                const container = document.getElementById('encomendasContainer');
                container.innerHTML = '';

                if (dados.length === 0) {
                    const message = App.state.historicoCompleto.length > 0 
                        ? 'Nenhum registro encontrado para os filtros aplicados' 
                        : 'Nenhuma encomenda registrada';
                    App.helpers.renderEmptyState(message);
                    return;
                }

                dados.forEach(item => {
                    const card = document.createElement('div');
                    card.className = `encomenda-card ${item.status} bg-white rounded-xl p-5 shadow-sm border border-gray-100 premium-card`;
                    
                    const statusClass = item.status === 'pendente' ? 'badge-pending' : 'badge-completed';
                    const statusText = item.status === 'pendente' ? 'Pendente' : 'Retirado';
                    const statusIcon = item.status === 'pendente' ? 'pending' : 'check_circle';
                    
                    card.innerHTML = `
                        <div class="encomenda-header flex justify-between items-start mb-3">
                            <div>
                                <div class="encomenda-data text-xs text-gray-500 mb-1">${App.helpers.formatarData(item.data)}</div>
                                <div class="encomenda-bloco font-semibold text-gray-800">${item.blocoApto || 'N/A'}</div>
                            </div>
                            <button class="btn-share w-8 h-8 rounded-full flex items-center justify-center text-gray-400 hover:bg-gray-100 hover:text-primary-500 transition-all" onclick="App.handlers.abrirModalCompartilhar('${item.id}')" aria-label="Compartilhar encomenda">
                                <i class="material-icons-outlined text-lg">share</i>
                            </button>
                        </div>
                        
                        <div class="encomenda-detalhes mb-3">
                            <div class="encomenda-descricao text-sm text-gray-600 mb-1">${item.descricao || 'Sem detalhes'}</div>
                            <div class="encomenda-quantidade text-xs text-gray-500 font-medium">📦 ${item.quantidade || 0} item(s)</div>
                        </div>
                        
                        <div class="encomenda-info space-y-1 mb-3">
                            <div class="encomenda-info-item flex items-center gap-2 text-xs text-gray-500">
                                <i class="material-icons-outlined text-sm">person</i>
                                <span>Porteiro: ${item.registradoPorNome || 'N/A'}</span>
                            </div>
                            ${item.retiradoPorNome ? `
                            <div class="encomenda-info-item flex items-center gap-2 text-xs text-gray-500">
                                <i class="material-icons-outlined text-sm">how_to_reg</i>
                                <span>Retirado por: ${item.retiradoPorNome}</span>
                            </div>
                            ` : ''}
                        </div>
                        
                        <div class="encomenda-footer flex justify-between items-center">
                            <span class="badge-custom ${statusClass}">
                                <i class="material-icons-outlined text-sm">${statusIcon}</i>
                                ${statusText}
                            </span>
                        </div>
                    `;
                    
                    container.appendChild(card);
                });
            },
            aplicarFiltros(event) {
                if (event && event.type === 'submit') {
                    event.preventDefault();
                }
                
                const filtroBloco = document.getElementById('filtroBloco').value.trim().toLowerCase();
                const filtroApto = document.getElementById('filtroApto').value.trim().toLowerCase();
                
                const dadosFiltrados = App.state.historicoCompleto.filter(item => {
                    const blocoApto = (item.blocoApto || '').toLowerCase();
                    const matchBloco = !filtroBloco || blocoApto.includes(filtroBloco);
                    const matchApto = !filtroApto || blocoApto.includes(filtroApto);
                    return matchBloco && matchApto;
                });
                
                App.methods.atualizarEncomendas(dadosFiltrados);
            },
            limparFiltros(event) {
                event.preventDefault();
                document.getElementById('filterForm').reset();
                App.methods.atualizarEncomendas(App.state.historicoCompleto);
            },
            async exportarPorDia() {
                const dataSelecionada = document.getElementById('dataExportacao').value;
                
                if (!dataSelecionada) {
                    App.helpers.showToast('Por favor, selecione uma data.', 'error');
                    return;
                }
                
                // Formata a data para comparar com o timestamp
                const dataInicio = new Date(dataSelecionada);
                dataInicio.setHours(0, 0, 0, 0);
                
                const dataFim = new Date(dataSelecionada);
                dataFim.setHours(23, 59, 59, 999);
                
                // Filtra encomendas do dia selecionado
                const encomendasDoDia = App.state.historicoCompleto.filter(item => {
                    if (!item.data) return false;
                    const itemData = new Date(item.data);
                    return itemData >= dataInicio && itemData <= dataFim;
                });
                
                if (encomendasDoDia.length === 0) {
                    App.helpers.showToast(`Nenhuma encomenda encontrada para ${App.helpers.formatarDataSimples(dataSelecionada)}.`, 'error');
                    return;
                }
                
                // Separa por status
                const pendentes = encomendasDoDia.filter(e => e.status === 'pendente');
                const retiradas = encomendasDoDia.filter(e => e.status === 'retirado');
                
                // Gera o PDF
                App.helpers.gerarPDFDiario(encomendasDoDia, pendentes, retiradas, dataSelecionada);
                App.helpers.toggleModal('modalExportarDia', false);
            }
        },
        helpers: {
            formatarData(timestamp) {
                return timestamp ? 
                    new Date(timestamp).toLocaleString('pt-BR', { 
                        day: '2-digit', month: '2-digit', year: 'numeric',
                        hour: '2-digit', minute: '2-digit'
                    }) : 'N/A';
            },
            formatarDataSimples(dateStr) {
                const data = new Date(dateStr);
                return data.toLocaleDateString('pt-BR', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric'
                });
            },
            formatarDataHoraBrasil(timestamp) {
                if (!timestamp) return 'N/A';
                const data = new Date(timestamp);
                return data.toLocaleString('pt-BR', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            },
            toggleModal(modalId, show) {
                const modal = document.getElementById(modalId);
                if (modal) {
                    if (show) {
                        modal.classList.remove('hidden');
                        modal.classList.add('flex');
                        document.body.style.overflow = 'hidden';
                    } else {
                        modal.classList.add('hidden');
                        modal.classList.remove('flex');
                        document.body.style.overflow = '';
                    }
                }
            },
            showToast(message, type = 'info') {
                const toast = document.getElementById('toast');
                toast.textContent = message;
                toast.className = `toast fixed bottom-6 left-1/2 transform -translate-x-1/2 z-[2000] px-5 py-3 rounded-xl text-white font-medium shadow-lg toast-slide ${
                    type === 'success' ? 'bg-green-500' : (type === 'error' ? 'bg-red-500' : 'bg-blue-500')
                }`;
                toast.classList.remove('hidden');
                setTimeout(() => {
                    toast.classList.add('hidden');
                }, 3000);
            },
            toggleButtonLoading(button, isLoading) {
                if (!button) return;
                button.disabled = isLoading;
                if (isLoading) {
                    button.dataset.originalText = button.innerHTML;
                    button.innerHTML = `<div class="loading-spinner-custom"></div>`;
                } else if (button.dataset.originalText) {
                    button.innerHTML = button.dataset.originalText;
                }
            },
            renderSkeletonState(show) {
                const container = document.getElementById('encomendasContainer');
                if (!show) return;

                container.innerHTML = '';
                const skeletonHTML = `
                    <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100">
                        <div class="flex justify-between items-start mb-3">
                            <div class="space-y-2 flex-1">
                                <div class="skeleton h-3 w-24 rounded"></div>
                                <div class="skeleton h-5 w-32 rounded"></div>
                            </div>
                            <div class="skeleton h-8 w-8 rounded-full"></div>
                        </div>
                        <div class="space-y-2 mb-3">
                            <div class="skeleton h-4 w-full rounded"></div>
                            <div class="skeleton h-4 w-2/3 rounded"></div>
                        </div>
                        <div class="space-y-2 mb-3">
                            <div class="skeleton h-3 w-40 rounded"></div>
                            <div class="skeleton h-3 w-44 rounded"></div>
                        </div>
                        <div class="flex justify-between items-center">
                            <div class="skeleton h-6 w-20 rounded-full"></div>
                        </div>
                    </div>
                `;
                for (let i = 0; i < 6; i++) {
                    container.innerHTML += skeletonHTML;
                }
            },
            renderEmptyState(message) {
                const container = document.getElementById('encomendasContainer');
                container.innerHTML = `
                    <div class="col-span-full text-center py-12">
                        <div class="inline-flex items-center justify-center w-20 h-20 bg-gray-100 rounded-full mb-4 empty-state-icon">
                            <i class="material-icons-outlined text-3xl text-gray-400">inbox</i>
                        </div>
                        <p class="text-gray-500">${message}</p>
                    </div>
                `;
            },
            gerarTextoCompartilhamento(encomenda) {
                return `📦 Detalhes da Encomenda 📦\n\n` +
                       `Para: ${encomenda.blocoApto}\n` +
                       `Data de Registro: ${App.helpers.formatarData(encomenda.data)}\n` +
                       `Quantidade: ${encomenda.quantidade} item(s)\n` +
                       `Descrição: ${encomenda.descricao || 'N/A'}\n` +
                       `Status: ${encomenda.status === 'pendente' ? 'Pendente para retirada' : 'Já retirado'}`;
            },
            gerarPDFDiario(encomendas, pendentes, retiradas, data) {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                const dataFormatada = this.formatarDataSimples(data);
                
                // Cabeçalho
                doc.setFontSize(20);
                doc.setTextColor(74, 144, 226);
                doc.text("Relatório de Encomendas", 14, 22);
                
                doc.setFontSize(12);
                doc.setTextColor(100, 100, 100);
                doc.text(`Data: ${dataFormatada}`, 14, 32);
                doc.text(`Gerado em: ${new Date().toLocaleString('pt-BR')}`, 14, 38);
                
                // Resumo
                doc.setFontSize(11);
                doc.setTextColor(0, 0, 0);
                doc.text(`📊 RESUMO DO DIA:`, 14, 48);
                doc.text(`├─ Total de encomendas: ${encomendas.length}`, 20, 55);
                doc.text(`├─ Pendentes: ${pendentes.length}`, 20, 61);
                doc.text(`└─ Retiradas: ${retiradas.length}`, 20, 67);
                
                let startY = 80;
                
                // Seção de Pendentes
                if (pendentes.length > 0) {
                    doc.setFontSize(12);
                    doc.setTextColor(239, 68, 68);
                    doc.text(`🟡 ENCOMENDAS PENDENTES (${pendentes.length})`, 14, startY);
                    startY += 8;
                    
                    const pendentesBody = pendentes.map(item => [
                        App.helpers.formatarDataHoraBrasil(item.data),
                        item.blocoApto || 'N/A',
                        item.descricao || '-',
                        item.quantidade || '1',
                        item.registradoPorNome || 'N/A'
                    ]);
                    
                    doc.autoTable({
                        startY: startY,
                        head: [['Data/Hora', 'Bloco/Apto', 'Descrição', 'Qtd', 'Porteiro']],
                        body: pendentesBody,
                        theme: 'striped',
                        headStyles: { fillColor: [239, 68, 68] },
                        alternateRowStyles: { fillColor: [254, 242, 242] },
                        margin: { left: 14, right: 14 }
                    });
                    startY = doc.lastAutoTable.finalY + 10;
                }
                
                // Seção de Retiradas
                if (retiradas.length > 0) {
                    doc.setFontSize(12);
                    doc.setTextColor(16, 185, 129);
                    doc.text(`🟢 ENCOMENDAS RETIRADAS (${retiradas.length})`, 14, startY);
                    startY += 8;
                    
                    const retiradasBody = retiradas.map(item => [
                        App.helpers.formatarDataHoraBrasil(item.data),
                        item.blocoApto || 'N/A',
                        item.descricao || '-',
                        item.quantidade || '1',
                        item.retiradoPorNome || 'N/A',
                        App.helpers.formatarDataHoraBrasil(item.dataRetirada)
                    ]);
                    
                    doc.autoTable({
                        startY: startY,
                        head: [['Entrada', 'Bloco/Apto', 'Descrição', 'Qtd', 'Retirado por', 'Saída']],
                        body: retiradasBody,
                        theme: 'striped',
                        headStyles: { fillColor: [16, 185, 129] },
                        alternateRowStyles: { fillColor: [240, 253, 244] },
                        margin: { left: 14, right: 14 }
                    });
                }
                
                // Rodapé
                const pageCount = doc.internal.getNumberOfPages();
                for (let i = 1; i <= pageCount; i++) {
                    doc.setPage(i);
                    doc.setFontSize(9);
                    doc.setTextColor(150, 150, 150);
                    doc.text(
                        `Sistema de Encomendas - Condomínio Cotovias | Página ${i} de ${pageCount}`,
                        doc.internal.pageSize.getWidth() / 2,
                        doc.internal.pageSize.getHeight() - 10,
                        { align: 'center' }
                    );
                }
                
                doc.save(`relatorio_encomendas_${dataFormatada.replace(/\//g, '-')}.pdf`);
                App.helpers.showToast('PDF gerado com sucesso!', 'success');
            }
        },
        handlers: {
            abrirModalCompartilhar(id) {
                App.state.encomendaAtual = App.state.historicoCompleto.find(item => item.id === id);
                if (!App.state.encomendaAtual) return;
                
                document.getElementById('detalhesCompartilhar').innerHTML = `
                    <p><strong class="text-gray-700">📦 Para:</strong> <span class="text-gray-600">${App.state.encomendaAtual.blocoApto}</span></p>
                    <p><strong class="text-gray-700">📅 Data:</strong> <span class="text-gray-600">${App.helpers.formatarData(App.state.encomendaAtual.data)}</span></p>
                    <p><strong class="text-gray-700">📝 Descrição:</strong> <span class="text-gray-600">${App.state.encomendaAtual.descricao || 'N/A'}</span></p>
                `;
                
                App.helpers.toggleModal('modalCompartilhar', true);
            },
            compartilhar(event) {
                const action = event.currentTarget.dataset.share;
                const encomenda = App.state.encomendaAtual;
                if (!encomenda) return;
                
                const texto = App.helpers.gerarTextoCompartilhamento(encomenda);
                
                switch(action) {
                    case 'whatsapp': 
                        window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`, '_blank'); 
                        break;
                    case 'email': 
                        window.location.href = `mailto:?subject=Detalhes da Encomenda - ${encomenda.blocoApto}&body=${encodeURIComponent(texto)}`; 
                        break;
                    case 'copy': 
                        navigator.clipboard.writeText(texto)
                            .then(() => App.helpers.showToast('Texto copiado!', 'success'))
                            .catch(() => App.helpers.showToast('Falha ao copiar.', 'error')); 
                        break;
                }
                App.helpers.toggleModal('modalCompartilhar', false);
            }
        },
        init() {
            if (!firebase.apps.length) {
                firebase.initializeApp(App.state.firebaseConfig);
            }
            App.state.database = firebase.database();

            const setupEventListeners = () => {
                App.methods.carregarHistorico();
                
                // Botão de exportar por dia
                document.getElementById('btnExportarPorDia').addEventListener('click', 
                    () => App.helpers.toggleModal('modalExportarDia', true));
                document.getElementById('btnConfirmarExportarDia').addEventListener('click', 
                    App.methods.exportarPorDia);
                
                // Filtros
                document.getElementById('filterForm').addEventListener('submit', App.methods.aplicarFiltros);
                document.getElementById('filterForm').addEventListener('reset', App.methods.limparFiltros);
                document.getElementById('filtroBloco').addEventListener('input', App.methods.aplicarFiltros);
                document.getElementById('filtroApto').addEventListener('input', App.methods.aplicarFiltros);
                
                // Modais
                document.querySelectorAll('.modal-overlay').forEach(modal => {
                    modal.addEventListener('click', (e) => { 
                        if (e.target === modal) App.helpers.toggleModal(modal.id, false); 
                    });
                });
                document.querySelectorAll('.modal-close').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const modal = btn.closest('.modal-overlay');
                        if (modal) App.helpers.toggleModal(modal.id, false);
                    });
                });
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        document.querySelectorAll('.modal-overlay:not(.hidden)').forEach(modal => 
                            App.helpers.toggleModal(modal.id, false));
                    }
                });
                
                // Compartilhamento
                document.querySelectorAll('.share-option').forEach(btn => {
                    btn.addEventListener('click', App.handlers.compartilhar);
                });
                
                // Seta a data atual no input
                const hoje = new Date().toISOString().split('T')[0];
                document.getElementById('dataExportacao').value = hoje;
            };
            
            document.addEventListener('DOMContentLoaded', setupEventListeners);
        }
    };

    App.init();
    </script>
</body>
</html>
