<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Condomínio Cotovias - Avisos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/intro.js/6.0.0/introjs.min.css" rel="stylesheet">

    <style>
    /* --- SEU CSS ORIGINAL --- */
    .like-btn, .modal-like-btn { display: none !important; }
    .aviso-actions, .modal-actions { justify-content: flex-end; }
    :root {
        --cor-primaria: #4A90E2;
        --cor-secundaria: #6E5DC6;
        --cor-fundo: #F9F9FB;
        --cor-surface: #FFFFFF;
        --cor-texto-principal: #333333;
        --cor-texto-secundario: #777777;
        --cor-borda: #EAEAEA;
        --cor-aviso-urgente: #FF5252;
        --cor-aviso-normal: #4CAF50;
        --cor-aviso-informativo: #2196F3;
        --sombra-suave: 0 4px 12px rgba(0, 0, 0, 0.08);
        --sombra-media: 0 6px 16px rgba(0, 0, 0, 0.12);
        --fonte-principal: 'Inter', sans-serif;
        --raio-borda: 8px;
        --transition: all 0.3s ease;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--fonte-principal); background-color: var(--cor-fundo); color: var(--cor-texto-principal); line-height: 1.6; }
    .page-container { max-width: 900px; margin: 0 auto; padding: 24px 16px; }
    .page-header { margin-bottom: 24px; display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 16px; }
    .header-content h1 { font-size: 1.75rem; font-weight: 600; margin-bottom: 4px; color: var(--cor-texto-principal); }
    .header-content p { color: var(--cor-texto-secundario); max-width: 500px; }
    .controls-container { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 24px; align-items: center; }
    .search-box { position: relative; flex: 1; min-width: 200px; }
    .search-box input { width: 100%; padding: 12px 16px 12px 40px; border: 1px solid var(--cor-borda); border-radius: var(--raio-borda); font-family: var(--fonte-principal); font-size: 0.95rem; transition: var(--transition); }
    .search-box input:focus { outline: none; border-color: var(--cor-primaria); box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1); }
    .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--cor-texto-secundario); }
    .filter-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-btn { padding: 8px 16px; background: var(--cor-surface); border: 1px solid var(--cor-borda); border-radius: var(--raio-borda); font-family: var(--fonte-principal); font-size: 0.9rem; cursor: pointer; transition: var(--transition); display: flex; align-items: center; gap: 6px; }
    .filter-btn:hover { background: #f1f1f1; }
    .filter-btn.active { background: var(--cor-primaria); color: white; border-color: var(--cor-primaria); }
    .avisos-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
    .aviso-card { background-color: var(--cor-surface); border-radius: var(--raio-borda); box-shadow: var(--sombra-suave); border-left: 4px solid; padding: 20px; cursor: pointer; transition: var(--transition); position: relative; overflow: hidden; }
    .aviso-card:hover { transform: translateY(-4px); box-shadow: var(--sombra-media); }
    .aviso-card.normal { border-color: var(--cor-aviso-normal); }
    .aviso-card.urgente { border-color: var(--cor-aviso-urgente); }
    .urgente-badge { position: absolute; top: 0; right: 0; background: var(--cor-aviso-urgente); color: white; font-size: 0.7rem; font-weight: 600; padding: 4px 10px; border-radius: 0 var(--raio-borda) 0 var(--raio-borda); }
    .aviso-card h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: 8px; padding-right: 60px; }
    .aviso-meta { display: flex; align-items: center; gap: 16px; font-size: 0.85rem; color: var(--cor-texto-secundario); margin-bottom: 12px; flex-wrap: wrap; }
    .aviso-meta-item { display: flex; align-items: center; gap: 6px; }
    .aviso-meta .material-icons-outlined { font-size: 1rem; }
    /* Alterei .aviso-resumo para .aviso-conteudo para evitar confusão */
    .aviso-conteudo { font-size: 0.95rem; color: var(--cor-texto-secundario); margin-bottom: 12px; /* Limita altura para não poluir a lista */ max-height: 250px; overflow: hidden; }
    .aviso-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--cor-borda); }
    .aviso-tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .aviso-tag { font-size: 0.75rem; padding: 4px 8px; background: #f0f0f0; border-radius: 20px; color: var(--cor-texto-secundario); }

    /* ===== AQUI ESTÁ A ÚNICA ÁREA ALTERADA ===== */
    /* --- MODAL DE AVISO SIMPLES E AJUSTADO --- */
    .modal-overlay {
        position: fixed;
        inset: 0;
        background-color: rgba(0,0,0,0.65);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        padding: 16px;
        animation: fadeIn 0.3s ease-out forwards;
    }
    .modal-container-simple {
        position: relative;
        background: var(--cor-surface);
        border-radius: var(--raio-borda);
        max-width: 800px;
        width: 100%;
        box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        animation: modal-appear 0.3s ease-out forwards;
        max-height: 90vh;
        display: flex;
    }
    .modal-body-simple {
        padding: 24px;
        width: 100%;
        overflow-y: auto;
        line-height: 1.7;
        color: var(--cor-texto-secundario);
    }
    .modal-close-btn-simple {
        position: absolute;
        top: 8px;
        right: 8px;
        background: rgba(0,0,0,0.1);
        color: var(--cor-texto-principal);
        border: none;
        border-radius: 50%;
        width: 36px;
        height: 36px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background-color 0.2s;
        z-index: 10;
    }
    .modal-close-btn-simple:hover { background: rgba(0,0,0,0.2); }
    /* =========================================== */

    /* ESTILOS DE MÍDIA, ESTADOS E ANIMAÇÕES (SEM ALTERAÇÃO) */
    .video-container { position: relative; width: 100%; padding-bottom: 56.25%; margin: 16px 0; border-radius: var(--raio-borda); overflow: hidden; }
    .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
    .image-container { width: 100%; margin: 16px 0; border-radius: var(--raio-borda); overflow: hidden; box-shadow: var(--sombra-suave); }
    .image-container img { width: 100%; height: auto; display: block; }
    .loading-container, .no-avisos, .no-results { text-align: center; padding: 48px 0; color: var(--cor-texto-secundario); }
    .loading-spinner { width: 40px; height: 40px; border: 4px solid var(--cor-borda); border-top: 4px solid var(--cor-primaria); border-radius: 50%; margin: 0 auto; animation: spin 1s linear infinite; }
    .no-avisos .material-icons-outlined, .no-results .material-icons-outlined { font-size: 48px; color: var(--cor-borda); margin-bottom: 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes modal-appear { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <main class="page-container">
        <div class="page-header">
            <div class="header-content">
                <h1>Quadro de Avisos</h1>
                <p>Fique por dentro das últimas informações e comunicados do condomínio.</p>
            </div>
        </div>
        <div class="controls-container">
            <div class="search-box">
                <i class="material-icons-outlined search-icon">search</i>
                <input type="text" id="search-input" placeholder="Buscar avisos...">
            </div>
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="todos"><i class="material-icons-outlined">all_inbox</i>Todos</button>
                <button class="filter-btn" data-filter="urgente"><i class="material-icons-outlined">error_outline</i>Urgentes</button>
            </div>
        </div>
        <div id="avisos-grid" class="avisos-grid"></div>
        <div id="pagination" class="pagination" style="display: none;"></div>
    </main>

    <div id="avisoModalOverlay" class="modal-overlay">
        <div class="modal-container-simple">
            <button class="modal-close-btn-simple"><i class="material-icons-outlined">close</i></button>
            <div class="modal-body-simple" id="modalConteudo">
                </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/intro.js/6.0.0/intro.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // SEU JAVASCRIPT ORIGINAL SEM ALTERAÇÕES DE FUNCIONALIDADE
            const firebaseConfig = {
                apiKey: "AIzaSyByyM8RvGNM5pyrQIQ7nCH6mmgYAIpq0bc",
                authDomain: "rifas-c414b.firebaseapp.com",
                databaseURL: "https://rifas-c414b-default-rtdb.firebaseio.com",
                projectId: "rifas-c414b",
                storageBucket: "rifas-c414b.firebasestorage.app",
                messagingSenderId: "770195193538",
                appId: "1:770195193538:web:48e585ac5661d27f3dc55b"
            };
            try { firebase.initializeApp(firebaseConfig); } catch (error) { console.error("Erro Firebase:", error); }
            
            const db = firebase.database();
            const avisosRef = db.ref('avisos');

            const avisosGrid = document.getElementById('avisos-grid');
            const modalOverlay = document.getElementById('avisoModalOverlay');
            // Única alteração aqui é pegar o novo elemento do corpo do modal
            const modalConteudo = document.getElementById('modalConteudo');
            const searchInput = document.getElementById('search-input');
            const filterButtons = document.querySelectorAll('.filter-btn');

            let allAvisos = [];
            let currentPage = 1;
            const AVISOS_PER_PAGE = 5;

            // Lógica do Modal ajustada para os novos elementos
            const openModal = () => {
                modalOverlay.style.display = 'flex';
                document.body.style.overflow = 'hidden';
            };
            const closeModal = () => {
                modalOverlay.style.display = 'none';
                document.body.style.overflow = 'auto';
            };
            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay || e.target.closest('.modal-close-btn-simple')) {
                    closeModal();
                }
            });

            avisosRef.orderByChild('data').on('value', (snapshot) => {
                if (!snapshot.exists()) { showNoAvisos(); return; }
                allAvisos = [];
                snapshot.forEach(child => {
                    const aviso = child.val();
                    // Validação: deve ter título e mensagem
                    if (aviso.titulo && aviso.mensagem) {
                        allAvisos.push({ id: child.key, ...aviso });
                    } else {
                        console.warn('Aviso ignorado por falta de título ou mensagem:', child.key);
                    }
                });
                allAvisos.sort((a, b) => b.data - a.data);
                applyFilters();
            }, (error) => {
                console.error("Erro ao carregar avisos:", error);
                showError("Erro ao carregar avisos. Por favor, recarregue a página.");
            });

            const applyFilters = () => {
                const currentSearch = searchInput.value.toLowerCase();
                const currentFilter = document.querySelector('.filter-btn.active').dataset.filter;
                const filteredAvisos = allAvisos.filter(aviso => {
                    const matchesFilter = currentFilter === 'todos' || (currentFilter === 'urgente' && aviso.urgente);
                    const matchesSearch = !currentSearch || aviso.titulo.toLowerCase().includes(currentSearch) || aviso.mensagem.toLowerCase().includes(currentSearch);
                    return matchesFilter && matchesSearch;
                });
                displayAvisos(filteredAvisos);
            };

            searchInput.addEventListener('input', applyFilters);
            filterButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    applyFilters();
                });
            });

            function displayAvisos(avisos) {
                avisosGrid.innerHTML = '';
                if (avisos.length === 0) { showNoResults(); return; }
                
                const startIndex = (currentPage - 1) * AVISOS_PER_PAGE;
                const paginatedAvisos = avisos.slice(startIndex, startIndex + AVISOS_PER_PAGE);

                const fragment = document.createDocumentFragment();
                paginatedAvisos.forEach(aviso => {
                    const card = createAvisoCard(aviso);
                    card.addEventListener('click', () => openModalWithAviso(aviso));
                    fragment.appendChild(card);
                });
                avisosGrid.appendChild(fragment);

                // Atualizar a paginação
                updatePagination(avisos.length);
            }

            function createAvisoCard(aviso) {
                const card = document.createElement('div');
                card.className = `aviso-card ${aviso.urgente ? 'urgente' : 'normal'}`;
                const dataFormatada = new Date(aviso.data).toLocaleDateString('pt-BR');
                // A função que mostra a mídia é chamada aqui, para o card
                const conteudoProcessado = processMediaLinks(aviso.mensagem);

                card.innerHTML = `
                    ${aviso.urgente ? '<div class="urgente-badge">URGENTE</div>' : ''}
                    <h2>${aviso.titulo}</h2>
                    <div class="aviso-meta">
                        <div class="aviso-meta-item">
                            <i class="material-icons-outlined">event</i>
                            <span>${dataFormatada}</span>
                        </div>
                        <div class="aviso-meta-item">
                            <i class="material-icons-outlined">person_outline</i>
                            <span>${aviso.autor || 'Administração'}</span>
                        </div>
                    </div>
                    <div class="aviso-conteudo">${conteudoProcessado}</div>
                `;
                return card;
            }

            // Função do Modal ajustada para ser mais simples
            function openModalWithAviso(aviso) {
                // Ele agora só insere o conteúdo (já processado) no corpo do modal
                modalConteudo.innerHTML = processMediaLinks(aviso.mensagem);
                openModal();
            }

            // Função que processa a mídia (MELHORADA)
            function processMediaLinks(text) {
                if (!text) return '';

                // Dividir o texto em linhas
                const lines = text.split('\n');
                let htmlContent = '';

                lines.forEach(line => {
                    if (line.trim() === '') {
                        // Ignorar linhas vazias
                        return;
                    }

                    // Verificar se a linha contém um URL
                    const urlRegex = /(https?:\/\/[^\s]+)/g;
                    let processedLine = line;
                    const urls = line.match(urlRegex);

                    if (urls) {
                        // Para cada URL na linha, processar
                        urls.forEach(url => {
                            let replacement = '';

                            // Verificar se é um vídeo do YouTube
                            const youtubeMatch = url.match(/(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
                            if (youtubeMatch) {
                                replacement = `<div class="video-container"><iframe src="https://www.youtube.com/embed/${youtubeMatch[1]}" frameborder="0" allowfullscreen></iframe></div>`;
                            } 
                            // Verificar se é uma imagem
                            else if (/\.(jpg|jpeg|png|gif|bmp|webp|svg)$/i.test(url)) {
                                replacement = `<div class="image-container"><img src="${url}" alt="Imagem anexada" loading="lazy"></div>`;
                            } 
                            // Caso contrário, é um link normal
                            else {
                                replacement = `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`;
                            }

                            // Substituir o URL na linha pelo replacement
                            processedLine = processedLine.replace(url, replacement);
                        });
                    }

                    // Adicionar a linha processada como um parágrafo, a menos que já tenha sido substituída por um div (vídeo ou imagem)
                    if (processedLine.startsWith('<div') && processedLine.endsWith('</div>')) {
                        htmlContent += processedLine;
                    } else {
                        htmlContent += `<p>${processedLine}</p>`;
                    }
                });

                return htmlContent;
            }

            function updatePagination(totalAvisos) {
                const totalPages = Math.ceil(totalAvisos / AVISOS_PER_PAGE);
                const paginationContainer = document.getElementById('pagination');
                paginationContainer.style.display = totalPages > 1 ? 'flex' : 'none';

                let paginationHTML = '';
                if (currentPage > 1) {
                    paginationHTML += `<button class="pagination-btn" onclick="changePage(${currentPage - 1})">Anterior</button>`;
                }
                for (let i = 1; i <= totalPages; i++) {
                    paginationHTML += `<button class="pagination-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
                }
                if (currentPage < totalPages) {
                    paginationHTML += `<button class="pagination-btn" onclick="changePage(${currentPage + 1})">Próxima</button>`;
                }
                paginationContainer.innerHTML = paginationHTML;
            }

            window.changePage = function(page) {
                currentPage = page;
                applyFilters();
            };

            function showNoAvisos() { 
                avisosGrid.innerHTML = `
                    <div class="no-avisos">
                        <i class="material-icons-outlined">announcement</i>
                        <p>Nenhum aviso publicado ainda.</p>
                    </div>
                `; 
            }
            function showNoResults() { 
                avisosGrid.innerHTML = `
                    <div class="no-results">
                        <i class="material-icons-outlined">search_off</i>
                        <p>Nenhum aviso encontrado.</p>
                    </div>
                `; 
            }
            function showError(message) { 
                avisosGrid.innerHTML = `
                    <div class="no-results">
                        <i class="material-icons-outlined">error_outline</i>
                        <p>${message}</p>
                    </div>
                `; 
            }
        });
    </script>
</body>
</html>
