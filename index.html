<script>
// Configuração do Firebase (USE AS MESMAS CREDENCIAIS DO SITE PRINCIPAL)
const firebaseConfig = {
    apiKey: "AIzaSyByyM8RvGNM5pyrQIQ7nCH6mmgYAIpq0bc",
    authDomain: "rifas-c414b.firebaseapp.com",
    databaseURL: "https://rifas-c414b-default-rtdb.firebaseio.com",
    projectId: "rifas-c414b",
    storageBucket: "rifas-c414b.appspot.com",
    messagingSenderId: "770195193538",
    appId: "1:770195193538:web:48e585ac5661d27f3dc55b"
};

// =============================================
// SISTEMA COMPLETO DE CHAT ENTRE SITES - RECEPTOR
// =============================================
(function() {
    'use strict';
    
    let crossSiteChatRef = null;
    let currentUser = null;
    let unreadCount = 0;
    let isWidgetOpen = false;
    let firebaseInitialized = false;
    
    // Elementos DOM
    const widget = document.getElementById('crossSiteChatWidget');
    const minimized = document.getElementById('crossSiteChatMinimized');
    const messagesContainer = document.getElementById('crossSiteMessages');
    const chatInput = document.getElementById('crossSiteChatInput');
    const chatBadge = document.getElementById('crossSiteChatBadge');
    
    function initializeCrossSiteChat() {
        console.log('🚀 Iniciando sistema de chat entre sites...');
        
        // Inicializar Firebase
        initializeFirebase();
        setupEventListeners();
        showMinimizedChat();
    }
    
    function initializeFirebase() {
        try {
            // Verificar se Firebase já está inicializado
            if (typeof firebase === 'undefined') {
                console.log('⚠️ Firebase não encontrado, carregando...');
                loadFirebaseSDK();
                return;
            }
            
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            
            firebaseInitialized = true;
            setupFirebaseChat();
            
        } catch (error) {
            console.error('❌ Erro ao inicializar Firebase:', error);
        }
    }
    
    function loadFirebaseSDK() {
        // Carregar Firebase SDK dinamicamente
        const script = document.createElement('script');
        script.src = 'https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js';
        script.onload = () => {
            const scriptAuth = document.createElement('script');
            scriptAuth.src = 'https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js';
            scriptAuth.onload = () => {
                const scriptDB = document.createElement('script');
                scriptDB.src = 'https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js';
                scriptDB.onload = () => {
                    firebase.initializeApp(firebaseConfig);
                    firebaseInitialized = true;
                    setupFirebaseChat();
                };
                document.head.appendChild(scriptDB);
            };
            document.head.appendChild(scriptAuth);
        };
        document.head.appendChild(script);
    }
    
    function setupFirebaseChat() {
        const database = firebase.database();
        const auth = firebase.auth();
        
        // Fazer login anônimo
        auth.signInAnonymously()
            .then(() => {
                console.log('✅ Login anônimo realizado');
                
                // Referência para chat entre sites
                crossSiteChatRef = database.ref('crossSiteChat');
                
                // Escutar novas mensagens
                crossSiteChatRef.limitToLast(50).on('child_added', (snapshot) => {
                    const message = snapshot.val();
                    if (message) {
                        displayCrossSiteMessage(message);
                        
                        // Mostrar notificação se widget fechado
                        if (!isWidgetOpen && message.senderId !== currentUser?.uid) {
                            unreadCount++;
                            updateBadge();
                            showNotification(message);
                        }
                    }
                });
                
                // Obter usuário atual
                auth.onAuthStateChanged((user) => {
                    currentUser = user;
                });
                
            })
            .catch((error) => {
                console.error('❌ Erro no login anônimo:', error);
            });
    }
    
    function setupEventListeners() {
        // Enter para enviar mensagem
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendCrossSiteMessage();
            }
        });
        
        // Auto-resize do textarea
        chatInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });
        
        // Arrastar widget
        makeWidgetDraggable();
    }
    
    function makeWidgetDraggable() {
        const header = document.getElementById('chatHeader');
        let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
        
        header.onmousedown = dragMouseDown;
        
        function dragMouseDown(e) {
            e.preventDefault();
            pos3 = e.clientX;
            pos4 = e.clientY;
            document.onmouseup = closeDragElement;
            document.onmousemove = elementDrag;
        }
        
        function elementDrag(e) {
            e.preventDefault();
            pos1 = pos3 - e.clientX;
            pos2 = pos4 - e.clientY;
            pos3 = e.clientX;
            pos4 = e.clientY;
            
            widget.style.top = (widget.offsetTop - pos2) + "px";
            widget.style.left = (widget.offsetLeft - pos1) + "px";
            widget.style.right = "auto";
            widget.style.bottom = "auto";
        }
        
        function closeDragElement() {
            document.onmouseup = null;
            document.onmousemove = null;
        }
    }
    
    function sendCrossSiteMessage() {
        if (!firebaseInitialized || !crossSiteChatRef) {
            alert('Chat ainda não está pronto. Aguarde...');
            return;
        }
        
        const messageText = chatInput.value.trim();
        if (!messageText) return;
        
        const messageData = {
            text: messageText,
            senderId: currentUser?.uid || 'anonymous',
            senderName: 'Visitante', // Nome padrão para usuários anônimos
            timestamp: Date.now(),
            type: 'CHAT_MESSAGE'
        };
        
        // Enviar para Firebase
        crossSiteChatRef.push(messageData)
            .then(() => {
                chatInput.value = '';
                chatInput.style.height = 'auto';
            })
            .catch((error) => {
                console.error('❌ Erro ao enviar mensagem:', error);
                alert('Erro ao enviar mensagem. Tente novamente.');
            });
    }
    
    function displayCrossSiteMessage(message) {
        const messageElement = document.createElement('div');
        const isSent = message.senderId === currentUser?.uid;
        
        messageElement.className = `cross-site-message ${isSent ? 'sent' : 'received'}`;
        messageElement.innerHTML = `
            ${!isSent ? `<div class="cross-site-message-sender">${message.senderName}</div>` : ''}
            <div class="cross-site-message-bubble">${message.text}</div>
            <div class="cross-site-message-time">${formatMessageTime(message.timestamp)}</div>
        `;
        
        messagesContainer.appendChild(messageElement);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }
    
    function formatMessageTime(timestamp) {
        const date = new Date(timestamp);
        const now = new Date();
        const diff = now - date;
        
        if (diff < 60000) return 'Agora';
        if (diff < 3600000) return `${Math.floor(diff / 60000)} min`;
        
        return date.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    }
    
    function showNotification(message) {
        // Notificação do navegador
        if ('Notification' in window) {
            if (Notification.permission === 'granted') {
                new Notification(`💬 ${message.senderName}`, {
                    body: message.text,
                    icon: '/favicon.ico'
                });
            } else if (Notification.permission !== 'denied') {
                Notification.requestPermission().then(permission => {
                    if (permission === 'granted') {
                        new Notification(`💬 ${message.senderName}`, {
                            body: message.text,
                            icon: '/favicon.ico'
                        });
                    }
                });
            }
        }
        
        // Efeito visual no widget minimizado
        minimized.style.background = '#ff6b6b';
        setTimeout(() => {
            minimized.style.background = '#6750A4';
        }, 1000);
    }
    
    function updateBadge() {
        if (chatBadge) {
            chatBadge.textContent = unreadCount > 9 ? '9+' : unreadCount;
            chatBadge.style.display = unreadCount > 0 ? 'flex' : 'none';
        }
    }
    
    // Controles do widget
    window.expandChatWidget = function() {
        widget.style.display = 'flex';
        minimized.style.display = 'none';
        isWidgetOpen = true;
        unreadCount = 0;
        updateBadge();
        chatInput.focus();
    };
    
    window.minimizeChatWidget = function() {
        widget.style.display = 'none';
        minimized.style.display = 'flex';
        isWidgetOpen = false;
    };
    
    window.closeChatWidget = function() {
        widget.style.display = 'none';
        minimized.style.display = 'none';
        isWidgetOpen = false;
    };
    
    window.sendCrossSiteMessage = sendCrossSiteMessage;
    
    function showMinimizedChat() {
        minimized.style.display = 'flex';
    }
    
    // Função para teste
    window.testCrossSiteChat = function() {
        if (crossSiteChatRef) {
            crossSiteChatRef.push({
                text: 'Esta é uma mensagem de teste do sistema de chat!',
                senderId: 'test',
                senderName: 'Sistema de Teste',
                timestamp: Date.now(),
                type: 'TEST_MESSAGE'
            });
        }
    };
    
    // Inicializar
    document.addEventListener('DOMContentLoaded', initializeCrossSiteChat);
    
    console.log('🎉 Sistema de chat entre sites carregado!');
    
})();
</script>

            let userId = localStorage.getItem('uniqueUserId');
            if (!userId) {

                localStorage.setItem('uniqueUserId', userId);
            }
            return userId;

        document.addEventListener('DOMContentLoaded', () => {
            const ui = {
                loading: document.getElementById('loading'),
                contentFrame: document.getElementById('contentFrame'),
                menuItems: document.querySelectorAll('.nav-item')
            };

            const setActiveMenuItem = (pageUrl) => {
                ui.menuItems.forEach(item => {
                    item.classList.toggle('active', item.dataset.page === pageUrl);
                });
            };
            
            const loadPage = (pageUrl, title) => {
                ui.loading.style.display = 'flex';
                document.title = `${title} | Condomínio Cotovias`;
                const currentSrc = ui.contentFrame.src.split('/').pop();
                if (currentSrc !== pageUrl) {
                    ui.contentFrame.src = pageUrl;
                } else {
                     ui.loading.style.display = 'none';
                }
                ui.contentFrame.onload = () => {
                    ui.loading.style.display = 'none';
                };
                setActiveMenuItem(pageUrl);
            };
            
            // Função genérica para solicitar acesso
            const requestAccess = async (accessType) => {
                const userId = getOrGenerateUserId();
                const dbPath = accessType === 'admin' ? 'admins/' : 'users/';
                const pageUrl = accessType === 'admin' ? 'admin.html' : 'criarlojas.html';
                const pageTitle = accessType === 'admin' ? 'Administração' : 'Criar Loja';
                const requestText = accessType === 'admin' ? 'acesso de Administrador' : 'acesso para criar uma loja';
                
                ui.loading.style.display = 'flex';
                
                try {
                    const snapshot = await database.ref(dbPath + userId).once('value');
                    const userData = snapshot.val();

                    if (userData && userData.status === 'active') {
                        loadPage(pageUrl, pageTitle);
                    } else {
                        if (!userData) {
                            await database.ref(dbPath + userId).set({
                                status: 'pending',
                                requestedAt: new Date().toISOString()
                            });
                        }
                        
                        const numeroWhatsApp = '5521987715733';
                        const mensagem = `Olá! Gostaria de solicitar ${requestText}. Meu ID de solicitação é: ${userId}`;

                        alert(`Para obter ${requestText}, solicite a liberação.\n\nSeu ID de Solicitação é: ${userId}\n\nVocê será redirecionado para o WhatsApp.`);
                        window.open(urlWhatsApp, '_blank');
                        ui.loading.style.display = 'none';
                    }
                } catch (error) {
                    console.error("Erro ao verificar status:", error);
                    alert("Ocorreu um erro. Tente novamente.");
                    ui.loading.style.display = 'none';
                }
            };
            
            // --- EVENT LISTENERS ATUALIZADOS ---
            ui.menuItems.forEach(item => {
                const page = item.dataset.page;

                if (page === 'admin.html') {
                    // Botão Admin agora solicita acesso
                    item.addEventListener('click', () => requestAccess('admin'));
                } else if (page === 'criarlojas.html') {
                    // Botão Criar Loja solicita acesso de usuário
                    item.addEventListener('click', () => requestAccess('user'));
                } else {
                    // Comportamento padrão para outros botões
                    item.addEventListener('click', () => {
                        loadPage(item.dataset.page, item.dataset.title);
                    });
                }
            });

            // --- INICIALIZAÇÃO ---
            const initialItem = document.querySelector('.nav-item');
            if (initialItem) {
                 loadPage(initialItem.dataset.page, initialItem.dataset.title);
            }
        });
    </script>
