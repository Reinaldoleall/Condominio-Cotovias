<script>
// =============================================
// SISTEMA UNIFICADO DE NOTIFICAÇÕES COM FIREBASE
// Para usar em ambos os sites (emissor e receptor)
// =============================================
(function() {
    'use strict';
    
    // Configuração do Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyByyM8RvGNM5pyrQIQ7nCH6mmgYAIpq0bc",
        authDomain: "rifas-c414b.firebaseapp.com",
        databaseURL: "https://rifas-c414b-default-rtdb.firebaseio.com",
        projectId: "rifas-c414b",
        storageBucket: "rifas-c414b.appspot.com",
        messagingSenderId: "770195193538",
        appId: "1:770195193538:web:48e585ac5661d27f3dc55b"
    };
    
    // Estado do sistema
    const state = {
        isInitialized: false,
        firebaseApp: null,
        database: null,
        auth: null,
        currentUser: null,
        unreadMessagesCount: 0,
        isUserInChat: false,
        notificationBadge: null,
        notificationContainer: null,
        notificationSoundEnabled: true,
        showDesktopNotifications: true,
        notificationHistory: []
    };
    
    // Inicialização principal
    function initializeNotificationSystem() {
        if (state.isInitialized) return;
        
        console.log('🚀 Iniciando sistema unificado de notificações Firebase...');
        
        try {
            // Inicializar Firebase
            initializeFirebase();
            
            // Configurar interface de notificação
            setupNotificationInterface();
            
            // Configurar listeners
            setupEventListeners();
            
            state.isInitialized = true;
            
            // Mostrar notificação de sistema pronto
            showSystemNotification('Sistema de notificações ativo!', 'success');
            
        } catch (error) {
            console.error('❌ Erro na inicialização:', error);
        }
    }
    
    // =============================================
    // FIREBASE - CONFIGURAÇÃO E LISTENERS
    // =============================================
    
    function initializeFirebase() {
        try {
            // Inicializar Firebase
            state.firebaseApp = firebase.initializeApp(firebaseConfig);
            state.database = firebase.database();
            state.auth = firebase.auth();
            
            console.log('✅ Firebase inicializado');
            
            // Configurar autenticação anônima
            setupAnonymousAuth();
            
        } catch (error) {
            console.error('❌ Erro ao inicializar Firebase:', error);
            // Fallback para notificações locais
            setupFallbackSystem();
        }
    }
    
    function setupAnonymousAuth() {
        state.auth.signInAnonymously()
            .then(() => {
                console.log('✅ Autenticação anônima realizada');
                setupFirebaseListeners();
            })
            .catch(error => {
                console.error('❌ Erro na autenticação:', error);
                setupFallbackSystem();
            });
        
        // Escutar mudanças de autenticação
        state.auth.onAuthStateChanged((user) => {
            state.currentUser = user;
            if (user) {
                console.log('👤 Usuário Firebase:', user.uid);
                setupFirebaseListeners();
            }
        });
    }
    
    function setupFirebaseListeners() {
        if (!state.database) return;
        
        // Referência para notificações globais
        const notificationsRef = state.database.ref('global_notifications');
        
        // Escutar novas notificações
        notificationsRef.limitToLast(1).on('child_added', (snapshot) => {
            const notification = snapshot.val();
            if (notification && shouldProcessNotification(notification)) {
                processIncomingNotification(notification);
            }
        });
        
        console.log('✅ Listeners do Firebase configurados');
    }
    
    function shouldProcessNotification(notification) {
        // Não processar notificações muito antigas (5 minutos)
        const isRecent = Date.now() - notification.timestamp < 5 * 60 * 1000;
        
        // Não processar própria notificação (se tiver user ID)
        const isOwnNotification = notification.senderId === (state.currentUser?.uid || '');
        
        return isRecent && !isOwnNotification;
    }
    
    // =============================================
    // ENVIO DE NOTIFICAÇÕES
    // =============================================
    
    function sendNotification(notificationData) {
        if (!state.database || !state.currentUser) {
            console.log('⚠️ Firebase não disponível, usando fallback');
            sendNotificationFallback(notificationData);
            return;
        }
        
        const notification = {
            ...notificationData,
            senderId: state.currentUser.uid,
            timestamp: Date.now(),
            id: generateNotificationId(),
            site: window.location.hostname
        };
        
        // Salvar no Firebase
        const notificationsRef = state.database.ref('global_notifications');
        notificationsRef.push(notification)
            .then(() => {
                console.log('📤 Notificação enviada para Firebase:', notification.message);
            })
            .catch(error => {
                console.error('❌ Erro ao enviar notificação:', error);
                sendNotificationFallback(notification);
            });
    }
    
    function sendNotificationFallback(notificationData) {
        // Fallback: usar métodos cross-site originais
        broadcastViaLocalStorage(notificationData);
        broadcastViaPostMessage(notificationData);
        broadcastViaBroadcastChannel(notificationData);
    }
    
    function generateNotificationId() {
        return 'notif_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
    }
    
    // =============================================
    // RECEPÇÃO E PROCESSAMENTO DE NOTIFICAÇÕES
    // =============================================
    
    function processIncomingNotification(notificationData) {
        console.log('📨 Notificação recebida:', notificationData);
        
        // Adicionar ao histórico
        state.notificationHistory.unshift({
            ...notificationData,
            receivedAt: new Date().toISOString(),
            read: false
        });
        
        // Manter apenas as últimas 50 notificações
        if (state.notificationHistory.length > 50) {
            state.notificationHistory = state.notificationHistory.slice(0, 50);
        }
        
        // Mostrar notificação baseada no tipo
        switch (notificationData.type) {
            case 'NEW_MESSAGE':
                handleNewMessageNotification(notificationData);
                break;
                
            case 'CHAT_MESSAGE':
                handleChatMessageNotification(notificationData);
                break;
                
            case 'SYSTEM_ALERT':
                handleSystemAlertNotification(notificationData);
                break;
                
            case 'TEST_MESSAGE':
                handleTestNotification(notificationData);
                break;
                
            default:
                handleGenericNotification(notificationData);
                break;
        }
        
        // Efeitos de notificação
        triggerNotificationEffects(notificationData);
        
        console.log('✅ Notificação processada');
    }
    
    function handleNewMessageNotification(data) {
        showNotificationElement({
            title: '💬 Nova Mensagem',
            message: data.message || 'Você recebeu uma nova mensagem',
            sender: data.senderName || `Usuário ${data.senderId?.substring(0, 8)}...`,
            timestamp: formatTimestamp(data.timestamp),
            type: 'message',
            autoClose: 6000
        });
        
        // Incrementar contador se não estiver no chat
        if (!state.isUserInChat) {
            state.unreadMessagesCount++;
            updateNotificationBadge();
        }
    }
    
    function handleChatMessageNotification(data) {
        showNotificationElement({
            title: '👥 Chat',
            message: data.message || 'Nova mensagem no chat',
            sender: data.senderName || 'Usuário',
            timestamp: formatTimestamp(data.timestamp),
            type: 'chat',
            autoClose: 5000
        });
    }
    
    function handleSystemAlertNotification(data) {
        showNotificationElement({
            title: '⚠️ Alerta do Sistema',
            message: data.message || 'Alerta do sistema',
            timestamp: formatTimestamp(data.timestamp),
            type: 'system',
            autoClose: 8000
        });
    }
    
    function handleTestNotification(data) {
        showNotificationElement({
            title: '🧪 Teste de Notificação',
            message: data.message || 'Teste do sistema de notificações',
            timestamp: 'Agora',
            type: 'test',
            autoClose: 4000
        });
    }
    
    function handleGenericNotification(data) {
        showNotificationElement({
            title: '📢 Notificação',
            message: data.message || 'Nova notificação',
            timestamp: formatTimestamp(data.timestamp),
            type: 'generic',
            autoClose: 5000
        });
    }
    
    function triggerNotificationEffects(notificationData) {
        // Tocar som
        if (state.notificationSoundEnabled) {
            playNotificationSound();
        }
        
        // Notificação desktop se página não está em foco
        if (state.showDesktopNotifications && document.hidden) {
            showDesktopNotification(notificationData);
        }
        
        // Atualizar badge do título
        updateTitleBadge();
        
        // Vibração (se suportada)
        if ('vibrate' in navigator) {
            navigator.vibrate(200);
        }
    }
    
    // =============================================
    // INTERFACE DE NOTIFICAÇÃO
    // =============================================
    
    function setupNotificationInterface() {
        createNotificationContainer();
        setupNotificationBadge();
        injectNotificationStyles();
    }
    
    function createNotificationContainer() {
        state.notificationContainer = document.getElementById('globalNotificationContainer');
        
        if (!state.notificationContainer) {
            state.notificationContainer = document.createElement('div');
            state.notificationContainer.id = 'globalNotificationContainer';
            state.notificationContainer.className = 'notification-container';
            
            state.notificationContainer.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                z-index: 10000;
                max-width: 400px;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                pointer-events: none;
            `;
            
            document.body.appendChild(state.notificationContainer);
        }
    }
    
    function setupNotificationBadge() {
        state.notificationBadge = document.getElementById('globalNotificationBadge');
        
        if (!state.notificationBadge) {
            state.notificationBadge = document.createElement('div');
            state.notificationBadge.id = 'globalNotificationBadge';
            state.notificationBadge.className = 'notification-badge';
            
            state.notificationBadge.style.cssText = `
                position: fixed;
                top: 15px;
                left: 15px;
                width: 24px;
                height: 24px;
                background: #ff4444;
                color: white;
                border-radius: 50%;
                display: none;
                justify-content: center;
                align-items: center;
                font-size: 12px;
                font-weight: bold;
                cursor: pointer;
                z-index: 10001;
                box-shadow: 0 2px 10px rgba(255, 68, 68, 0.3);
                pointer-events: auto;
            `;
            
            state.notificationBadge.innerHTML = `
                <span id="badgeCount">0</span>
            `;
            
            state.notificationBadge.addEventListener('click', handleBadgeClick);
            document.body.appendChild(state.notificationBadge);
        }
    }
    
    function showNotificationElement(options) {
        if (!state.notificationContainer) return;
        
        const notification = createNotificationElement(options);
        state.notificationContainer.insertBefore(notification, state.notificationContainer.firstChild);
        
        // Limitar número de notificações visíveis
        const notifications = state.notificationContainer.children;
        if (notifications.length > 5) {
            for (let i = 5; i < notifications.length; i++) {
                notifications[i].remove();
            }
        }
    }
    
    function createNotificationElement(options) {
        const {
            title,
            message,
            sender = '',
            timestamp,
            type = 'generic',
            autoClose = 5000
        } = options;
        
        const notificationId = 'notif_' + Date.now();
        const notification = document.createElement('div');
        notification.id = notificationId;
        notification.className = `notification notification-${type}`;
        
        // Estilos base
        notification.style.cssText = `
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            padding: 16px;
            margin-bottom: 10px;
            border-left: 5px solid #007bff;
            max-width: 350px;
            animation: notificationSlideIn 0.3s ease-out;
            cursor: pointer;
            transition: all 0.3s ease;
            pointer-events: auto;
            backdrop-filter: blur(10px);
        `;
        
        // Cores por tipo
        const typeColors = {
            message: '#28a745',
            chat: '#17a2b8', 
            system: '#ffc107',
            test: '#6f42c1',
            generic: '#007bff'
        };
        
        notification.style.borderLeftColor = typeColors[type] || typeColors.generic;
        
        notification.innerHTML = `
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px;">
                <strong style="flex: 1; font-size: 14px; color: #2c3e50;">${title}</strong>
                <button onclick="window.NotificationSystem.closeNotification('${notificationId}')" 
                        style="background: none; border: none; font-size: 18px; cursor: pointer; color: #95a5a6; padding: 0; margin-left: 8px; line-height: 1;">
                    ×
                </button>
            </div>
            <div style="font-size: 14px; color: #34495e; line-height: 1.4; margin-bottom: 6px;">${message}</div>
            ${sender ? `<div style="font-size: 12px; color: #7f8c8d; margin-bottom: 4px;">👤 ${sender}</div>` : ''}
            <div style="font-size: 11px; color: #bdc3c7; text-align: right;">🕒 ${timestamp}</div>
        `;
        
        // Hover effects
        notification.addEventListener('mouseenter', () => {
            notification.style.transform = 'translateY(-2px)';
            notification.style.boxShadow = '0 6px 25px rgba(0,0,0,0.2)';
        });
        
        notification.addEventListener('mouseleave', () => {
            notification.style.transform = 'translateY(0)';
            notification.style.boxShadow = '0 4px 20px rgba(0,0,0,0.15)';
        });
        
        // Auto-close
        if (autoClose > 0) {
            setTimeout(() => {
                closeNotification(notificationId);
            }, autoClose);
        }
        
        // Click para fechar
        notification.addEventListener('click', (e) => {
            if (e.target.tagName !== 'BUTTON') {
                closeNotification(notificationId);
            }
        });
        
        return notification;
    }
    
    function closeNotification(notificationId) {
        const element = document.getElementById(notificationId);
        if (element) {
            element.style.animation = 'notificationSlideOut 0.3s ease-in forwards';
            setTimeout(() => {
                if (element.parentNode) {
                    element.remove();
                }
            }, 300);
        }
    }
    
    function updateNotificationBadge() {
        if (!state.notificationBadge) return;
        
        const badgeCount = document.getElementById('badgeCount');
        if (badgeCount) {
            badgeCount.textContent = state.unreadMessagesCount > 9 ? '9+' : state.unreadMessagesCount;
        }
        
        if (state.unreadMessagesCount > 0 && !state.isUserInChat) {
            state.notificationBadge.style.display = 'flex';
            
            // Animação de pulsar para novas mensagens
            state.notificationBadge.style.animation = 'badgePulse 2s infinite';
        } else {
            state.notificationBadge.style.display = 'none';
            state.notificationBadge.style.animation = 'none';
        }
        
        updateTitleBadge();
    }
    
    function updateTitleBadge() {
        const baseTitle = document.title.replace(/^\(\d+\)\s*/, '');
        
        if (state.unreadMessagesCount > 0 && !state.isUserInChat) {
            document.title = `(${state.unreadMessagesCount}) ${baseTitle}`;
        } else {
            document.title = baseTitle;
        }
    }
    
    function handleBadgeClick() {
        // Marcar todas como lidas
        state.unreadMessagesCount = 0;
        updateNotificationBadge();
        
        // Mostrar histórico se disponível
        if (state.notificationHistory.length > 0) {
            showNotificationHistory();
        }
    }
    
    function showNotificationHistory() {
        // Implementação básica do histórico
        alert(`Você tem ${state.notificationHistory.length} notificações no histórico.`);
    }
    
    // =============================================
    // EFEITOS E UTILITÁRIOS
    // =============================================
    
    function playNotificationSound() {
        try {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = 800;
            oscillator.type = 'sine';
            
            gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.3);
        } catch (error) {
            console.log('🔇 Audio não disponível');
        }
    }
    
    function showDesktopNotification(notificationData) {
        if (!('Notification' in window)) return;
        
        if (Notification.permission === 'granted') {
            const title = getNotificationTitle(notificationData);
            const options = {
                body: notificationData.message,
                icon: '/favicon.ico',
                badge: '/favicon.ico',
                tag: 'firebase_notification'
            };
            
            new Notification(title, options);
        } else if (Notification.permission === 'default') {
            Notification.requestPermission();
        }
    }
    
    function getNotificationTitle(notificationData) {
        const titles = {
            'NEW_MESSAGE': '💬 Nova Mensagem',
            'CHAT_MESSAGE': '👥 Chat',
            'SYSTEM_ALERT': '⚠️ Alerta',
            'TEST_MESSAGE': '🧪 Teste',
            'default': '📢 Notificação'
        };
        
        return titles[notificationData.type] || titles.default;
    }
    
    function formatTimestamp(timestamp) {
        if (!timestamp) return 'Agora';
        
        const date = new Date(timestamp);
        const now = new Date();
        const diff = now - date;
        
        if (diff < 60000) return 'Agora';
        if (diff < 3600000) return `${Math.floor(diff / 60000)} min atrás`;
        
        return date.toLocaleTimeString('pt-BR', { 
            hour: '2-digit', 
            minute: '2-digit' 
        });
    }
    
    function showSystemNotification(message, type = 'info') {
        const types = {
            'success': { title: '✅ Sucesso', color: '#28a745' },
            'error': { title: '❌ Erro', color: '#dc3545' },
            'warning': { title: '⚠️ Aviso', color: '#ffc107' },
            'info': { title: 'ℹ️ Info', color: '#17a2b8' }
        };
        
        const config = types[type] || types.info;
        
        showNotificationElement({
            title: config.title,
            message: message,
            timestamp: 'Sistema',
            type: 'system',
            autoClose: 5000
        });
    }
    
    // =============================================
    // FALLBACK SYSTEM (quando Firebase falha)
    // =============================================
    
    function setupFallbackSystem() {
        console.log('🔄 Usando sistema fallback');
        
        // Métodos cross-site originais
        setupCrossSiteListeners();
    }
    
    function setupCrossSiteListeners() {
        window.addEventListener('storage', handleStorageNotification);
        window.addEventListener('message', handlePostMessageNotification);
        setupBroadcastChannelListener();
    }
    
    function handleStorageNotification(e) {
        if (e.key === 'crossSiteChatNotification' && e.newValue) {
            try {
                const notification = JSON.parse(e.newValue);
                if (notification.source === 'chat_app') {
                    processIncomingNotification(notification.data);
                }
            } catch (error) {
                console.log('❌ Erro no fallback localStorage');
            }
        }
    }
    
    function handlePostMessageNotification(event) {
        if (event.data?.type === 'CHAT_NOTIFICATION' && event.data.source === 'chat_app') {
            processIncomingNotification(event.data.data);
        }
    }
    
    function setupBroadcastChannelListener() {
        if ('BroadcastChannel' in window) {
            const channel = new BroadcastChannel('chat_notifications');
            channel.addEventListener('message', (event) => {
                if (event.data?.type === 'CHAT_NOTIFICATION' && event.data.source === 'chat_app') {
                    processIncomingNotification(event.data.data);
                }
            });
        }
    }
    
    function broadcastViaLocalStorage(data) {
        try {
            localStorage.setItem('crossSiteChatNotification', JSON.stringify({
                id: 'fallback_' + Date.now(),
                data: data,
                timestamp: Date.now(),
                source: 'chat_app'
            }));
            setTimeout(() => localStorage.removeItem('crossSiteChatNotification'), 5000);
        } catch (error) {
            console.log('❌ Fallback localStorage falhou');
        }
    }
    
    function broadcastViaPostMessage(data) {
        try {
            window.parent.postMessage({
                type: 'CHAT_NOTIFICATION',
                data: data,
                source: 'chat_app'
            }, '*');
        } catch (error) {
            // Ignorar erro
        }
    }
    
    function broadcastViaBroadcastChannel(data) {
        try {
            if ('BroadcastChannel' in window) {
                const channel = new BroadcastChannel('chat_notifications');
                channel.postMessage({
                    type: 'CHAT_NOTIFICATION',
                    data: data,
                    source: 'chat_app'
                });
            }
        } catch (error) {
            // Ignorar erro
        }
    }
    
    // =============================================
    // EVENT LISTENERS E CONTROLE DE PRESENÇA
    // =============================================
    
    function setupEventListeners() {
        document.addEventListener('visibilitychange', handleVisibilityChange);
        window.addEventListener('focus', handleWindowFocus);
        window.addEventListener('blur', handleWindowBlur);
        
        // Observar elemento do chat se existir
        observeChatElement();
    }
    
    function handleVisibilityChange() {
        state.isUserInChat = !document.hidden && isUserInChatContext();
        updateNotificationBadge();
    }
    
    function handleWindowFocus() {
        state.isUserInChat = isUserInChatContext();
        updateNotificationBadge();
    }
    
    function handleWindowBlur() {
        state.isUserInChat = false;
    }
    
    function isUserInChatContext() {
        // Verificar se usuário está em contexto de chat
        const chatContainer = document.getElementById('chatContainer');
        const conversationTab = document.getElementById('conversationTab');
        
        if (chatContainer && conversationTab) {
            return chatContainer.classList.contains('active') && 
                   conversationTab.classList.contains('active') &&
                   document.hasFocus();
        }
        
        return document.hasFocus();
    }
    
    function observeChatElement() {
        const chatContainer = document.getElementById('chatContainer');
        if (chatContainer) {
            const observer = new MutationObserver(() => {
                state.isUserInChat = isUserInChatContext();
                updateNotificationBadge();
            });
            observer.observe(chatContainer, { attributes: true, attributeFilter: ['class'] });
        }
    }
    
    function injectNotificationStyles() {
        const style = document.createElement('style');
        style.textContent = `
            @keyframes notificationSlideIn {
                from {
                    transform: translateX(100%);
                    opacity: 0;
                }
                to {
                    transform: translateX(0);
                    opacity: 1;
                }
            }
            
            @keyframes notificationSlideOut {
                from {
                    transform: translateX(0);
                    opacity: 1;
                }
                to {
                    transform: translateX(100%);
                    opacity: 0;
                }
            }
            
            @keyframes badgePulse {
                0% { transform: scale(1); }
                50% { transform: scale(1.1); }
                100% { transform: scale(1); }
            }
            
            .notification-badge:hover {
                transform: scale(1.15) !important;
                transition: transform 0.2s ease;
            }
        `;
        document.head.appendChild(style);
    }
    
    // =============================================
    // API PÚBLICA
    // =============================================
    
    window.NotificationSystem = {
        // Inicialização
        init: initializeNotificationSystem,
        
        // Envio de notificações
        sendNotification: sendNotification,
        sendTest: function() {
            sendNotification({
                type: 'TEST_MESSAGE',
                message: 'Esta é uma notificação de teste do sistema unificado!',
                site: window.location.hostname
            });
        },
        sendMessage: function(message, type = 'NEW_MESSAGE') {
            sendNotification({
                type: type,
                message: message,
                site: window.location.hostname
            });
        },
        
        // Controle de notificações
        clearAll: function() {
            if (state.notificationContainer) {
                state.notificationContainer.innerHTML = '';
            }
            state.unreadMessagesCount = 0;
            state.notificationHistory = [];
            updateNotificationBadge();
        },
        
        closeNotification: closeNotification,
        
        // Configurações
        enableSound: function() { state.notificationSoundEnabled = true; },
        disableSound: function() { state.notificationSoundEnabled = false; },
        enableDesktop: function() { state.showDesktopNotifications = true; },
        disableDesktop: function() { state.showDesktopNotifications = false; },
        
        // Informações
        getHistory: function() { return [...state.notificationHistory]; },
        getUnreadCount: function() { return state.unreadMessagesCount; },
        getStatus: function() { 
            return {
                initialized: state.isInitialized,
                firebaseConnected: !!state.database,
                user: state.currentUser,
                unreadCount: state.unreadMessagesCount
            };
        }
    };
    
    // Inicialização automática
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initializeNotificationSystem);
    } else {
        setTimeout(initializeNotificationSystem, 1000);
    }
    
    console.log('🎉 Sistema unificado Firebase carregado!');
    
})();
</script>
