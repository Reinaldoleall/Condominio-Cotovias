<script>
// =============================================
// RECEPTOR DE NOTIFICAÇÕES DO CHAT
// =============================================
(function() {
    'use strict';
    
    let notificationCount = 0;
    let lastNotification = null;
    let widgetTimeout = null;
    
    const widget = document.getElementById('chatNotificationWidget');
    const badge = document.getElementById('chatNotificationBadge');
    
    function initializeNotificationReceiver() {
        console.log('🎧 Iniciando receptor de notificações do chat...');
        
        // Método 1: Escutar localStorage
        setupLocalStorageListener();
        
        // Método 2: Escutar postMessage
        setupPostMessageListener();
        
        // Método 3: Escutar BroadcastChannel
        setupBroadcastChannelListener();
        
        // Método 4: Polling como fallback
        setupPollingListener();
        
        console.log('✅ Receptor de notificações ativo');
    }
    
    function setupLocalStorageListener() {
        window.addEventListener('storage', (e) => {
            if (e.key === 'crossSiteChatNotification' && e.newValue) {
                try {
                    const notification = JSON.parse(e.newValue);
                    if (notification.source === 'chat_app') {
                        handleIncomingNotification(notification.data);
                    }
                } catch (error) {
                    console.log('❌ Erro ao processar localStorage notification');
                }
            }
        });
    }
    
    function setupPostMessageListener() {
        window.addEventListener('message', (event) => {
            // Verificar se a mensagem é do nosso sistema
            if (event.data && event.data.type === 'CHAT_NOTIFICATION' && event.data.source === 'chat_app') {
                handleIncomingNotification(event.data.data);
            }
        });
    }
    
    function setupBroadcastChannelListener() {
        if ('BroadcastChannel' in window) {
            try {
                const channel = new BroadcastChannel('chat_notifications');
                channel.addEventListener('message', (event) => {
                    if (event.data && event.data.type === 'CHAT_NOTIFICATION') {
                        handleIncomingNotification(event.data.data);
                    }
                });
            } catch (error) {
                console.log('❌ BroadcastChannel não disponível');
            }
        }
    }
    
    function setupPollingListener() {
        // Polling a cada 3 segundos como fallback
        setInterval(() => {
            try {
                const stored = localStorage.getItem('crossSiteChatNotification');
                if (stored) {
                    const notification = JSON.parse(stored);
                    if (notification.source === 'chat_app' && 
                        notification.timestamp > (Date.now() - 10000)) { // Últimos 10 segundos
                        handleIncomingNotification(notification.data);
                    }
                }
            } catch (error) {
                // Ignorar erros
            }
        }, 3000);
    }
    
    function handleIncomingNotification(notificationData) {
        console.log('📨 Notificação recebida:', notificationData);
        
        notificationCount++;
        lastNotification = notificationData;
        
        // Mostrar badge
        showNotificationBadge();
        
        // Mostrar widget automaticamente (apenas primeira notificação)
        if (notificationCount === 1) {
            showNotificationWidget();
        }
        
        // Atualizar título da página
        updatePageTitle();
    }
    
    function showNotificationBadge() {
        if (!badge) return;
        
        const badgeCount = document.getElementById('badgeCount');
        if (badgeCount) {
            badgeCount.textContent = notificationCount > 9 ? '9+' : notificationCount;
        }
        
        badge.style.display = 'flex';
    }
    
    function hideNotificationBadge() {
        if (!badge) return;
        badge.style.display = 'none';
        notificationCount = 0;
        updatePageTitle();
    }
    
    function showNotificationWidget() {
        if (!widget || !lastNotification) return;
        
        // Atualizar conteúdo do widget
        document.getElementById('notificationTitle').textContent = getNotificationTitle(lastNotification);
        document.getElementById('notificationMessage').textContent = lastNotification.message || 'Nova mensagem';
        document.getElementById('notificationTime').textContent = formatTime(lastNotification.timestamp);
        
        // Mostrar widget
        widget.style.display = 'flex';
        
        // Auto-esconder após 8 segundos
        clearTimeout(widgetTimeout);
        widgetTimeout = setTimeout(hideNotificationWidget, 8000);
    }
    
    function hideNotificationWidget() {
        if (!widget) return;
        widget.style.display = 'none';
    }
    
    function getNotificationTitle(notification) {
        switch(notification.type) {
            case 'NEW_MESSAGE':
                return '💬 Nova Mensagem';
            case 'INCOMING_CALL':
                return '📞 Chamada Recebida';
            default:
                return '🔔 Notificação';
        }
    }
    
    function formatTime(timestamp) {
        const now = Date.now();
        const diff = now - timestamp;
        
        if (diff < 60000) return 'Agora mesmo';
        if (diff < 3600000) return `${Math.floor(diff / 60000)} min atrás`;
        
        const date = new Date(timestamp);
        return date.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    }
    
    function updatePageTitle() {
        const baseTitle = document.title.replace(/^\(\d+\)\s*/, '') || 'Meu Site';
        
        if (notificationCount > 0) {
            document.title = `(${notificationCount}) ${baseTitle}`;
        } else {
            document.title = baseTitle;
        }
    }
    
    // Funções globais para controle
    window.showNotificationWidget = showNotificationWidget;
    window.hideNotificationWidget = hideNotificationWidget;
    
    // Teste manual
    window.testChatNotification = function() {
        handleIncomingNotification({
            type: 'NEW_MESSAGE',
            message: 'Esta é uma mensagem de teste do sistema de notificações!',
            timestamp: Date.now()
        });
    };
    
    // Inicializar automaticamente
    document.addEventListener('DOMContentLoaded', initializeNotificationReceiver);
    
    console.log('🎉 Receptor de notificações do chat carregado!');
    
})();
            </script>

            authDomain: "rifalidiane-fde3b.firebaseapp.com",

            messagingSenderId: "649359518677",

        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        function getOrGenerateUserId() {
            let userId = localStorage.getItem('uniqueUserId');
            if (!userId) {
                userId = 'user-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('uniqueUserId', userId);
            }
            return userId;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const ui = {
                loading: document.getElementById('loading'),
                contentFrame: document.getElementById('contentFrame'),
                menuItems: document.querySelectorAll('.nav-item')
            };

            const setActiveMenuItem = (pageUrl) => {
                ui.menuItems.forEach(item => {
                    item.classList.toggle('active', item.dataset.page === pageUrl);
                });
            };
            
            const loadPage = (pageUrl, title) => {
                ui.loading.style.display = 'flex';
                document.title = `${title} | Condomínio Cotovias`;
                const currentSrc = ui.contentFrame.src.split('/').pop();
                if (currentSrc !== pageUrl) {
                    ui.contentFrame.src = pageUrl;
                } else {
                     ui.loading.style.display = 'none';
                }
                ui.contentFrame.onload = () => {
                    ui.loading.style.display = 'none';
                };
                setActiveMenuItem(pageUrl);
            };
            
            // Função genérica para solicitar acesso
            const requestAccess = async (accessType) => {
                const userId = getOrGenerateUserId();
                const dbPath = accessType === 'admin' ? 'admins/' : 'users/';
                const pageUrl = accessType === 'admin' ? 'admin.html' : 'criarlojas.html';
                const pageTitle = accessType === 'admin' ? 'Administração' : 'Criar Loja';
                const requestText = accessType === 'admin' ? 'acesso de Administrador' : 'acesso para criar uma loja';
                
                ui.loading.style.display = 'flex';
                
                try {
                    const snapshot = await database.ref(dbPath + userId).once('value');
                    const userData = snapshot.val();

                    if (userData && userData.status === 'active') {
                        loadPage(pageUrl, pageTitle);
                    } else {
                        if (!userData) {
                            await database.ref(dbPath + userId).set({
                                status: 'pending',
                                requestedAt: new Date().toISOString()
                            });
                        }
                        
                        const numeroWhatsApp = '5521987715733';
                        const mensagem = `Olá! Gostaria de solicitar ${requestText}. Meu ID de solicitação é: ${userId}`;
                        const urlWhatsApp = `https://wa.me/${numeroWhatsApp}?text=${encodeURIComponent(mensagem)}`;

                        alert(`Para obter ${requestText}, solicite a liberação.\n\nSeu ID de Solicitação é: ${userId}\n\nVocê será redirecionado para o WhatsApp.`);
                        window.open(urlWhatsApp, '_blank');
                        ui.loading.style.display = 'none';
                    }
                } catch (error) {
                    console.error("Erro ao verificar status:", error);
                    alert("Ocorreu um erro. Tente novamente.");
                    ui.loading.style.display = 'none';
                }
            };
            
            // --- EVENT LISTENERS ATUALIZADOS ---
            ui.menuItems.forEach(item => {
                const page = item.dataset.page;

                if (page === 'admin.html') {
                    // Botão Admin agora solicita acesso
                    item.addEventListener('click', () => requestAccess('admin'));
                } else if (page === 'criarlojas.html') {
                    // Botão Criar Loja solicita acesso de usuário
                    item.addEventListener('click', () => requestAccess('user'));
                } else {
                    // Comportamento padrão para outros botões
                    item.addEventListener('click', () => {
                        loadPage(item.dataset.page, item.dataset.title);
                    });
                }
            });

            // --- INICIALIZAÇÃO ---
            const initialItem = document.querySelector('.nav-item');
            if (initialItem) {
                 loadPage(initialItem.dataset.page, initialItem.dataset.title);
            }
        });
    </script>
