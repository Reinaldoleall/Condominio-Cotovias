<script>
// =============================================
// SISTEMA DE NOTIFICAÇÕES PERSONALIZADAS POR USUÁRIO
// Para colocar no OUTRO site que vai receber notificações
// =============================================
(function() {
    'use strict';
    
    const config = {
        firebaseConfig: {
            apiKey: "AIzaSyByyM8RvGNM5pyrQIQ7nCH6mmgYAIpq0bc",
            authDomain: "rifas-c414b.firebaseapp.com",
            databaseURL: "https://rifas-c414b-default-rtdb.firebaseio.com",
            projectId: "rifas-c414b",
            storageBucket: "rifas-c414b.appspot.com",
            messagingSenderId: "770195193538",
            appId: "1:770195193538:web:48e585ac5661d27f3dc55b"
        },
        currentUser: null,
        isInitialized: false,
        notificationContainer: null,
        notificationSoundEnabled: true
    };
    
    // Inicialização do sistema
    function initializeUserNotificationSystem() {
        if (config.isInitialized) return;
        
        console.log('🔔 Iniciando sistema de notificações personalizadas...');
        
        try {
            // Inicializar Firebase
            initializeFirebase();
            
            // Criar container de notificações
            createNotificationContainer();
            
            // Configurar listeners
            setupNotificationListeners();
            
            // Injetar estilos
            injectNotificationStyles();
            
            config.isInitialized = true;
            
            showWelcomeNotification();
            
        } catch (error) {
            console.error('❌ Erro na inicialização:', error);
        }
    }
    
    function initializeFirebase() {
        try {
            // Inicializar Firebase
            firebase.initializeApp(config.firebaseConfig);
            config.database = firebase.database();
            config.auth = firebase.auth();
            
            console.log('✅ Firebase inicializado no site receptor');
            
            // Autenticação anônima
            setupAnonymousAuth();
            
        } catch (error) {
            console.error('❌ Erro ao inicializar Firebase:', error);
        }
    }
    
    function setupAnonymousAuth() {
        config.auth.signInAnonymously()
            .then(() => {
                console.log('✅ Autenticação anônima realizada');
            })
            .catch(error => {
                console.error('❌ Erro na autenticação:', error);
            });
        
        config.auth.onAuthStateChanged((user) => {
            config.currentUser = user;
            if (user) {
                console.log('👤 Usuário receptor:', user.uid);
                startListeningForUserNotifications();
            }
        });
    }
    
    // 🎯 FUNÇÃO PRINCIPAL: Escutar notificações específicas do usuário
    function startListeningForUserNotifications() {
        if (!config.database || !config.currentUser) return;
        
        console.log('👂 Escutando notificações para usuário:', config.currentUser.uid);
        
        // Referência para notificações do usuário atual
        const userNotificationsRef = config.database.ref(`user_notifications/${config.currentUser.uid}`);
        
        // Escutar novas notificações
        userNotificationsRef.orderByChild('timestamp').limitToLast(10).on('child_added', (snapshot) => {
            const notification = snapshot.val();
            
            if (notification && shouldShowNotification(notification)) {
                console.log('📨 Notificação pessoal recebida:', notification);
                
                // Mostrar notificação
                showPersonalNotification(notification);
                
                // Tocar som
                if (config.notificationSoundEnabled) {
                    playNotificationSound();
                }
                
                // Marcar como visualizada (opcional)
                markNotificationAsSeen(snapshot.key);
            }
        });
    }
    
    function shouldShowNotification(notification) {
        // Verificar se é recente (últimos 5 minutos)
        const isRecent = Date.now() - notification.timestamp < 5 * 60 * 1000;
        
        // Verificar se não é do próprio usuário
        const isNotOwn = notification.senderId !== config.currentUser.uid;
        
        return isRecent && isNotOwn;
    }
    
    function showPersonalNotification(notification) {
        const notificationData = {
            title: getNotificationTitle(notification.type),
            message: notification.message || 'Você tem uma nova mensagem',
            sender: notification.senderName || `Usuário ${notification.senderId?.substring(0, 8)}...`,
            timestamp: formatTimestamp(notification.timestamp),
            type: 'personal',
            conversationId: notification.conversationId,
            autoClose: 8000
        };
        
        showNotificationElement(notificationData);
        
        // Se a página não está em foco, mostrar notificação desktop
        if (document.hidden) {
            showDesktopNotification(notificationData);
            updateTitleBadge();
        }
    }
    
    function getNotificationTitle(type) {
        const titles = {
            'NEW_MESSAGE': '💬 Nova Mensagem',
            'CHAT_MESSAGE': '👥 Mensagem no Chat', 
            'CALL_MISSED': '📞 Chamada Perdida',
            'SYSTEM_ALERT': '⚠️ Alerta do Sistema',
            'default': '📢 Nova Notificação'
        };
        
        return titles[type] || titles.default;
    }
    
    function markNotificationAsSeen(notificationId) {
        // Opcional: marcar como vista no Firebase
        setTimeout(() => {
            config.database.ref(`user_notifications/${config.currentUser.uid}/${notificationId}`).remove()
                .then(() => console.log('✅ Notificação removida'))
                .catch(error => console.error('❌ Erro ao remover notificação:', error));
        }, 10000); // Remover após 10 segundos
    }
    
    // =============================================
    // INTERFACE DE NOTIFICAÇÕES
    // =============================================
    
    function createNotificationContainer() {
        config.notificationContainer = document.getElementById('userNotificationContainer');
        
        if (!config.notificationContainer) {
            config.notificationContainer = document.createElement('div');
            config.notificationContainer.id = 'userNotificationContainer';
            config.notificationContainer.className = 'user-notification-container';
            
            config.notificationContainer.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                z-index: 10000;
                max-width: 400px;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                pointer-events: none;
            `;
            
            document.body.appendChild(config.notificationContainer);
        }
    }
    
    function showNotificationElement(options) {
        if (!config.notificationContainer) return;
        
        const notification = createNotificationElement(options);
        config.notificationContainer.insertBefore(notification, config.notificationContainer.firstChild);
        
        // Limitar a 5 notificações visíveis
        const notifications = config.notificationContainer.children;
        if (notifications.length > 5) {
            for (let i = 5; i < notifications.length; i++) {
                notifications[i].remove();
            }
        }
    }
    
    function createNotificationElement(options) {
        const {
            title,
            message,
            sender = '',
            timestamp,
            type = 'personal',
            autoClose = 8000,
            conversationId = null
        } = options;
        
        const notificationId = 'user_notif_' + Date.now();
        const notification = document.createElement('div');
        notification.id = notificationId;
        notification.className = `user-notification notification-${type}`;
        
        // Estilos da notificação
        notification.style.cssText = `
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            padding: 16px;
            margin-bottom: 10px;
            max-width: 350px;
            animation: userNotificationSlideIn 0.4s ease-out;
            cursor: pointer;
            transition: all 0.3s ease;
            pointer-events: auto;
            border-left: 4px solid #ff6b6b;
        `;
        
        notification.innerHTML = `
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px;">
                <strong style="flex: 1; font-size: 15px; color: white;">${title}</strong>
                <button onclick="window.UserNotificationSystem.closeNotification('${notificationId}')" 
                        style="background: rgba(255,255,255,0.2); border: none; font-size: 18px; cursor: pointer; color: white; padding: 2px 6px; border-radius: 50%; line-height: 1;">
                    ×
                </button>
            </div>
            <div style="font-size: 14px; line-height: 1.4; margin-bottom: 6px; opacity: 0.95;">${message}</div>
            ${sender ? `<div style="font-size: 12px; opacity: 0.8; margin-bottom: 4px;">👤 De: ${sender}</div>` : ''}
            <div style="font-size: 11px; opacity: 0.7; text-align: right;">🕒 ${timestamp}</div>
        `;
        
        // Efeitos de hover
        notification.addEventListener('mouseenter', () => {
            notification.style.transform = 'translateY(-2px) scale(1.02)';
            notification.style.boxShadow = '0 12px 35px rgba(0,0,0,0.4)';
        });
        
        notification.addEventListener('mouseleave', () => {
            notification.style.transform = 'translateY(0) scale(1)';
            notification.style.boxShadow = '0 8px 25px rgba(0,0,0,0.3)';
        });
        
        // Click para abrir o chat (se tiver conversationId)
        notification.addEventListener('click', () => {
            if (conversationId) {
                openChatFromNotification(conversationId);
            }
            closeNotification(notificationId);
        });
        
        // Auto-close
        if (autoClose > 0) {
            setTimeout(() => {
                closeNotification(notificationId);
            }, autoClose);
        }
        
        return notification;
    }
    
    function closeNotification(notificationId) {
        const element = document.getElementById(notificationId);
        if (element) {
            element.style.animation = 'userNotificationSlideOut 0.3s ease-in forwards';
            setTimeout(() => {
                if (element.parentNode) {
                    element.remove();
                }
            }, 300);
        }
    }
    
    function openChatFromNotification(conversationId) {
        console.log('🎯 Abrindo chat da notificação:', conversationId);
        
        // Aqui você pode implementar a lógica para abrir o chat
        // Por exemplo, redirecionar para a página do chat ou abrir um modal
        
        showNotification('Abrindo conversa...', 'info');
        
        // Exemplo: abrir em nova aba (ajuste a URL conforme seu sistema)
        // window.open(`/chat?conversation=${conversationId}`, '_blank');
    }
    
    // =============================================
    // EFEITOS E UTILITÁRIOS
    // =============================================
    
    function playNotificationSound() {
        try {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            // Som mais suave para notificações
            oscillator.frequency.value = 600;
            oscillator.type = 'sine';
            
            gainNode.gain.setValueAtTime(0.15, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.4);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.4);
        } catch (error) {
            console.log('🔇 Audio não disponível');
        }
    }
    
    function showDesktopNotification(notificationData) {
        if (!('Notification' in window)) return;
        
        if (Notification.permission === 'granted') {
            const notification = new Notification(notificationData.title, {
                body: notificationData.message,
                icon: '/favicon.ico',
                badge: '/favicon.ico',
                tag: 'user_notification',
                requireInteraction: true
            });
            
            notification.onclick = function() {
                window.focus();
                if (notificationData.conversationId) {
                    openChatFromNotification(notificationData.conversationId);
                }
                notification.close();
            };
        } else if (Notification.permission === 'default') {
            Notification.requestPermission();
        }
    }
    
    function updateTitleBadge() {
        const baseTitle = document.title.replace(/^\(\d+\)\s*/, '');
        document.title = `(1) ${baseTitle}`;
        
        // Remover badge após 30 segundos se ainda estiver lá
        setTimeout(() => {
            if (document.title.startsWith('(1)')) {
                document.title = baseTitle;
            }
        }, 30000);
    }
    
    function formatTimestamp(timestamp) {
        if (!timestamp) return 'Agora';
        
        const date = new Date(timestamp);
        const now = new Date();
        const diff = now - date;
        
        if (diff < 60000) return 'Agora';
        if (diff < 3600000) return `${Math.floor(diff / 60000)} min atrás`;
        
        return date.toLocaleTimeString('pt-BR', { 
            hour: '2-digit', 
            minute: '2-digit' 
        });
    }
    
    function showWelcomeNotification() {
        showNotificationElement({
            title: '🔔 Notificações Ativas',
            message: 'Você receberá notificações quando alguém enviar mensagens para você!',
            timestamp: 'Sistema',
            type: 'system',
            autoClose: 6000
        });
    }
    
    function showNotification(message, type = 'info') {
        // Notificação simples no console
        console.log(`📢 ${type.toUpperCase()}: ${message}`);
    }
    
    // =============================================
    // CONFIGURAÇÃO DE EVENTOS
    // =============================================
    
    function setupNotificationListeners() {
        // Visibilidade da página
        document.addEventListener('visibilitychange', handlePageVisibility);
        
        // Foco da janela
        window.addEventListener('focus', handleWindowFocus);
    }
    
    function handlePageVisibility() {
        if (!document.hidden) {
            // Quando a página fica visível, limpar badge do título
            document.title = document.title.replace(/^\(\d+\)\s*/, '');
        }
    }
    
    function handleWindowFocus() {
        // Limpar badge quando a janela recebe foco
        document.title = document.title.replace(/^\(\d+\)\s*/, '');
    }
    
    function injectNotificationStyles() {
        const style = document.createElement('style');
        style.textContent = `
            @keyframes userNotificationSlideIn {
                from {
                    transform: translateX(100%) scale(0.8);
                    opacity: 0;
                }
                to {
                    transform: translateX(0) scale(1);
                    opacity: 1;
                }
            }
            
            @keyframes userNotificationSlideOut {
                from {
                    transform: translateX(0) scale(1);
                    opacity: 1;
                }
                to {
                    transform: translateX(100%) scale(0.8);
                    opacity: 0;
                }
            }
            
            .user-notification:hover {
                transform: translateY(-2px) scale(1.02) !important;
                box-shadow: 0 12px 35px rgba(0,0,0,0.4) !important;
            }
        `;
        document.head.appendChild(style);
    }
    
    // =============================================
    // API PÚBLICA
    // =============================================
    
    window.UserNotificationSystem = {
        // Inicialização
        init: initializeUserNotificationSystem,
        
        // Controle de notificações
        closeNotification: closeNotification,
        clearAll: function() {
            if (config.notificationContainer) {
                config.notificationContainer.innerHTML = '';
            }
            document.title = document.title.replace(/^\(\d+\)\s*/, '');
        },
        
        // Configurações
        enableSound: function() { config.notificationSoundEnabled = true; },
        disableSound: function() { config.notificationSoundEnabled = false; },
        
        // Teste
        testNotification: function() {
            showNotificationElement({
                title: '🧪 Teste de Notificação',
                message: 'Esta é uma notificação de teste do sistema personalizado!',
                sender: 'Sistema de Teste',
                timestamp: 'Agora',
                type: 'test',
                autoClose: 5000
            });
        },
        
        // Informações
        getStatus: function() {
            return {
                initialized: config.isInitialized,
                user: config.currentUser,
                soundEnabled: config.notificationSoundEnabled
            };
        }
    };
    
    // =============================================
    // INICIALIZAÇÃO AUTOMÁTICA
    // =============================================
    
    // Inicializar quando o DOM estiver pronto
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initializeUserNotificationSystem);
    } else {
        setTimeout(initializeUserNotificationSystem, 1000);
    }
    
    console.log('🎉 Sistema de notificações personalizadas carregado!');
    
})();
</script>

        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        function getOrGenerateUserId() {
            let userId = localStorage.getItem('uniqueUserId');
            if (!userId) {
                userId = 'user-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('uniqueUserId', userId);
            }
            return userId;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const ui = {
                loading: document.getElementById('loading'),
                contentFrame: document.getElementById('contentFrame'),
                menuItems: document.querySelectorAll('.nav-item')
            };

            const setActiveMenuItem = (pageUrl) => {
                ui.menuItems.forEach(item => {
                    item.classList.toggle('active', item.dataset.page === pageUrl);
                });
            };
            
            const loadPage = (pageUrl, title) => {
                ui.loading.style.display = 'flex';
                document.title = `${title} | Condomínio Cotovias`;
                const currentSrc = ui.contentFrame.src.split('/').pop();
                if (currentSrc !== pageUrl) {
                    ui.contentFrame.src = pageUrl;
                } else {
                     ui.loading.style.display = 'none';
                }
                ui.contentFrame.onload = () => {
                    ui.loading.style.display = 'none';
                };
                setActiveMenuItem(pageUrl);
            };
            
            // Função genérica para solicitar acesso
            const requestAccess = async (accessType) => {
                const userId = getOrGenerateUserId();
                const dbPath = accessType === 'admin' ? 'admins/' : 'users/';
                const pageUrl = accessType === 'admin' ? 'admin.html' : 'criarlojas.html';
                const pageTitle = accessType === 'admin' ? 'Administração' : 'Criar Loja';
                const requestText = accessType === 'admin' ? 'acesso de Administrador' : 'acesso para criar uma loja';
                
                ui.loading.style.display = 'flex';
                
                try {
                    const snapshot = await database.ref(dbPath + userId).once('value');
                    const userData = snapshot.val();

                    if (userData && userData.status === 'active') {
                        loadPage(pageUrl, pageTitle);
                    } else {
                        if (!userData) {
                            await database.ref(dbPath + userId).set({
                                status: 'pending',
                                requestedAt: new Date().toISOString()
                            });
                        }
                        
                        const numeroWhatsApp = '5521987715733';
                        const mensagem = `Olá! Gostaria de solicitar ${requestText}. Meu ID de solicitação é: ${userId}`;
                        const urlWhatsApp = `https://wa.me/${numeroWhatsApp}?text=${encodeURIComponent(mensagem)}`;

                        alert(`Para obter ${requestText}, solicite a liberação.\n\nSeu ID de Solicitação é: ${userId}\n\nVocê será redirecionado para o WhatsApp.`);
                        window.open(urlWhatsApp, '_blank');
                        ui.loading.style.display = 'none';
                    }
                } catch (error) {
                    console.error("Erro ao verificar status:", error);
                    alert("Ocorreu um erro. Tente novamente.");
                    ui.loading.style.display = 'none';
                }
            };
            
            // --- EVENT LISTENERS ATUALIZADOS ---
            ui.menuItems.forEach(item => {
                const page = item.dataset.page;

                if (page === 'admin.html') {
                    // Botão Admin agora solicita acesso
                    item.addEventListener('click', () => requestAccess('admin'));
                } else if (page === 'criarlojas.html') {
                    // Botão Criar Loja solicita acesso de usuário
                    item.addEventListener('click', () => requestAccess('user'));
                } else {
                    // Comportamento padrão para outros botões
                    item.addEventListener('click', () => {
                        loadPage(item.dataset.page, item.dataset.title);
                    });
                }
            });

            // --- INICIALIZAÇÃO ---
            const initialItem = document.querySelector('.nav-item');
            if (initialItem) {
                 loadPage(initialItem.dataset.page, initialItem.dataset.title);
            }
        });
    </script>
