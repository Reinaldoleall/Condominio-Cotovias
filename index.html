<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#4A90E2">

    <title>Condomínio Cotovias</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#EBF3FE',
                            100: '#D7E8FD',
                            200: '#B0D1FB',
                            300: '#88B9F8',
                            400: '#61A2F6',
                            500: '#4A90E2',
                            600: '#3A73B5',
                            700: '#2B5688',
                            800: '#1D3A5A',
                            900: '#0E1D2D',
                        },
                        dark: {
                            100: '#1E1E2F',
                            200: '#16162A',
                            300: '#0F0F1A',
                        }
                    },
                    fontFamily: {
                        'inter': ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'float': 'float 3s ease-in-out infinite',
                        'slide-up': 'slideUp 0.4s ease-out',
                        'slide-down': 'slideDown 0.3s ease-out',
                        'scale-in': 'scaleIn 0.2s ease-out',
                        'pulse-slow': 'pulse 2s infinite',
                        'spin-slow': 'spin 1s linear infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-5px)' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        slideDown: {
                            '0%': { opacity: '0', transform: 'translateY(-20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        scaleIn: {
                            '0%': { opacity: '0', transform: 'scale(0.95)' },
                            '100%': { opacity: '1', transform: 'scale(1)' },
                        },
                    },
                },
            },
        }
    </script>
    
    <style>
        /* Estilos customizados */
        * {
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: linear-gradient(135deg, #F7F8FC 0%, #EEF2F7 100%);
            font-family: 'Inter', sans-serif;
        }
        
        /* Esconde scrollbar mas mantém funcionalidade */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* Efeito glass para navegação */
        .glass-nav {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        /* Loading spinner customizado */
        .loading-spinner-custom {
            width: 48px;
            height: 48px;
            border: 3px solid #E4E6EB;
            border-top-color: #4A90E2;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Chat button flutuante premium */
        .chat-float-btn {
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #4A90E2, #3A73B5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(74, 144, 226, 0.3);
            cursor: pointer;
            z-index: 1000;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-decoration: none;
        }
        
        .chat-float-btn:hover {
            transform: scale(1.1) translateY(-5px);
            box-shadow: 0 12px 28px rgba(74, 144, 226, 0.4);
        }
        
        .chat-float-btn .material-icons {
            color: white;
            font-size: 28px;
        }
        
        /* Notificação persistente */
        .persistent-notification {
            position: fixed;
            bottom: 100px;
            left: 16px;
            right: 16px;
            max-width: 380px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            z-index: 10000;
            display: none;
            overflow: hidden;
            animation: slideUp 0.3s ease-out;
        }
        
        .persistent-notification.show {
            display: flex;
        }
        
        .notification-content {
            flex: 1;
            padding: 16px;
            cursor: pointer;
        }
        
        .notification-content strong {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #1C1E21;
            margin-bottom: 4px;
        }
        
        .notification-content p {
            font-size: 13px;
            color: #606770;
            margin: 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .notification-close {
            background: none;
            border: none;
            padding: 12px 16px;
            cursor: pointer;
            color: #999;
            font-size: 20px;
            transition: color 0.2s;
        }
        
        .notification-close:hover {
            color: #666;
        }
        
        /* Animação de pulso para badge */
        @keyframes badgePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        
        /* Transição suave para iframe - AGORA GARANTINDO 99%+ DE OCUPAÇÃO */
        .content-frame {
            transition: opacity 0.3s ease;
            width: 100%;
            height: 100%;
            min-width: 99%;
            min-height: 99%;
        }
        
        /* Container principal do conteúdo - Garantia de área interna máxima */
        .main-content-area {
            flex: 1;
            overflow: hidden;
            position: relative;
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Wrapper do iframe ocupa virtualmente todo o espaço disponível */
        .iframe-wrapper {
            width: 100%;
            height: 100%;
            position: relative;
            min-height: 0;
            flex: 1;
        }
        
        iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }
        
        /* Nav item active effect */
        .nav-item {
            transition: all 0.2s ease;
            position: relative;
        }
        
        .nav-item.active {
            color: #4A90E2;
        }
        
        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 3px;
            background: linear-gradient(90deg, #4A90E2, #3A73B5);
            border-radius: 3px;
        }
        
        /* Ripple effect para botões */
        .ripple {
            position: relative;
            overflow: hidden;
        }
        
        .ripple::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(74, 144, 226, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.4s, height 0.4s;
        }
        
        .ripple:active::after {
            width: 200px;
            height: 200px;
        }
        
        /* Safe area para iOS */
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom);
        }
        
        /* Responsividade para tablets */
        @media (min-width: 768px) {
            .chat-float-btn {
                bottom: 100px;
                right: 30px;
                width: 64px;
                height: 64px;
            }
            
            .chat-float-btn .material-icons {
                font-size: 32px;
            }
            
            .persistent-notification {
                bottom: 110px;
                left: 30px;
                max-width: 400px;
            }
        }
        
        /* Efeito de hover para desktop */
        @media (hover: hover) {
            .nav-item:hover {
                color: #4A90E2;
                transform: translateY(-2px);
            }
        }
        
        /* Garantia extra: o iframe ocupa pelo menos 99% do container pai */
        .content-frame {
            min-width: 99%;
            min-height: 99%;
            width: 100%;
            height: 100%;
        }
        
        /* Ajuste para o container principal ocupar toda a área disponível */
        .flex-1.flex.flex-col {
            min-height: 0;
            height: 100%;
        }
        
        main {
            min-height: 0;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .iframe-wrapper {
            min-height: 0;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <!-- Loading Overlay -->
    <div id="loading" class="fixed inset-0 bg-white/90 backdrop-blur-sm hidden items-center justify-center z-[2000]">
        <div class="flex flex-col items-center gap-4">
            <div class="loading-spinner-custom"></div>
            <p class="text-gray-500 text-sm animate-pulse">Carregando...</p>
        </div>
    </div>

    <!-- Main Container - Estrutura otimizada para máximo aproveitamento de espaço -->
    <div class="flex h-screen w-full overflow-hidden">
        <!-- Content Area - Agora com garantia de que o iframe ocupará no mínimo 99% do espaço interno -->
        <div class="flex-1 flex flex-col min-h-0 h-full w-full pb-[65px]">
            <main class="flex-1 overflow-hidden relative min-h-0 w-full">
                <div class="iframe-wrapper w-full h-full">
                    <iframe id="contentFrame" class="content-frame" src="aviso.html" title="Conteúdo do Condomínio"></iframe>
                </div>
            </main>
        </div>
    </div>

    <!-- Chat Button Flutuante -->
    <a href="chat.html" class="chat-float-btn ripple" title="Interfone Virtual">

    </a>

    <!-- Bottom Navigation - REMOVIDA A OPÇÃO "CRIAR LOJAS" CONFORME SOLICITADO -->
    <nav class="glass-nav fixed bottom-0 left-0 right-0 h-[65px] flex overflow-x-auto overflow-y-hidden shadow-lg z-[150] pb-safe hide-scrollbar">
        <button class="nav-item active flex flex-col items-center justify-center flex-shrink-0 min-w-[70px] px-3 py-2 text-gray-500 text-xs font-medium bg-transparent border-none cursor-pointer transition-colors" data-page="aviso.html" data-title="Avisos">
            <i class="material-icons-outlined text-2xl mb-0.5">campaign</i>

        </button>
        <button class="nav-item flex flex-col items-center justify-center flex-shrink-0 min-w-[70px] px-3 py-2 text-gray-500 text-xs font-medium bg-transparent border-none cursor-pointer transition-colors" data-page="lojas.html" data-title="Lojas">
            <i class="material-icons-outlined text-2xl mb-0.5">storefront</i>
            <span>Lojas</span>
        </button>
        <!-- Botão "Criar Loja" completamente REMOVIDO conforme solicitado -->
        <button class="nav-item flex flex-col items-center justify-center flex-shrink-0 min-w-[70px] px-3 py-2 text-gray-500 text-xs font-medium bg-transparent border-none cursor-pointer transition-colors" data-page="salao_festas.html" data-title="Salão de Festas">
            <i class="material-icons-outlined text-2xl mb-0.5">celebration</i>

        </button>
        <button class="nav-item flex flex-col items-center justify-center flex-shrink-0 min-w-[70px] px-3 py-2 text-gray-500 text-xs font-medium bg-transparent border-none cursor-pointer transition-colors" data-page="login.html" data-title="Usuários">
            <i class="material-icons-outlined text-2xl mb-0.5">people_alt</i>
            <span>Usuários</span>
        </button>
        <button id="adminNavItem" class="nav-item flex flex-col items-center justify-center flex-shrink-0 min-w-[70px] px-3 py-2 text-gray-500 text-xs font-medium bg-transparent border-none cursor-pointer transition-colors" data-page="admin.html" data-title="Admin" style="display: none;">
            <i class="material-icons-outlined text-2xl mb-0.5">admin_panel_settings</i>
            <span>Admin</span>
        </button>
        <button class="nav-item flex flex-col items-center justify-center flex-shrink-0 min-w-[70px] px-3 py-2 text-gray-500 text-xs font-medium bg-transparent border-none cursor-pointer transition-colors" data-page="historico.html" data-title="Histórico de Encomendas">
            <i class="material-icons-outlined text-2xl mb-0.5">history</i>
            <span>Histórico</span>
        </button>
    </nav>

    <!-- Notificação Persistente -->
    <div class="persistent-notification" id="persistentNotification">
        <div class="notification-content" id="notificationContent">
            <strong id="persistentSender">Nova Mensagem</strong>
            <p id="persistentMessage">Você tem uma nova mensagem.</p>
        </div>
        <button class="notification-close" id="notificationClose" title="Fechar">×</button>
    </div>

    <!-- Firebase e Scripts (Notificações + Autenticação) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        // Configuração Firebase para notificações (primeiro app)
        (function() {
            const firebaseConfig = {
                apiKey: "AIzaSyByyM8RvGNM5pyrQIQ7nCH6mmgYAIpq0bc",
                authDomain: "rifas-c414b.firebaseapp.com",
                databaseURL: "https://rifas-c414b-default-rtdb.firebaseio.com",
                projectId: "rifas-c414b",
                storageBucket: "rifas-c414b.appspot.com",
                messagingSenderId: "770195193538",
                appId: "1:770195193538:web:48e585ac5661d27f3dc55b"
            };

            const URL_DO_INTERFONE = "chat.html";
            
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            
            const auth = firebase.auth();
            const database = firebase.database();
            
            let currentUserId = null;
            let conversationsListener = null;
            const notifiedMessageTimestamps = new Set();

            const notificationPopup = document.getElementById('persistentNotification');
            const notificationContent = document.getElementById('notificationContent');
            const notificationClose = document.getElementById('notificationClose');
            const notificationSender = document.getElementById('persistentSender');
            const notificationMessage = document.getElementById('persistentMessage');

            function playNotificationSound() {
                try {
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    const oscillator = audioContext.createOscillator();
                    oscillator.connect(audioContext.destination);
                    oscillator.frequency.value = 800;
                    oscillator.type = 'sine';
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 0.2);
                } catch (e) {
                    console.warn("Não foi possível tocar o som de notificação.");
                }
            }

            function showNotification(senderName, messageText) {
                notificationSender.textContent = `📬 ${senderName}`;
                notificationMessage.textContent = messageText;
                notificationPopup.classList.add('show');
                playNotificationSound();
            }
            
            notificationContent.onclick = () => {
                window.open(URL_DO_INTERFONE, '_blank');
            };

            notificationClose.onclick = () => {
                notificationPopup.classList.remove('show');
            };

            function startListeningForMessages(userId) {
                if (conversationsListener) {
                    conversationsListener.off(); 
                }
                
                console.log("Iniciando listener de notificações para o usuário:", userId);
                conversationsListener = database.ref('conversations');

                const messageHandler = (snapshot) => {
                    handleNewMessage(snapshot, userId);
                };
                
                conversationsListener.on('child_changed', messageHandler);
                conversationsListener.on('child_added', messageHandler);
            }

            function handleNewMessage(snapshot, userId) {
                const conversationId = snapshot.key;

                if (conversationId.includes(userId)) {
                    const messages = snapshot.val();
                    if (!messages) return;

                    const messageKeys = Object.keys(messages);
                    const lastMessageKey = messageKeys[messageKeys.length - 1];
                    const lastMessage = messages[lastMessageKey];

                    if (lastMessage && lastMessage.senderId !== userId) {
                        
                        if (!notifiedMessageTimestamps.has(lastMessage.timestamp)) {
                            notifiedMessageTimestamps.add(lastMessage.timestamp); 

                            database.ref(`users/${lastMessage.senderId}`).once('value').then(userSnapshot => {
                                const sender = userSnapshot.val();
                                const senderName = sender ? sender.nome || 'Usuário' : 'Usuário';
                                
                                console.log(`Nova mensagem recebida de ${senderName}`);
                                showNotification(senderName, lastMessage.text);
                            });
                        }
                    }
                }
            }

            auth.onAuthStateChanged(user => {
                if (user) {
                    if (currentUserId !== user.uid) {
                        currentUserId = user.uid;
                        startListeningForMessages(currentUserId);
                    }
                } else {
                    console.log('Usuário não logado. Notificações desativadas.');
                    if (conversationsListener) {
                        conversationsListener.off();
                    }
                    currentUserId = null;
                }
            });
        })();
    </script>

    <script>
        // Configuração Firebase para navegação (segundo app)
        const firebaseConfigNav = {
            apiKey: "AIzaSyCwTNcpr_r75HH0igBtNyEbKvfuLkVFHiU",
            authDomain: "rifalidiane-fde3b.firebaseapp.com",
            databaseURL: "https://rifalidiane-fde3b-default-rtdb.firebaseio.com",
            projectId: "rifalidiane-fde3b",
            storageBucket: "rifalidiane-fde3b.firebasestorage.app",
            messagingSenderId: "649359518677",
            appId: "1:649359518677:web:879b4ed9fa5150d24d2b5c"
        };

        // Inicializa app secundário apenas se não existir
        let navApp;
        if (!firebase.apps.some(app => app.name === 'navApp')) {
            navApp = firebase.initializeApp(firebaseConfigNav, 'navApp');
        } else {
            navApp = firebase.app('navApp');
        }
        
        const navDatabase = navApp.database();

        function getOrGenerateUserId() {
            let userId = localStorage.getItem('uniqueUserId');
            if (!userId) {
                userId = 'user-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('uniqueUserId', userId);
            }
            return userId;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const loading = document.getElementById('loading');
            const contentFrame = document.getElementById('contentFrame');
            const menuItems = document.querySelectorAll('.nav-item');
            
            // Forçar que o iframe sempre ocupe no mínimo 99% da área visível após cada redimensionamento
            function enforceIframeSize() {
                if (contentFrame) {
                    // Garantia adicional via estilo inline para máxima compatibilidade
                    contentFrame.style.minWidth = '99%';
                    contentFrame.style.minHeight = '99%';
                    contentFrame.style.width = '100%';
                    contentFrame.style.height = '100%';
                }
            }
            
            // Executa ao carregar e sempre que houver redimensionamento da janela
            window.addEventListener('resize', () => {
                setTimeout(enforceIframeSize, 50);
            });
            
            enforceIframeSize();

            const setActiveMenuItem = (pageUrl) => {
                menuItems.forEach(item => {
                    if (item.dataset.page === pageUrl) {
                        item.classList.add('active');
                    } else {
                        item.classList.remove('active');
                    }
                });
            };
            
            const loadPage = (pageUrl, title) => {
                loading.style.display = 'flex';
                document.title = `${title} | Condomínio Cotovias`;
                
                const currentSrc = contentFrame.src.split('/').pop();
                if (currentSrc !== pageUrl) {
                    contentFrame.src = pageUrl;
                }
                
                contentFrame.onload = () => {
                    // Após carregar o iframe, reforçar tamanho mínimo de 99%
                    enforceIframeSize();
                    setTimeout(() => {
                        loading.style.display = 'none';
                        enforceIframeSize();
                    }, 300);
                };
                
                setActiveMenuItem(pageUrl);
            };
            
            // Função para solicitar acesso apenas para ADMIN (pois o botão Criar Loja foi removido)
            const requestAdminAccess = async () => {
                const userId = getOrGenerateUserId();
                const dbPath = 'admins/';
                const pageUrl = 'admin.html';
                const pageTitle = 'Administração';
                const requestText = 'acesso de Administrador';
                
                loading.style.display = 'flex';
                
                try {
                    const snapshot = await navDatabase.ref(dbPath + userId).once('value');
                    const userData = snapshot.val();

                    if (userData && userData.status === 'active') {
                        loadPage(pageUrl, pageTitle);
                    } else {
                        if (!userData) {
                            await navDatabase.ref(dbPath + userId).set({
                                status: 'pending',
                                requestedAt: new Date().toISOString()
                            });
                        }
                        
                        const numeroWhatsApp = '5521987715733';
                        const mensagem = `Olá! Gostaria de solicitar ${requestText}. Meu ID de solicitação é: ${userId}`;
                        const urlWhatsApp = `https://wa.me/${numeroWhatsApp}?text=${encodeURIComponent(mensagem)}`;

                        alert(`Para obter acesso de Administrador, solicite a liberação.\n\nSeu ID de Solicitação é: ${userId}\n\nVocê será redirecionado para o WhatsApp.`);
                        window.open(urlWhatsApp, '_blank');
                        loading.style.display = 'none';
                    }
                } catch (error) {
                    console.error("Erro ao verificar status:", error);
                    alert("Ocorreu um erro. Tente novamente.");
                    loading.style.display = 'none';
                }
            };
            
            // Event Listeners para navegação (sem o botão criar lojas)
            menuItems.forEach(item => {
                const page = item.dataset.page;

                if (page === 'admin.html') {
                    item.addEventListener('click', (e) => {
                        e.preventDefault();
                        requestAdminAccess();
                    });
                } else {
                    item.addEventListener('click', () => {
                        if (item.dataset.page) {
                            loadPage(item.dataset.page, item.dataset.title);
                        }
                    });
                }
            });

            // Inicialização: carrega a página ativa (Avisos)
            const initialItem = document.querySelector('.nav-item.active');
            if (initialItem && initialItem.dataset.page) {
                loadPage(initialItem.dataset.page, initialItem.dataset.title);
            } else if (menuItems.length > 0) {
                // Fallback: carrega o primeiro item caso não haja active
                const firstItem = menuItems[0];
                if (firstItem && firstItem.dataset.page) {
                    loadPage(firstItem.dataset.page, firstItem.dataset.title);
                    firstItem.classList.add('active');
                }
            }
            
            // Força novamente o iframe a ter no mínimo 99% após um pequeno delay para garantir
            setTimeout(() => {
                enforceIframeSize();
                // Adicional: monitoramento de mutação para caso algum estilo externo tente reduzir
                const observer = new ResizeObserver(() => enforceIframeSize());
                if (contentFrame) {
                    observer.observe(contentFrame);
                }
            }, 200);
        });
    </script>
</body>
</html>
