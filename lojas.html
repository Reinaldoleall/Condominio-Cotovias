<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#4A90E2">
    <title>Portal de Lojas - Condomínio Cotovias</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#EBF3FE',
                            100: '#D7E8FD',
                            200: '#B0D1FB',
                            300: '#88B9F8',
                            400: '#61A2F6',
                            500: '#4A90E2',
                            600: '#3A73B5',
                            700: '#2B5688',
                            800: '#1D3A5A',
                            900: '#0E1D2D',
                        }
                    },
                    fontFamily: {
                        'inter': ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'slide-up': 'slideUp 0.4s ease-out',
                        'slide-down': 'slideDown 0.3s ease-out',
                        'scale-in': 'scaleIn 0.2s ease-out',
                        'pulse-slow': 'pulse 2s infinite',
                        'shimmer': 'shimmer 2s infinite',
                    },
                    keyframes: {
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        slideDown: {
                            '0%': { opacity: '0', transform: 'translateY(-20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        scaleIn: {
                            '0%': { opacity: '0', transform: 'scale(0.95)' },
                            '100%': { opacity: '1', transform: 'scale(1)' },
                        },
                        shimmer: {
                            '0%': { backgroundPosition: '-200% 0' },
                            '100%': { backgroundPosition: '200% 0' },
                        },
                    },
                },
            },
        }
    </script>
    
    <style>
        /* Estilos customizados */
        * {
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: linear-gradient(135deg, #F7F8FC 0%, #EEF2F7 100%);
            font-family: 'Inter', sans-serif;
        }
        
        /* Header com efeito glass */
        .glass-header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(74, 144, 226, 0.1);
        }
        
        /* Scrollbar customizada */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #E4E6EB;
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #4A90E2, #3A73B5);
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #3A73B5, #2B5688);
        }
        
        /* Card premium effect */
        .premium-card {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .premium-card:hover {
            transform: translateY(-8px) scale(1.01);
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.15), 0 4px 18px rgba(0, 0, 0, 0.05);
        }
        
        /* Input focus effect */
        .search-input-focus:focus {
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.15);
        }
        
        /* Shimmer loading */
        .shimmer-bg {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
        }
        
        /* Card animation */
        .card-enter {
            animation: slideUp 0.5s ease-out forwards;
            opacity: 0;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Gradient text */
        .gradient-text {
            background: linear-gradient(135deg, #4A90E2, #3A73B5);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        /* Badge effect */
        .badge-new {
            position: relative;
            overflow: hidden;
        }
        
        .badge-new::before {
            content: '✨';
            position: absolute;
            top: -5px;
            right: -5px;
            font-size: 20px;
            animation: float 2s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }
        
        /* Ripple effect */
        .ripple {
            position: relative;
            overflow: hidden;
        }
        
        .ripple::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(74, 144, 226, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.4s, height 0.4s;
        }
        
        .ripple:active::after {
            width: 200px;
            height: 200px;
        }
        
        /* Banner image hover */
        .card-banner {
            transition: transform 0.3s ease;
        }
        
        .store-card:hover .card-banner,
        .product-card:hover .card-banner {
            transform: scale(1.05);
        }
        
        /* Loading spinner */
        .loading-spinner-custom {
            width: 48px;
            height: 48px;
            border: 3px solid #E4E6EB;
            border-top-color: #4A90E2;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Empty state animation */
        .empty-state-icon {
            animation: float 3s ease-in-out infinite;
        }
        
        /* Sort button rotation */
        .sort-icon {
            transition: transform 0.3s ease;
        }
        
        .sort-icon.rotated {
            transform: rotate(180deg);
        }
    </style>
</head>
<body>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="fixed inset-0 bg-white/90 backdrop-blur-sm hidden items-center justify-center z-[2000]">
        <div class="flex flex-col items-center gap-4">
            <div class="loading-spinner-custom"></div>
            <p class="text-gray-500 text-sm animate-pulse">Carregando lojas...</p>
        </div>
    </div>

    <!-- Header com efeito glass -->
    <header class="glass-header sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-gradient-to-br from-primary-500 to-primary-600 rounded-xl flex items-center justify-center shadow-lg">
                        <i class="material-icons text-white text-2xl">storefront</i>
                    </div>
                    <div>
                        <h1 class="text-xl sm:text-2xl font-bold gradient-text">Portal de Lojas</h1>
                        <p class="text-xs text-gray-500 hidden sm:block">Encontre produtos e serviços</p>
                    </div>
                </div>
                <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 bg-white/50 rounded-full">
                    <i class="material-icons-outlined text-primary-500 text-sm">verified</i>
                    <span class="text-xs text-gray-600">Lojas Parceiras</span>
                </div>
            </div>
            
            <!-- Barra de busca e ordenação -->
            <div class="flex gap-3 items-center">
                <div class="relative flex-1">
                    <i class="material-icons-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-xl">search</i>
                    <input type="search" id="searchInput" 
                           placeholder="Buscar por loja ou produto..." 
                           class="w-full pl-12 pr-4 py-3 bg-white border border-gray-200 rounded-2xl text-gray-800 placeholder-gray-400 focus:outline-none focus:border-primary-500 transition-all shadow-sm search-input-focus">
                </div>
                <button id="sortButton" class="sort-button w-12 h-12 bg-white border border-gray-200 rounded-xl flex items-center justify-center hover:border-primary-500 hover:shadow-md transition-all ripple flex-shrink-0">
                    <i class="material-icons-outlined text-gray-600 sort-icon">arrow_downward</i>
                </button>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
        <div class="results-grid grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 sm:gap-6" id="resultsGrid">
            <!-- Skeletons serão inseridos aqui -->
        </div>
        
        <!-- Estado vazio -->
        <div id="emptyState" class="hidden text-center py-16">
            <div class="inline-flex items-center justify-center w-24 h-24 bg-gray-100 rounded-full mb-4 empty-state-icon">
                <i class="material-icons-outlined text-5xl text-gray-400">search_off</i>
            </div>
            <h3 class="text-xl font-semibold text-gray-800 mb-2">Nenhum resultado encontrado</h3>
            <p class="text-gray-500 max-w-md mx-auto">Tente ajustar sua busca ou explore todas as nossas lojas disponíveis.</p>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-database.js";

        document.addEventListener('DOMContentLoaded', () => {
            const firebaseConfig = {
                apiKey: "AIzaSyD8FxHqt1g2V-mmureRPQyYe6QCuRSieGI",
                authDomain: "marketplaceconnect-af26d.firebaseapp.com",
                databaseURL: "https://marketplaceconnect-af26d-default-rtdb.firebaseio.com",
                projectId: "marketplaceconnect-af26d",
                storageBucket: "marketplaceconnect-af26d.firebasestorage.app",
                messagingSenderId: "768552546759",
                appId: "1:768552546759:web:4367fc4a161ecf90c469e2",
                measurementId: "G-7HHR78MHDP"
            };
            
            const app = initializeApp(firebaseConfig);
            const db = getDatabase(app);

            const resultsGrid = document.getElementById('resultsGrid');
            const searchInput = document.getElementById('searchInput');
            const sortButton = document.getElementById('sortButton');
            const emptyState = document.getElementById('emptyState');
            const loadingOverlay = document.getElementById('loadingOverlay');
            
            let allStores = [];
            let sortOrder = 'asc'; // 'asc' para A-Z

            // Lojas fixas
            const fixedStores = [
                {
                    id: 'loja-nova',
                    name: 'Crie sua Loja',
                    description: '✅ FÁCIL, RÁPIDO E SEM COMPLICAÇÕES! Configuração simplificada, interface intuitiva e mensalidades que cabem no seu bolso! 🎯 Em apenas 3 passos: Cadastre-se — 30 segundos. Personalize sua loja — 5 minutos. Comece a vender — imediatamente! 🔥 NÃO PERCA TEMPO! ⏰ SEUS CLIENTES ESTÃO ESPERANDO!',
                    logo: 'https://i.postimg.cc/YS5W4ctK/Criacao-de-Loja-Virtual-Gratis.gif',
                    url: 'https://reinaldoleall.github.io/criarlojas/',
                    type: 'store',
                    isFixed: true,
                    isFeatured: true
                },
                {
                    id: 'magazine-luiza',
                    name: 'Magazine Luiza',
                    description: 'Tudo que você precisa em um só lugar! Eletrônicos, móveis, eletrodomésticos e muito mais com as melhores ofertas.',
                    logo: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR_FSBujTblqbK8XqF25lLhiwbVnse-eEm3V_YiSxE3hQ&s=10',
                    url: 'https://www.magazinevoce.com.br/magazinereinaldoleal/',
                    type: 'store',
                    isFixed: true
                }
            ];

            const debounce = (func, delay) => {
                let timeout;
                return (...args) => {
                    clearTimeout(timeout);
                    timeout = setTimeout(() => func.apply(this, args), delay);
                };
            };

            const showSkeletons = (count = 6) => {
                resultsGrid.innerHTML = '';
                emptyState.classList.add('hidden');
                for (let i = 0; i < count; i++) {
                    resultsGrid.innerHTML += `
                        <div class="bg-white rounded-2xl border border-gray-100 overflow-hidden shadow-sm animate-pulse">
                            <div class="pt-[56.25%] bg-gray-200 shimmer-bg"></div>
                            <div class="p-5">
                                <div class="h-5 bg-gray-200 rounded-lg w-3/4 mb-3 shimmer-bg"></div>
                                <div class="space-y-2">
                                    <div class="h-4 bg-gray-200 rounded w-full shimmer-bg"></div>
                                    <div class="h-4 bg-gray-200 rounded w-5/6 shimmer-bg"></div>
                                    <div class="h-4 bg-gray-200 rounded w-4/6 shimmer-bg"></div>
                                </div>
                            </div>
                        </div>
                    `;
                }
            };

            async function fetchStores() {
                try {
                    const storesRef = ref(db, 'stores/');
                    const snapshot = await get(storesRef);
                    if (snapshot.exists()) {
                        const storesData = snapshot.val();
                        allStores = Object.entries(storesData).map(([id, store]) => ({
                            id,
                            ...store,
                            products: store.products ? Object.values(store.products) : []
                        }));
                        sortAndFilter();
                    } else {
                        renderResults([]);
                    }
                } catch (error) {
                    console.error("Erro ao buscar lojas:", error);
                    renderResults([]);
                }
            }

            function renderResults(itemsToRender) {
                resultsGrid.innerHTML = '';
                
                const allItems = [...fixedStores, ...itemsToRender];
                
                if (allItems.length === 0) {
                    emptyState.classList.remove('hidden');
                    resultsGrid.classList.add('hidden');
                    return;
                }
                
                emptyState.classList.add('hidden');
                resultsGrid.classList.remove('hidden');
                
                const fragment = document.createDocumentFragment();
                
                allItems.forEach((item, index) => {
                    const card = document.createElement('a');
                    card.target = "_blank";
                    card.className = `bg-white rounded-2xl border border-gray-100 overflow-hidden shadow-sm hover:shadow-xl transition-all premium-card card-enter`;
                    card.style.animationDelay = `${index * 0.05}s`;
                    
                    if (item.type === 'store') {
                        card.href = item.isFixed ? item.url : `loja.html?userId=${item.id}`;
                        const isFeatured = item.isFeatured ? 'badge-new' : '';
                        card.innerHTML = `
                            <div class="relative overflow-hidden">
                                <div class="card-banner pt-[56.25%] bg-cover bg-center bg-gray-100 transition-transform duration-300" style="background-image: url('${item.logo || 'https://placehold.co/600x340/EADDFF/21005D?text=Loja'}')"></div>
                                ${item.isFeatured ? '<div class="absolute top-3 right-3 bg-gradient-to-r from-yellow-400 to-orange-500 text-white text-xs font-bold px-2 py-1 rounded-full shadow-lg">✨ Destaque</div>' : ''}
                            </div>
                            <div class="p-5">
                                <h3 class="text-lg font-bold text-gray-800 mb-2 line-clamp-2">${escapeHtml(item.name)}</h3>
                                <p class="text-sm text-gray-600 leading-relaxed line-clamp-3 mb-4">${escapeHtml(item.description || 'Visite nossa loja para ver os produtos disponíveis.')}</p>
                                <div class="flex items-center justify-between">
                                    <span class="text-primary-500 font-semibold text-sm flex items-center gap-1">
                                        Visitar Loja
                                        <i class="material-icons-outlined text-base">arrow_forward</i>
                                    </span>
                                    ${!item.isFixed ? '<span class="text-xs text-gray-400 flex items-center gap-1"><i class="material-icons-outlined text-sm">verified</i> Parceiro</span>' : ''}
                                </div>
                            </div>
                        `;
                    } else { // type === 'product'
                        card.href = `loja.html?userId=${item.storeId}`;
                        card.innerHTML = `
                            <div class="relative overflow-hidden">
                                <div class="card-banner pt-[56.25%] bg-cover bg-center bg-gray-100 transition-transform duration-300" style="background-image: url('${item.image || 'https://placehold.co/600x340/EADDFF/21005D?text=Produto'}')"></div>
                            </div>
                            <div class="p-5">
                                <span class="text-xs font-medium text-primary-600 bg-primary-50 px-2 py-1 rounded-full inline-block mb-2">${escapeHtml(item.storeName)}</span>
                                <h3 class="text-base font-bold text-gray-800 mb-2 line-clamp-2">${escapeHtml(item.name)}</h3>
                                <p class="text-xl font-bold text-primary-500 mt-3">
                                    R$ ${(item.price || 0).toFixed(2).replace('.', ',')}
                                </p>
                            </div>
                        `;
                    }
                    fragment.appendChild(card);
                });
                resultsGrid.appendChild(fragment);
            }

            function sortAndFilter() {
                const sortByName = (a, b) => {
                    const nameA = a.name || '';
                    const nameB = b.name || '';
                    if (sortOrder === 'asc') return nameA.localeCompare(nameB);
                    return nameB.localeCompare(nameA);
                };

                const query = searchInput.value.toLowerCase().trim();
                
                if (!query) {
                    const sortedStores = [...allStores].sort(sortByName);
                    renderResults(sortedStores.map(s => ({ type: 'store', ...s })));
                    return;
                }

                const foundItems = new Map();
                allStores.forEach(store => {
                    if (store.name && store.name.toLowerCase().includes(query)) {
                        foundItems.set(`store-${store.id}`, { type: 'store', ...store });
                    }
                    if (store.products) {
                        store.products.forEach(product => {
                            if (product.name && product.name.toLowerCase().includes(query)) {
                                foundItems.set(`product-${store.id}-${product.id}`, {
                                    type: 'product',
                                    ...product,
                                    storeId: store.id,
                                    storeName: store.name
                                });
                            }
                        });
                    }
                });
                
                const sortedItems = Array.from(foundItems.values()).sort(sortByName);
                renderResults(sortedItems);
            }

            function toggleSortOrder() {
                sortOrder = sortOrder === 'asc' ? 'desc' : 'asc';
                const icon = sortButton.querySelector('.sort-icon');
                icon.textContent = sortOrder === 'asc' ? 'arrow_downward' : 'arrow_upward';
                icon.classList.toggle('rotated');
                sortAndFilter();
            }

            function escapeHtml(str) {
                if (!str) return '';
                return str.replace(/[&<>]/g, function(m) {
                    if (m === '&') return '&amp;';
                    if (m === '<') return '&lt;';
                    if (m === '>') return '&gt;';
                    return m;
                });
            }
            
            searchInput.addEventListener('input', debounce(sortAndFilter, 300));
            sortButton.addEventListener('click', toggleSortOrder);

            // Inicializa com skeletons
            showSkeletons();
            
            // Carrega as lojas
            setTimeout(() => {
                fetchStores();
            }, 500);
        });
    </script>
    
    <style>
        /* Utilidades adicionais */
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        /* Responsividade extra */
        @media (max-width: 640px) {
            .results-grid {
                gap: 16px;
            }
        }
        
        /* Efeito de hover para desktop */
        @media (hover: hover) {
            .store-card:hover .card-banner,
            .product-card:hover .card-banner {
                transform: scale(1.05);
            }
        }
        
        /* Safe area para iOS */
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
</body>
</html>
