<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Painel de Administração da Loja</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root {
            --cor-primaria: #4A90E2; --cor-primaria-hover: #357ABD; --cor-fundo: #F4F6F9;
            --cor-surface: #FFFFFF; --cor-texto-principal: #333333; --cor-texto-secundario: #777777;
            --cor-borda: #EAEAEA; --cor-erro: #E74C3C; --cor-sucesso: #2ECC71;
            --fonte-principal: 'Inter', sans-serif; --raio-borda: 8px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--fonte-principal); background-color: var(--cor-fundo); color: var(--cor-texto-principal); -webkit-font-smoothing: antialiased; }

        .app-header { background-color: var(--cor-surface); border-bottom: 1px solid var(--cor-borda); position: sticky; top: 0; z-index: 100;}
        .top-bar { display: flex; justify-content: space-between; align-items: center; height: 64px; padding: 0 24px; }
        .top-bar-title { font-size: 1.2rem; font-weight: 600; }
        
        .tabs-container { overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
        .tabs-container::-webkit-scrollbar { display: none; }
        .tabs-bar { display: flex; }
        .tab-button {
            background: none; border: none; cursor: pointer; padding: 16px 20px;
            font-family: var(--fonte-principal); font-size: 0.9rem; font-weight: 500;
            color: var(--cor-texto-secundario); border-bottom: 3px solid transparent;
            display: flex; align-items: center; gap: 8px; transition: all 0.2s ease;
            white-space: nowrap; flex-shrink: 0;
        }
        .tab-button:hover { color: var(--cor-texto-principal); }
        .tab-button.active { color: var(--cor-primaria); border-bottom-color: var(--cor-primaria); }

        .page-container { max-width: 1200px; margin: 0 auto; padding: 24px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.5s ease; }
        
        .card { background-color: var(--cor-surface); padding: 24px; border-radius: var(--raio-borda); border: 1px solid var(--cor-borda); margin-bottom: 24px; }
        .card h2 { font-size: 1.2rem; margin-bottom: 20px; border-bottom: 1px solid var(--cor-borda); padding-bottom: 10px; }

        .btn, .btn-outlined { font-family: var(--fonte-principal); border: none; padding: 10px 20px; border-radius: var(--raio-borda); font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 8px; }
        .btn { background-color: var(--cor-primaria); color: white; }
        .btn-outlined { background-color: transparent; color: var(--cor-texto-secundario); border: 1px solid var(--cor-borda); }
        
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.9rem; font-weight: 500; margin-bottom: 6px; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px; font-size: 1rem; border: 1px solid var(--cor-borda); border-radius: var(--raio-borda); }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: var(--cor-primaria); box-shadow: 0 0 0 3px color-mix(in srgb, var(--cor-primaria) 20%, transparent); }

        .login-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 24px; }
        .login-card { width: 100%; max-width: 400px; }

        .tag-list { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .tag { background-color: var(--cor-fundo); padding: 8px 12px; border-radius: 20px; font-size: 0.9rem; display: flex; align-items: center; gap: 8px; border: 1px solid var(--cor-borda); }
        .tag .delete-btn { cursor: pointer; font-size: 1rem; }

        .admin-products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .admin-product-card { position: relative; background-color: var(--cor-surface); border-radius: var(--raio-borda); border: 1px solid var(--cor-borda); overflow: hidden; }
        .admin-product-card__image { width: 100%; padding-top: 75%; background-size: cover; background-position: center; }
        .admin-product-card__info { padding: 16px; }
        .admin-product-card__name { font-weight: 600; }
        .admin-product-card__price { color: var(--cor-primaria); font-weight: 700; margin-top: 4px; }
        .admin-product-card__actions { padding: 0 16px 16px; display: flex; gap: 10px; }
        .outofstock-badge { position: absolute; top: 10px; right: 10px; background-color: var(--cor-erro); color: white; padding: 4px 8px; font-size: 0.75rem; font-weight: 600; border-radius: 4px; z-index: 2;}

        .modal-overlay { position: fixed; inset: 0; background-color: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 16px; }
        .modal-overlay.show { display: flex; }
        .modal-container { background: var(--cor-surface); border-radius: 12px; width: 100%; max-width: 600px; max-height: 90vh; display: flex; flex-direction: column; animation: fadeIn 0.3s ease; }
        .modal-header { padding: 16px 20px; border-bottom: 1px solid var(--cor-borda); font-size: 1.1rem; font-weight: 600; }
        .modal-body { padding: 20px; overflow-y: auto; }
        .modal-footer { padding: 16px 20px; border-top: 1px solid var(--cor-borda); display: flex; justify-content: flex-end; gap: 10px; }

        .toggle-switch { display: flex; align-items: center; gap: 10px; }
        .toggle-switch input { height: 0; width: 0; visibility: hidden; }
        .toggle-switch label { cursor: pointer; text-indent: -9999px; width: 44px; height: 24px; background: grey; display: block; border-radius: 100px; position: relative; }
        .toggle-switch label:after { content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; background: #fff; border-radius: 20px; transition: 0.3s; }
        .toggle-switch input:checked + label { background: var(--cor-sucesso); }
        .toggle-switch input:checked + label:after { left: calc(100% - 2px); transform: translateX(-100%); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="auth-container" class="login-container">
        <div class="card login-card">
            <div id="login-form">
                <h2>Acessar Painel</h2>
                <div class="form-group"><label for="login-email">E-mail</label><input type="email" id="login-email"></div>
                <div class="form-group"><label for="login-password">Senha</label><input type="password" id="login-password"></div>
                <button id="login-btn" class="btn">Entrar</button>
                <button id="show-register-btn" class="btn-outlined" style="margin-top: 10px;">Criar Conta</button>
            </div>
            <div id="register-form" style="display: none;">
                <h2>Criar Nova Conta</h2>
                <div class="form-group"><label for="register-email">E-mail</label><input type="email" id="register-email"></div>
                <div class="form-group"><label for="register-password">Senha</label><input type="password" id="register-password"></div>
                <button id="register-btn" class="btn">Cadastrar</button>
                <button id="show-login-btn" class="btn-outlined" style="margin-top: 10px;">Já tenho conta</button>
            </div>
        </div>
    </div>
    
    <div id="app-container" style="display: none;">
        <header class="app-header">
            <div class="top-bar">
                <span class="top-bar-title">Painel de Administração</span>
                <button id="logout-btn" class="btn-outlined">Sair</button>
            </div>
            <div class="tabs-container">
                <nav id="tabs-bar" class="tabs-bar">
                    <button class="tab-button active" data-tab="config"><i class="material-icons-outlined">tune</i> Configurações</button>
                    <button class="tab-button" data-tab="categories"><i class="material-icons-outlined">category</i> Categorias</button>
                    <button class="tab-button" data-tab="products"><i class="material-icons-outlined">inventory_2</i> Produtos</button>
                    <button class="tab-button" id="view-store-btn"><i class="material-icons-outlined">visibility</i> Visualizar Loja</button>
                </nav>
            </div>
        </header>

        <main class="page-container">
            <div id="config-tab" class="tab-content active">
                <div class="card">
                    <h2>Informações da Loja</h2>
                    <div class="form-group"><label for="store-name">Nome da Loja</label><input type="text" id="store-name"></div>
                    <div class="form-group"><label for="store-description">Descrição da Loja</label><textarea id="store-description" rows="3"></textarea></div>
                    <div class="form-group"><label for="store-logo">URL do Banner Principal</label><input type="text" id="store-logo"></div>
                    <div class="form-group"><label for="store-whatsapp">Nº do WhatsApp (com DDI e DDD, ex: 5521999999999)</label><input type="tel" id="store-whatsapp"></div>
                    <div class="form-group"><label for="store-color">Cor Principal da Loja</label><input type="color" id="store-color" value="#4A90E2" style="height:40px; padding:5px;"></div>
                    <button id="save-store-btn" class="btn">Salvar Informações</button>
                </div>
                <div class="card">
                    <h2>Formas de Pagamento</h2>
                    <div class="form-group" style="display:flex; gap:10px;"><input type="text" id="new-payment-method-input" placeholder="Ex: Pix"><button id="add-payment-method-btn" class="btn">Adicionar</button></div>
                    <div id="payment-methods-list" class="tag-list"></div>
                </div>
                <div class="card">
                    <h2>Opções de Entrega</h2>
                    <div class="form-group" style="display:flex; gap:10px;"><input type="text" id="new-delivery-option-input" placeholder="Ex: Entrega via Motoboy"><button id="add-delivery-option-btn" class="btn">Adicionar</button></div>
                    <div id="delivery-options-list" class="tag-list"></div>
                </div>
            </div>
            
            <div id="categories-tab" class="tab-content">
                <div class="card">
                    <h2>Adicionar Nova Categoria</h2>
                    <div class="form-group" style="display:flex; gap:10px;"><input type="text" id="new-category-name" placeholder="Nome da Categoria"><button id="add-category-btn" class="btn">Adicionar</button></div>
                </div>
                <div class="card">
                    <h2>Categorias Existentes</h2>
                    <div id="categories-list" class="tag-list"></div>
                </div>
            </div>
            
            <div id="products-tab" class="tab-content">
                <div class="card">
                    <h2>Adicionar Novo Produto</h2>
                    <div class="form-group"><label for="product-name">Nome do Produto</label><input type="text" id="product-name"></div>
                    <div class="form-group"><label for="product-description">Descrição</label><textarea id="product-description" rows="3"></textarea></div>
                    <div class="form-group"><label for="product-price">Preço (R$)</label><input type="number" id="product-price" step="0.01"></div>
                    <div class="form-group"><label for="product-image">URL da Imagem</label><input type="text" id="product-image"></div>
                    <div class="form-group"><label for="product-category">Categoria</label><select id="product-category"></select></div>
                    <div class="form-group">
                        <label>Status do Produto</label>
                        <div class="toggle-switch">
                            <input type="checkbox" id="product-outofstock" />
                            <label for="product-outofstock">Toggle</label>
                            <span id="product-stock-status">Esgotado</span>
                        </div>
                    </div>
                    <button id="add-product-btn" class="btn">Adicionar Produto</button>
                </div>
                <div class="card">
                    <h2>Seus Produtos</h2>
                    <div class="product-filters" style="display:flex; flex-wrap: wrap; gap: 16px; margin-bottom: 20px; align-items: flex-end;">
                        <div class="form-group" style="flex-grow: 1; min-width: 200px;"><label for="admin-product-search">Buscar por nome</label><input type="text" id="admin-product-search"></div>
                        <div class="form-group" style="flex-grow: 1; min-width: 200px;"><label for="admin-product-category-filter">Filtrar por categoria</label><select id="admin-product-category-filter"></select></div>
                    </div>
                    <div id="products-list" class="admin-products-grid"></div>
                </div>
            </div>
        </main>
    </div>
    
    <div id="edit-product-modal" class="modal-overlay">
        <div class="modal-container">
            <div class="modal-header">Editar Produto</div>
            <div class="modal-body">
                <input type="hidden" id="edit-product-id">
                <div class="form-group"><label for="edit-product-name">Nome</label><input type="text" id="edit-product-name"></div>
                <div class="form-group"><label for="edit-product-description">Descrição</label><textarea id="edit-product-description" rows="3"></textarea></div>
                <div class="form-group"><label for="edit-product-price">Preço (R$)</label><input type="number" id="edit-product-price" step="0.01"></div>
                <div class="form-group"><label for="edit-product-image">URL da Imagem</label><input type="text" id="edit-product-image"></div>
                <div class="form-group"><label for="edit-product-category">Categoria</label><select id="edit-product-category"></select></div>
                <div class="form-group">
                    <label>Status do Produto</label>
                    <div class="toggle-switch">
                        <input type="checkbox" id="edit-product-outofstock" />
                        <label for="edit-product-outofstock">Toggle</label>
                        <span id="edit-product-stock-status">Esgotado</span>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="cancel-edit-btn" class="btn-outlined">Cancelar</button>
                <button id="save-edit-btn" class="btn">Salvar Alterações</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const firebaseConfig = {
                apiKey: "AIzaSyCwTNcpr_r75HH0igBtNyEbKvfuLkVFHiU",
                authDomain: "rifalidiane-fde3b.firebaseapp.com",
                databaseURL: "https://rifalidiane-fde3b-default-rtdb.firebaseio.com",
                projectId: "rifalidiane-fde3b",
                storageBucket: "rifalidiane-fde3b.firebasestorage.app",
                messagingSenderId: "649359518677",
                appId: "1:649359518677:web:879b4ed9fa5150d24d2b5c"
            };
            firebase.initializeApp(firebaseConfig);
            const auth = firebase.auth();
            const database = firebase.database();

            let currentUser = null;
            let allAdminProducts = [];

            auth.onAuthStateChanged(user => {
                currentUser = user;
                document.getElementById('auth-container').style.display = user ? 'none' : 'flex';
                document.getElementById('app-container').style.display = user ? 'block' : 'none';
                if (user) loadStoreData();
            });

            document.getElementById('show-register-btn').onclick = () => { document.getElementById('login-form').style.display = 'none'; document.getElementById('register-form').style.display = 'block'; };
            document.getElementById('show-login-btn').onclick = () => { document.getElementById('login-form').style.display = 'block'; document.getElementById('register-form').style.display = 'none'; };
            document.getElementById('login-btn').onclick = () => auth.signInWithEmailAndPassword(document.getElementById('login-email').value, document.getElementById('login-password').value).catch(e => alert(e.message));
            document.getElementById('register-btn').onclick = () => auth.createUserWithEmailAndPassword(document.getElementById('register-email').value, document.getElementById('register-password').value).catch(e => alert(e.message));
            document.getElementById('logout-btn').onclick = () => auth.signOut();
            document.getElementById('view-store-btn').onclick = () => window.open(`loja.html?userId=${currentUser.uid}`, '_blank');
            
            document.querySelectorAll('.tab-button').forEach(button => {
                button.addEventListener('click', () => {
                    if(button.id === 'view-store-btn') return;
                    document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');
                    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
                    document.getElementById(`${button.dataset.tab}-tab`).classList.add('active');
                });
            });

            function getRef(path = '') { return database.ref(`stores/${currentUser.uid}/${path}`); }

            function loadStoreData() {
                getRef().on('value', snapshot => {
                    const data = snapshot.val() || {};
                    document.getElementById('store-name').value = data.name || '';
                    document.getElementById('store-description').value = data.description || '';
                    document.getElementById('store-logo').value = data.logo || '';
                    document.getElementById('store-whatsapp').value = data.whatsapp || '';
                    document.getElementById('store-color').value = data.color || '#4A90E2';
                    
                    renderItems('categories', data.categories || {}, document.getElementById('categories-list'));
                    renderItems('paymentMethods', data.paymentMethods || {}, document.getElementById('payment-methods-list'));
                    renderItems('deliveryOptions', data.deliveryOptions || {}, document.getElementById('delivery-options-list'));
                    
                    allAdminProducts = data.products ? Object.entries(data.products).map(([id, p]) => ({ id, ...p })) : [];
                    applyAdminProductFilters();
                    
                    populateCategorySelects(data.categories || {});
                    populateCategoryFilter(data.categories || {});
                });
            }

            document.getElementById('save-store-btn').onclick = () => {
                getRef().update({
                    name: document.getElementById('store-name').value,
                    description: document.getElementById('store-description').value,
                    logo: document.getElementById('store-logo').value,
                    whatsapp: document.getElementById('store-whatsapp').value,
                    color: document.getElementById('store-color').value
                }).then(() => alert('Loja atualizada!'));
            };

            function setupAddItem(inputId, path) {
                const input = document.getElementById(inputId);
                const addButton = input.nextElementSibling;
                addButton.onclick = () => {
                    if (input.value.trim()) getRef(path).push(input.value.trim()).then(() => input.value = '');
                };
            }
            setupAddItem('new-category-name', 'categories');
            setupAddItem('new-payment-method-input', 'paymentMethods');
            setupAddItem('new-delivery-option-input', 'deliveryOptions');

            function renderItems(path, data, container) {
                container.innerHTML = '';
                Object.entries(data).forEach(([key, value]) => {
                    const tag = document.createElement('div');
                    tag.className = 'tag';
                    tag.innerHTML = `<span>${value}</span><i class="material-icons-outlined delete-btn">close</i>`;
                    tag.querySelector('.delete-btn').onclick = () => getRef(`${path}/${key}`).remove();
                    container.appendChild(tag);
                });
            }

            function populateCategorySelects(categoriesData) {
                const selects = [document.getElementById('product-category'), document.getElementById('edit-product-category')];
                selects.forEach(select => {
                    select.innerHTML = '<option value="">Sem Categoria</option>';
                    Object.entries(categoriesData).forEach(([id, name]) => select.innerHTML += `<option value="${id}">${name}</option>`);
                });
            }

            const stockToggle = document.getElementById('product-outofstock');
            const stockStatusSpan = document.getElementById('product-stock-status');
            stockToggle.onchange = () => stockStatusSpan.textContent = stockToggle.checked ? 'Disponível' : 'Esgotado';

            document.getElementById('add-product-btn').onclick = () => {
                const product = {
                    name: document.getElementById('product-name').value,
                    description: document.getElementById('product-description').value,
                    price: parseFloat(document.getElementById('product-price').value),
                    image: document.getElementById('product-image').value,
                    category: document.getElementById('product-category').value,
                    isOutOfStock: !stockToggle.checked
                };
                if(product.name && product.price > 0) {
                    getRef('products').push(product).then(() => {
                        ['product-name', 'product-description', 'product-price', 'product-image', 'product-category'].forEach(id => document.getElementById(id).value = '');
                        stockToggle.checked = false; stockStatusSpan.textContent = 'Esgotado';
                    });
                } else { alert('Nome e preço são obrigatórios.'); }
            };

            const adminProductSearch = document.getElementById('admin-product-search');
            const adminCategoryFilter = document.getElementById('admin-product-category-filter');
            adminProductSearch.addEventListener('input', applyAdminProductFilters);
            adminCategoryFilter.addEventListener('change', applyAdminProductFilters);

            function populateCategoryFilter(categoriesData) {
                adminCategoryFilter.innerHTML = '<option value="all">Todas as Categorias</option>';
                Object.entries(categoriesData).forEach(([id, name]) => adminCategoryFilter.innerHTML += `<option value="${id}">${name}</option>`);
            }

            function applyAdminProductFilters() {
                const searchTerm = adminProductSearch.value.toLowerCase();
                const categoryId = adminCategoryFilter.value;
                let filtered = [...allAdminProducts];
                if (searchTerm) filtered = filtered.filter(p => p.name.toLowerCase().includes(searchTerm));
                if (categoryId !== 'all') filtered = filtered.filter(p => p.category === categoryId);
                renderAdminProducts(filtered);
            }

            function renderAdminProducts(products) {
                const grid = document.getElementById('products-list');
                grid.innerHTML = '';
                products.forEach(product => {
                    const card = document.createElement('div');
                    card.className = 'admin-product-card';
                    let badgeHTML = '';
                    if (product.isOutOfStock) {
                        badgeHTML = `<div class="outofstock-badge">Esgotado</div>`;
                    }
                    card.innerHTML = `
                        ${badgeHTML}
                        <div class="admin-product-card__image" style="background-image: url('${product.image || ''}')"></div>
                        <div class="admin-product-card__info">
                            <div class="admin-product-card__name">${product.name}</div>
                            <div class="admin-product-card__price">R$ ${product.price.toFixed(2).replace('.', ',')}</div>
                        </div>
                        <div class="admin-product-card__actions">
                            <button class="btn-outlined edit-btn" style="flex:1;">Editar</button>
                            <button class="btn-outlined delete-btn" style="flex:1; color: var(--cor-erro); border-color: var(--cor-erro);">Excluir</button>
                        </div>
                    `;
                    card.querySelector('.edit-btn').onclick = () => showEditModal(product.id, product);
                    card.querySelector('.delete-btn').onclick = () => { if (confirm(`Excluir "${product.name}"?`)) getRef(`products/${product.id}`).remove(); };
                    grid.appendChild(card);
                });
            }

            const editModal = document.getElementById('edit-product-modal');
            const editStockToggle = document.getElementById('edit-product-outofstock');
            const editStockStatusSpan = document.getElementById('edit-product-stock-status');
            editStockToggle.onchange = () => editStockStatusSpan.textContent = editStockToggle.checked ? 'Disponível' : 'Esgotado';

            function showEditModal(id, product) {
                document.getElementById('edit-product-id').value = id;
                document.getElementById('edit-product-name').value = product.name;
                document.getElementById('edit-product-description').value = product.description;
                document.getElementById('edit-product-price').value = product.price;
                document.getElementById('edit-product-image').value = product.image;
                document.getElementById('edit-product-category').value = product.category || '';
                const isAvailable = !product.isOutOfStock;
                editStockToggle.checked = isAvailable;
                editStockStatusSpan.textContent = isAvailable ? 'Disponível' : 'Esgotado';
                editModal.classList.add('show');
            }
            document.getElementById('cancel-edit-btn').onclick = () => editModal.classList.remove('show');
            document.getElementById('save-edit-btn').onclick = () => {
                const id = document.getElementById('edit-product-id').value;
                const updatedProduct = {
                    name: document.getElementById('edit-product-name').value,
                    description: document.getElementById('edit-product-description').value,
                    price: parseFloat(document.getElementById('edit-product-price').value),
                    image: document.getElementById('edit-product-image').value,
                    category: document.getElementById('edit-product-category').value,
                    isOutOfStock: !editStockToggle.checked
                };
                if (updatedProduct.name && updatedProduct.price > 0) {
                    getRef(`products/${id}`).update(updatedProduct).then(() => editModal.classList.remove('show'));
                } else { alert('Nome e preço são obrigatórios.'); }
            };
        });
    </script>
</body>
</html>
